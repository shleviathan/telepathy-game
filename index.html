// 資料內容沒變就不要重新 render()：避免彈跳視窗（設定/玩法說明）在開著的時候，
// 因為背景輪詢或監聽觸發整個畫面重繪、視窗看起來一直閃一下（重新播放滑入動畫）。
function sameData(a,b){
  try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; }
}

function connectRoom(){
  const d = db;
  roomRef = wrapRoomRef(d.doc(`telepathyrooms/${identity.code}`));
  playersCol = roomRef.collection("players");
  roomData = null; playersData = [];
  expireCleanupDone = false;
  soundedRound = null;
  mlRevealAnimRound = null; mlRevealReady = false; mlSoundedRound = null; mlRankOrder = null; mlRankOrderRound = null;
  drawingInProgress = false; drawGuessInput = ""; strokesData = []; drawPromptAnimRound = null; drawPromptAnimating = false;
  witchPoisonPickOpen = false;
  if(unsubRoom) unsubRoom();
  if(unsubPlayers) unsubPlayers();
  unsubRoom = roomRef.onSnapshot(snap=>{
    const next = {exists: snap.exists, ...(snap.data()||{})};
    if(sameData(next, roomData)) return;
    roomData = next;
    render();
  }, ()=>{ roomData = {exists:false}; render(); });
  unsubPlayers = playersCol.onSnapshot(qsnap=>{
    applyPlayers(qsnap.docs.map(dd=>({id:dd.id, ...dd.data()})));
  }, ()=>{});
  render();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollRoomOnce, 2000);
  startPresence();
}

// 保底機制：即時監聽偶爾會漏更新（尤其手機網路不穩時），
// 每幾秒主動抓一次最新房間狀態，避免有人卡在舊畫面看不到別人已經開始遊戲。
// 資料跟目前畫面一樣的話就不 render()，不然設定/玩法說明視窗開著的時候會一直被重畫、看起來像自動刷新。
async function pollRoomOnce(){
  if(!roomRef) return;
  try{
    const snap = await roomRef.get();
    const next = {exists: snap.exists, ...(snap.data()||{})};
    if(!sameData(next, roomData)){ roomData = next; render(); }
  }catch(e){}
  if(!playersCol) return;
  try{
    const qsnap = await playersCol.get();
    applyPlayers(qsnap.docs.map(dd=>({id:dd.id, ...dd.data()})));
  }catch(e){}
}

// 這一題「在線的玩家」是不是都投了（離線的人不用等，不然會卡到時間結束）。
function voteRoundComplete(){
  if(!playersData.length || !identity) return false;
  const voted = new Set(votesData.map(v=>v.playerId));
  return onlineIdsOf(playersData, Date.now(), identity.playerId).every(id=> voted.has(id));
}

function manageVoteSub(phase){
  const wantVotes = phase === "question";
  if(wantVotes && !unsubVotes){
    votesCol = roomRef.collection("votes");
    unsubVotes = votesCol.where("round","==",roomData.round).onSnapshot(qsnap=>{
      votesData = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
      render();
      if(voteRoundComplete()){
        if(roomData && roomData.gameType==="mostlikely") tryResolveML(); else tryResolve();
      }
    }, ()=>{});
  } else if(!wantVotes && unsubVotes){
    unsubVotes(); unsubVotes = null; votesData = [];
  }
}

function manageTicking(phase){
  const should = phase === "question" || phase === "drawing";
  if(should && !tickTimer){
    tickTimer = setInterval(()=>{
      if(drawingInProgress || drawPromptAnimating) return; // 正在畫的時候/拉霸動畫播放中先不要因為倒數計時重畫打斷
      render();
      if(remainingSeconds()<=0){
        if(roomData && roomData.gameType==="mostlikely") tryResolveML();
        else if(roomData && roomData.gameType==="draw") tryAdvanceDraw();
        else tryResolve();
      }
    }, 250);
  } else if(!should && tickTimer){
    clearInterval(tickTimer); tickTimer = null;
  }
}

// 「接力畫猜」的筆畫：跟 votes 一樣，依目前這一輪 round 訂閱，畫畫/猜謎/公布答案時都要看得到已經畫的東西。
function manageStrokeSub(phase){
  const wantStrokes = roomData && roomData.gameType==="draw" && (phase==="drawing" || phase==="guessing" || phase==="reveal");
  if(wantStrokes && !unsubStrokes){
    strokesCol = roomRef.collection("strokes");
    unsubStrokes = strokesCol.where("round","==",roomData.round).onSnapshot(qsnap=>{
      strokesData = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
      if(!drawingInProgress) render();
    }, ()=>{});
  } else if(!wantStrokes && unsubStrokes){
    unsubStrokes(); unsubStrokes = null; strokesData = [];
  }
}

function leaveToHome(){
  if(unsubRoom) unsubRoom(); if(unsubPlayers) unsubPlayers(); if(unsubVotes) unsubVotes(); if(unsubStrokes) unsubStrokes();

  stopPresence();
  if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
  clearRevealTimers(); revealAnimRound = null; revealStage = 0;
  mlRevealAnimRound = null; mlRevealReady = false; mlSoundedRound = null; mlRankOrder = null; mlRankOrderRound = null;

  witchPoisonPickOpen = false;
  unsubRoom=unsubPlayers=unsubVotes=unsubStrokes=null; roomRef=playersCol=votesCol=strokesCol=null; roomData=null; playersData=[]; votesData=[];

}

async function doStartGame(){
  const players = playersData;
  if(players.length<2) return;
  if(!players.every(p=>p.ready)){ startError = "還有人沒按「我準備好了」，等他們準備好才能開始"; render(); return; }
  const settings = roomData.settings || {duration:15, targetStrikes:3, enabledCategories:ALL_CATEGORY_IDS};
  const {idx, pool, resetUsed} = pickQuestion([], settings.enabledCategories);
  if(idx<0){ startError = "選取的題目類型目前沒有任何題目，請至少勾選一種類型"; render(); return; }
  startError = "";
  const {q, options} = materializeQuestion(pool[idx], players, 1);
  const usedQKeys = [pool[idx].key];
  try{
    await clearAllVotes();
    await Promise.all(players.map(p=> playersCol.doc(p.id).update({strikes:0})));
    clearRevealTimers(); revealAnimRound = null; revealStage = 0;
    await roomRef.update({
      phase:"question", round:1, currentQuestion:{q, options},
      roundEndAt: Date.now() + settings.duration*1000, revealLog:[], losers:[], usedQKeys, lastActivityAt: Date.now()
    });
  }catch(e){}
}

async function tryResolve(){
  if(resolveBusy) return;
  if(!roomData || roomData.phase!=="question") return;
  resolveBusy = true;
  try{
    // 短租約鎖 + 重新抓房間/玩家（冪等：已經結算過 phase 就不是 question 了）。搶不到鎖就算了，
    // 別的客戶端正在結算，或之後由計時器 / 房主看門狗再試。
    await withFreshRoom(async (fd, freshPlayers)=>{
      if(fd.phase!=="question") return;
      // 玩家名單用現場抓的，不要用本地快取的 playersData——
      // 這裡會有 await，快取可能在等待期間被 onSnapshot 換成「已經扣過分」的新資料，
      // 如果還拿快取來算「扣分後是不是達標」會整組多算一次分（導致明明還沒到目標分數就結束遊戲）。
      const allVotedSnap = await votesCol.where("round","==",fd.round).get().catch(()=>({docs:[]}));
      const roundVotes = allVotedSnap.docs.map(dd=>dd.data());
      const timeUp = Date.now() >= (fd.roundEndAt||0);
      const voted = new Set(roundVotes.map(v=>v.playerId));
      // 離線的人不用等：只要在線的人都投了就結算（沒投的人照舊算沒作答）。
      const allVoted = freshPlayers.length>0 && onlineIdsOf(freshPlayers, Date.now(), identity.playerId).every(id=> voted.has(id));
      if(!timeUp && !allVoted) return;

      const byOption = {A:[],B:[],C:[],D:[]};
      const votedIds = new Set();
      roundVotes.forEach(v=>{ if(byOption[v.choice]){ byOption[v.choice].push(v.playerId); votedIds.add(v.playerId); } });
      const mode = (fd.settings && fd.settings.mode) || "normal";
      const struckIds = [];
      if(mode==="majority"){
        const counts = LETTERS.map(L=>byOption[L].length).filter(c=>c>0);
        const maxCount = counts.length ? Math.max(...counts) : 0;
        const leading = new Set(LETTERS.filter(L=>byOption[L].length===maxCount && maxCount>0));
        LETTERS.forEach(L=>{ if(byOption[L].length>0 && !leading.has(L)) struckIds.push(...byOption[L]); });
      } else {
        LETTERS.forEach(L=>{ if(byOption[L].length===1) struckIds.push(byOption[L][0]); });
      }
      const noAnswerIds = freshPlayers.map(p=>p.id).filter(id=>!votedIds.has(id));
      const allStruck = new Set([...struckIds, ...noAnswerIds]);

      const newStrikesById = new Map();
      await Promise.all(freshPlayers.map(p=>{
        if(allStruck.has(p.id)){
          const ns = (p.strikes||0)+1;
          newStrikesById.set(p.id, ns);
          return playersCol.doc(p.id).update({strikes:ns});
        }
        return Promise.resolve();
      }));

      const target = (fd.settings && fd.settings.targetStrikes) || 3;
      const losers = freshPlayers.filter(p=> newStrikesById.has(p.id) && newStrikesById.get(p.id) >= target).map(p=>({id:p.id, name:p.name}));

      const log = (fd.revealLog||[]).slice();
      log.push({round: fd.round, q: fd.currentQuestion.q, options: fd.currentQuestion.options, byOption, struckIds, noAnswerIds});

      if(losers.length>0){
        await roomRef.update({phase:"ended", losers, revealLog: log, lastActivityAt: Date.now()});
      } else {
        await roomRef.update({phase:"reveal", revealLog: log, lastActivityAt: Date.now()});
      }
    }, {tries:4});
  }catch(e){}
  resolveBusy = false;
}

async function doNextQuestion(){
  const settings = roomData.settings || {duration:15, targetStrikes:3, enabledCategories:ALL_CATEGORY_IDS};
  const {idx, pool, resetUsed} = pickQuestion(roomData.usedQKeys, settings.enabledCategories);
  if(idx<0) return;
  const nextRound = (roomData.round||1)+1;
  const {q, options} = materializeQuestion(pool[idx], playersData, nextRound);
  const usedQKeys = resetUsed ? [pool[idx].key] : [...(roomData.usedQKeys||[]), pool[idx].key];
  try{
    await roomRef.update({
      phase:"question", round:nextRound, currentQuestion:{q, options},
      roundEndAt: Date.now() + settings.duration*1000, usedQKeys, lastActivityAt: Date.now()
    });
  }catch(e){}
}

// ---------- 同步：短租約鎖 + 退避重試 / 玩家欄位原子寫入 / 心跳 / 看門狗 ----------

function sleepMs(ms){ return new Promise(r=>setTimeout(r, ms)); }

// 在「短租約鎖」裡執行 fn：搶不到就指數退避 + 抖動重試（最多 tries 次）；不管 fn 成功或丟例外，一定釋放鎖。
// 回傳 {ok:true, value}；搶不到回傳 {ok:false}（呼叫端必須處理，不可以默默吞掉使用者的動作）；fn 丟的例外會原樣往外丟。
async function withRoomLock(fn, opts){
  opts = opts || {};
  const tries = opts.tries || LOCK_TRIES;
  const ttl = opts.ttl || LOCK_TTL_MS;
  const ref = roomRef;
  const me = identity ? identity.playerId : "anon";
  for(let i=0;i<tries;i++){
    const holder = me + "#" + Math.random().toString(36).slice(2,8);
    let lease = null;
    try{ lease = await lockRoom(ref, holder, ttl); }catch(e){ lease = null; }
    if(lease && lease.acquired){
      try{
        return {ok:true, value: await fn()};
      } finally {
        try{ await unlockRoom(ref, holder); }catch(e){}
      }
    }
    if(i<tries-1) await sleepMs(backoffDelay(i));
  }
  return {ok:false};
}

async function freshPlayerList(){
  const snap = await playersCol.get().catch(()=>({docs:[]}));
  return snap.docs.map(dd=>({id:dd.id, ...dd.data()}));
}
// 鎖 + 重新抓房間與玩家 + 呼叫 fn(fd, players)：所有「結算」類動作都走這條（fn 自己要再確認 phase，保持冪等）。
async function withFreshRoom(fn, opts){
  return withRoomLock(async ()=>{
    const snap = await roomRef.get().catch(()=>null);
    if(!snap || !snap.exists) return undefined;
    const players = await freshPlayerList();
    return fn(snap.data(), players);
  }, opts);
}

// 每個人只寫「自己的」欄位（例如 teamVotes.<我的id>），不需要鎖，同時送出也不會互相蓋掉。
// 寫入失敗（網路）會退避重試；回傳 true 表示確定寫進去了（或房間已經進到下一階段）。
async function writeOwnField(path, value, expectPhase){
  for(let i=0;i<4;i++){
    try{
      await patchDoc(roomRef, {[path]: value, lastActivityAt: Date.now()});
      if(!VERIFY_FIELD_WRITES) return true;
      const snap = await roomRef.get().catch(()=>null);
      if(!snap || !snap.exists) return false;
      const d = snap.data();
      if(expectPhase && d.phase!==expectPhase) return true;   // 已經進到下一階段，不要再往新階段重寫
      if(deepEq(getPathValue(d, path), value)) return true;
    }catch(e){}
    await sleepMs(backoffDelay(i));
  }
  return false;
}

// 小提示（沒送出成功時叫使用者再按一次）。不依賴畫面重繪。
let toastTimer = null;
function showToast(msg){
  try{
    let el = document.getElementById("syncToast");
    if(!el){
      el = document.createElement("div"); el.id = "syncToast"; el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = "1";
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ try{ el.style.opacity = "0"; }catch(e){} }, 2800);
  }catch(e){}
}
const MSG_RETRY = "沒有送出成功，請再按一次";

// ---------- 在線狀態（心跳）----------
let hbTimer = null, wdTimer = null, lastHbAt = 0, lastOnlineKey = "", watchdogBusy = false;

function pageVisible(){
  try{ return !document.visibilityState || document.visibilityState==="visible"; }catch(e){ return true; }
}
function sendHeartbeat(force){
  if(!identity || !playersCol) return;
  if(!pageVisible()) return;
  const now = Date.now();
  if(now - lastHbAt < 2000) return;   // 事件（focus / visibilitychange / online）可能一起觸發，擋掉重複寫入
  lastHbAt = now;
  try{ playersCol.doc(identity.playerId).update({lastSeen: now}).catch(()=>{}); }catch(e){}
}
function onlineKey(){
  const now = Date.now();
  return playersData.filter(p=> p.id===(identity&&identity.playerId) || isOnline(p, now)).map(p=>p.id).join(",");
}
function currentHostId(){
  return pickHostId(playersData, Date.now(), identity ? identity.playerId : null);
}
function isHostNow(players){
  return !!identity && pickHostId(players||playersData, Date.now(), identity.playerId)===identity.playerId;
}
// 在線玩家的 id（沒有任何人在線時退回全部）：挑下一位猜謎者/基準者/隊長時不要挑到離線的人。
function presentIds(){
  const o = onlineIdsOf(playersData, Date.now(), identity && identity.playerId);
  return o.length ? o : playersData.map(p=>p.id);
}
function offBadge(p){ return offBadgeHtml(p, Date.now(), identity && identity.playerId); }

// 玩家名單更新：只有 lastSeen 變了而其他資料沒變時不重畫；但「誰在線」的集合變了要重畫。
function applyPlayers(next){
  const changed = !sameData(stripSeen(next), stripSeen(playersData));
  playersData = next;
  const k = onlineKey();
  const kc = k !== lastOnlineKey;
  lastOnlineKey = k;
  if(changed || kc) render();
}

function startPresence(){
  stopPresence();
  lastHbAt = 0; lastOnlineKey = "";
  sendHeartbeat(true);
  hbTimer = setInterval(()=> sendHeartbeat(false), HEARTBEAT_MS);
  wdTimer = setInterval(watchdogTick, WATCHDOG_MS);
}
function stopPresence(){
  if(hbTimer){ clearInterval(hbTimer); hbTimer = null; }
  if(wdTimer){ clearInterval(wdTimer); wdTimer = null; }
}

// ---------- 看門狗：由「目前的房主」每 ~5 秒檢查一次，離線玩家造成的卡關自動往前推 ----------
async function watchdogTick(){
  if(!identity || !roomRef || !roomData || !roomData.exists) return;
  const k = onlineKey();
  if(k !== lastOnlineKey){ lastOnlineKey = k; render(); }
  if(watchdogBusy || !pageVisible()) return;
  const phase = roomData.phase;
  if(!phase || phase==="lobby" || phase==="ended") return;
  if(!isHostNow()) return;
  watchdogBusy = true;
  try{ await runWatchdog(); }catch(e){}
  watchdogBusy = false;
}
async function runWatchdog(){
  const gt = (roomData && roomData.gameType) || "telepathy";
  if(gt==="avalon") return avalonWatchdog();
  if(gt==="codenames") return cnWatchdog();
  if(gt==="justone") return joWatchdog();
  if(gt==="werewolf") return wwWatchdog();
  if(gt==="draw") return drawWatchdog();
  // 誰最可能 / 心電感應：在線的人都投完、或時間到，就由房主補一次結算（平常是最後一位投票者自己觸發）
  if(voteRoundComplete() || remainingSeconds()<=0) return gt==="mostlikely" ? tryResolveML() : tryResolve();
}

// 畫畫順序：依加入順序、排除猜謎者與離線的人（全員離線時退回全部，避免空名單）。
function drawOrderFor(players, guesserId){
  const now = Date.now(), me = identity && identity.playerId;
  const ord = joinOrder(players).filter(p=>p.id!==guesserId);
  const on = ord.filter(p=> p.id===me || isOnline(p, now));
  return (on.length ? on : ord).map(p=>p.id);
}

// 接力畫猜的「下一步」判斷（純函式）：畫畫階段時間到、或目前輪到的畫家離線 → 換下一位（或進猜謎）；
// 猜謎階段猜謎者離線 → 直接公布答案（沒有輸入答案）。其他情況回傳 null。
function drawPlan(fd, players, now, selfId){
  if(!fd) return null;
  const on = new Set(onlineIdsOf(players, now, selfId));
  const present = new Set((players||[]).map(p=>p.id));
  if(fd.phase==="drawing"){
    const drawerId = (fd.drawOrder||[])[fd.currentDrawerIndex||0];
    const timeUp = now >= (fd.roundEndAt||0);
    const gone = !!drawerId && (!present.has(drawerId) || !on.has(drawerId));
    if(timeUp || gone) return {kind:"advance", reason: timeUp ? "time" : "offline"};
    return null;
  }
  if(fd.phase==="guessing"){
    const g = fd.currentGuesserId;
    if(g && (!present.has(g) || !on.has(g))) return {kind:"reveal"};
  }
  return null;
}

async function tryAdvanceDraw(){
  if(resolveBusy) return;
  if(!roomData || roomData.phase!=="drawing") return;
  resolveBusy = true;
  try{
    await withFreshRoom(async (fd, players)=>{
      if(fd.phase!=="drawing") return;
      const plan = drawPlan(fd, players, Date.now(), identity.playerId);
      if(!plan || plan.kind!=="advance") return;
      const drawOrder = fd.drawOrder||[];
      const nextIndex = (fd.currentDrawerIndex||0)+1;
      const settings = fd.settings || {turnSeconds:12, totalRounds:6};
      if(nextIndex >= drawOrder.length){
        await roomRef.update({phase:"guessing", lastActivityAt: Date.now()});
      } else {
        await roomRef.update({currentDrawerIndex: nextIndex, roundEndAt: Date.now()+settings.turnSeconds*1000, lastActivityAt: Date.now()});
      }
    }, {tries:4});
  }catch(e){}
  resolveBusy = false;
}

async function tryResolveML(){
  if(resolveBusy) return;
  if(!roomData || roomData.phase!=="question") return;
  resolveBusy = true;
  try{
    await withFreshRoom(async (fd, freshPlayers)=>{
      if(fd.phase!=="question") return;
      const allVotedSnap = await votesCol.where("round","==",fd.round).get().catch(()=>({docs:[]}));
      const roundVotes = allVotedSnap.docs.map(dd=>dd.data());
      const timeUp = Date.now() >= (fd.roundEndAt||0);
      const voted = new Set(roundVotes.map(v=>v.playerId));
      // 離線的人不用等：在線的人都送出排序就結算。
      const allVoted = freshPlayers.length>0 && onlineIdsOf(freshPlayers, Date.now(), identity.playerId).every(id=> voted.has(id));
      if(!timeUp && !allVoted) return;

      // 用基準者自己送出的排序當這一題的標準答案；基準者沒送出就整題不計分。
      const baseVote = roundVotes.find(v=>v.playerId===fd.currentBaseId);
      const baseRanking = baseVote ? baseVote.ranking : null;
      const gainedById = {};
      freshPlayers.forEach(p=>{ gainedById[p.id]=0; });
      if(baseRanking){
        roundVotes.forEach(v=>{
          if(v.playerId===fd.currentBaseId) return; // 基準者這輪不跟自己比對、不計分
          let matches = 0;
          (v.ranking||[]).forEach((id,i)=>{ if(baseRanking[i]===id) matches++; });
          gainedById[v.playerId] = matches;
        });
        await Promise.all(freshPlayers.map(p=>{
          const gained = gainedById[p.id]||0;
          if(gained>0) return playersCol.doc(p.id).update({mlScore:(p.mlScore||0)+gained});
          return Promise.resolve();
        }));
      }

      const log = (fd.revealLog||[]).slice();
      log.push({
        round: fd.round, prompt: fd.currentPrompt, baseId: fd.currentBaseId, baseRanking,
        votes: roundVotes.map(v=>({playerId:v.playerId, ranking:v.ranking})), gainedById
      });

      // 一律先進 reveal 讓大家看這輪結果；是不是最後一題、要不要看總結，交給房主在 reveal 畫面按按鈕決定。
      await roomRef.update({phase:"reveal", revealLog: log, lastActivityAt: Date.now()});
    }, {tries:4});
  }catch(e){}
  resolveBusy = false;
}

// 夜晚的每個動作都在短租約鎖裡「重新抓房間、確認還在對的步驟」才寫入（冪等），
// 這樣房主端看門狗跳過離線玩家的步驟時，不會和剛好回來的玩家互相蓋掉。
async function wwNightAct(step, myRole, fn){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const r = await withFreshRoom(async (fd, players)=>{
      if(fd.phase!=="night" || fd.nightStep!==step) return;
      if((fd.roles||{})[identity.playerId]!==myRole) return;
      await fn(fd, players);
    }, {tries:6});
    if(!r.ok) showToast(MSG_RETRY);
  }catch(e){ showToast(MSG_RETRY); }
  voteBusy = false;
}
// 這個步驟做完：有下一步就換步驟，沒有就直接結算死亡（呼叫時已經在鎖裡）。
async function wwFinishStep(step, fd, players, patch){
  const nStep = nextNightStep(step, (fd.settings||{}).roles, fd.roles||{}, players);
  patch.lastActivityAt = Date.now();
  if(nStep) patch.nightStep = nStep;
  await roomRef.update(patch);
  if(!nStep) await wwResolveNightDeathsInner();
}

async function doGuardPick(targetId){

// 狼人投票：每隻狼只寫自己的 wolfVotes.<id>（不需要鎖）；寫完由 resolveWolfVotes 拿短租約鎖結算
// （在線的活狼都投了才算出最多票的目標；平票時採用「加入順序最早的那隻狼投的目標」當決勝）。
async function doWolfVote(targetId){
  if(voteBusy) return;
  voteBusy = true;
  let wrote = false;
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="night" || fresh.data().nightStep!=="wolf"){ voteBusy=false; return; }
    wrote = await writeOwnField("wolfVotes."+identity.playerId, targetId, "night");
    if(!wrote) showToast(MSG_RETRY);
  }catch(e){ showToast(MSG_RETRY); }
  voteBusy = false;
  if(wrote) await resolveWolfVotes();
}
async function wwResolveWolfInner(fd, players){
  const roles = fd.roles || {};
  const wolfVotes = fd.wolfVotes || {};
  const voters = joinOrder(players.filter(p=>p.alive!==false && roles[p.id]==="wolf")).filter(w=> wolfVotes[w.id]!=null);
  const counts = {};
  voters.forEach(w=>{ const t = wolfVotes[w.id]; counts[t] = (counts[t]||0)+1; });
  let bestTarget = null, bestCount = -1;
  voters.forEach(w=>{
    const t = wolfVotes[w.id];
    if(counts[t] > bestCount){ bestCount = counts[t]; bestTarget = t; }
  });
  await wwFinishStep("wolf", fd, players, {wolfTarget: bestTarget});
}
async function resolveWolfVotes(){
  try{
    await withFreshRoom(async (fd, players)=>{
      if(fd.phase!=="night" || fd.nightStep!=="wolf") return;
      const plan = wwPlan(fd, players, Date.now(), identity.playerId);
      if(plan && plan.kind==="resolveWolf") await wwResolveWolfInner(fd, players);
    }, {tries:6});
  }catch(e){}
}

  });

// 女巫永遠是夜晚行動順序的最後一步，所以做完動作之後一定直接進結算，不用再算下一步。
async function doWitchAct(action, targetId){
  await wwNightAct("witch", "witch", async (fd)=>{
    const patch = {witchAction: action, lastActivityAt: Date.now()};
    if(action==="save") patch.witchSaveUsed = true;
    if(action==="poison"){ patch.witchPoisonTarget = targetId; patch.witchPoisonUsed = true; }
    await roomRef.update(patch);
    await wwResolveNightDeathsInner();
  });
}

// 夜晚行動全部做完後結算死亡名單：醫生守到的人不會死、女巫救的人不會死，剩下才是真的死掉的人。
// （Inner 版本：呼叫時必須已經拿著鎖。）
async function wwResolveNightDeathsInner(){
  const fresh = await roomRef.get().catch(()=>null);
  if(!fresh || !fresh.exists || fresh.data().phase!=="night") return;
  const fd = fresh.data();
  const guardTarget = fd.guardTarget, wolfTarget = fd.wolfTarget;
  const survivedByGuard = guardTarget!=null && guardTarget===wolfTarget;
  const survivedByWitch = fd.witchAction==="save";
  const wolfKilled = (wolfTarget && !survivedByGuard && !survivedByWitch) ? wolfTarget : null;
  const poisonKilled = fd.witchAction==="poison" ? fd.witchPoisonTarget : null;
  const deathsSet = new Set();
  if(wolfKilled) deathsSet.add(wolfKilled);
  if(poisonKilled) deathsSet.add(poisonKilled);
  const nightDeaths = Array.from(deathsSet);
  await Promise.all(nightDeaths.map(id=> playersCol.doc(id).update({alive:false})));
  await finalizeDeaths(nightDeaths, "daydeaths");
}

// 淘汰名單裡如果有還沒開過槍的獵人，先讓獵人補一槍再繼續；沒有獵人就直接檢查有沒有人獲勝。
async function finalizeDeaths(newDeathIds, nextPhaseIfNoWinner){
  try{
    const fresh = await roomRef.get().catch(()=>null);
    const fd = fresh && fresh.exists ? fresh.data() : {};
    const roles = fd.roles || {};
    const hunterQueue = newDeathIds.filter(id=> roles[id]==="hunter");
    if(hunterQueue.length>0){
      await roomRef.update({
        nightDeaths: [...(fd.nightDeaths||[]), ...newDeathIds],
        hunterQueue, hunterNextPhase: nextPhaseIfNoWinner, phase:"hunter", lastActivityAt: Date.now()
      });
    } else {
      await checkWinAndAdvance(nextPhaseIfNoWinner, newDeathIds);
    }
  }catch(e){}
}

// 每次死人之後都重新用資料庫現場的玩家名單算一次雙方存活人數，判斷有沒有人贏了；
// 沒人贏就照原本排定的下一個 phase 繼續。
async function checkWinAndAdvance(nextPhase, newDeathIdsToAppend){
  try{
    const fresh = await roomRef.get().catch(()=>null);
    const fd = fresh && fresh.exists ? fresh.data() : {};
    const roles = fd.roles || {};
    const freshPlayersSnap = await playersCol.get().catch(()=>({docs:[]}));
    const freshPlayers = freshPlayersSnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    const aliveWolves = freshPlayers.filter(p=>p.alive!==false && roles[p.id]==="wolf");
    const aliveGood = freshPlayers.filter(p=>p.alive!==false && roles[p.id]!=="wolf");
    const patch = {lastActivityAt: Date.now()};
    if(newDeathIdsToAppend && newDeathIdsToAppend.length){
      patch.nightDeaths = [...(fd.nightDeaths||[]), ...newDeathIdsToAppend];
    }
    if(aliveWolves.length===0){
      patch.winner = "villager"; patch.phase = "ended";
    } else if(aliveWolves.length >= aliveGood.length){
      patch.winner = "wolf"; patch.phase = "ended";
    } else {
      patch.phase = nextPhase;
    }
    await roomRef.update(patch);
  }catch(e){}
}

// 獵人開槍（targetId=null 代表不開槍；獵人離線時看門狗也會用「不開槍」往前推）。
async function wwHunterInner(fd, targetId){
  let deaths = [];
  if(targetId){
    await playersCol.doc(targetId).update({alive:false});
    deaths = [targetId];
  }
  const nightDeaths = [...(fd.nightDeaths||[]), ...deaths];
  const hunterQueue = (fd.hunterQueue||[]).slice(1);
  await roomRef.update({nightDeaths, hunterQueue, lastActivityAt: Date.now()});
  if(hunterQueue.length===0){
    await checkWinAndAdvance(fd.hunterNextPhase, []);
  }
}

// 統計非棄票的票數，票數最高且唯一的目標才會被淘汰；平票（或大家都棄票）就沒有人被淘汰。
async function resolveVoteWith(voteTally, alivePlayers){
  const counts = {};
  alivePlayers.forEach(p=>{
    const t = voteTally[p.id];
    if(t && t!=="abstain") counts[t] = (counts[t]||0)+1;
  });
  let maxCount = 0;
  Object.keys(counts).forEach(id=>{ if(counts[id]>maxCount) maxCount = counts[id]; });
  const topTargets = Object.keys(counts).filter(id=>counts[id]===maxCount);
  const eliminatedId = (maxCount>0 && topTargets.length===1) ? topTargets[0] : null;
  await roomRef.update({voteTally, voteResult: {eliminatedId, tally: counts}, phase:"voteresult", lastActivityAt: Date.now()});
  let deaths = [];
  if(eliminatedId){
    await playersCol.doc(eliminatedId).update({alive:false});
    deaths = [eliminatedId];
  }
  await finalizeDeaths(deaths, "voteresult");
}

async function wwResolveVoteInner(fd, players){
  const roles = fd.roles || {};

  const voteTally = Object.assign({}, fd.voteTally||{});
  alive.forEach(p=>{ if(voteTally[p.id]==null) voteTally[p.id] = "abstain"; });
  await resolveVoteWith(voteTally, alive);

async function wwWatchdog(){
  if(!wwPlan(roomData, playersData, Date.now(), identity.playerId)) return;
  await withFreshRoom(async (fd, players)=>{
    const plan = wwPlan(fd, players, Date.now(), identity.playerId);
    if(!plan) return;
    if(plan.kind==="resolveWolf") await wwResolveWolfInner(fd, players);
    else if(plan.kind==="skipStep"){
      if(plan.step==="witch"){ await roomRef.update({witchAction:"pass", lastActivityAt: Date.now()}); await wwResolveNightDeathsInner(); }
      else await wwFinishStep(plan.step, fd, players, {});
    }
    else if(plan.kind==="hunterSkip") await wwHunterInner(fd, null);
    else if(plan.kind==="resolveVote") await wwResolveVoteInner(fd, players);
  }, {tries:4});
}

}

async function resolveMission(){
  try{
    await withFreshRoom(async (fd, players)=>{
      const plan = avalonPlan(fd, players, Date.now(), identity.playerId);
      if(plan && plan.kind==="resolveMission") await avalonResolveMissionInner(fd);
    }, {tries:6});
  }catch(e){}

async function avalonResolveMissionInner(fd){
  const team = fd.teamSelection || [];
  const mv = fd.missionVotes || {};
  const missionNo = fd.missionNo || 1;
  const prev = fd.missionResults || [];
  if(prev.length>=missionNo) return;
  const fails = team.filter(id=> mv[id]==="fail").length;
  const n = avalonClampN(Object.keys(fd.roles||{}).length);
  const ok = fails < avalonFailsNeeded(n, missionNo);
  await roomRef.update({
    phase:"missionresult", missionResults:[...prev, {ok, fails}], lastMissionFails: fails, lastActivityAt: Date.now()
  });
}

async function avalonWatchdog(){
  if(!avalonPlan(roomData, playersData, Date.now(), identity.playerId)) return;
  await withFreshRoom(async (fd, players)=>{
    const plan = avalonPlan(fd, players, Date.now(), identity.playerId);
    if(!plan) return;
    if(plan.kind==="leader") await roomRef.update({leaderId: plan.leaderId, lastActivityAt: Date.now()});

    else if(plan.kind==="assassinMiss") await roomRef.update({phase:"ended", winner:"good", winReason:"assassinMiss", assassinTarget:null, lastActivityAt: Date.now()});
  }, {tries:4});
}

  const num = Math.max(0, Math.min(9, cnNumDraft|0));
  try{
    const ok = await cnLocked(async (fd)=>{
      if(fd.phase!=="clue") return;
      const team = fd.turnTeam;
      if(!fd.spymasters || fd.spymasters[team]!==identity.playerId) return;
      const v2 = cnValidateClue(v.word, fd.board||[]);
      if(!v2.ok){ cnClueError = v2.msg; return; }
      const log = (fd.clueLog||[]).concat([{team, word:v2.word, num}]);
      await roomRef.update({
        phase:"guess", clue:{word:v2.word, num}, guessesLeft: num===0 ? 99 : num+1,
        clueLog: log, lastActivityAt: Date.now()
      });
      cnClueDraft = ""; cnClueError = "";
      beep(520,70,"sine"); vibrate(15);
    });
    if(!ok) cnClueError = "目前有人正在操作，請再按一次";
  }catch(e){ cnClueError = "目前有人正在操作，請再按一次"; }
  voteBusy = false;
  render();
}

async function doCnGuess(){
  if(voteBusy) return;
  const idx = cnSel;
  if(idx==null) return;
  voteBusy = true;
  try{
    const ok = await cnLocked(async (fd, players)=>{
      if(fd.phase!=="guess") return;
      const meDoc = players.find(p=>p.id===identity.playerId);
      const sm = fd.spymasters || {};
      if(!meDoc || meDoc.team!==fd.turnTeam || sm[fd.turnTeam]===identity.playerId) return;
      const res = cnApplyGuess({board: fd.board||[], turnTeam: fd.turnTeam, guessesLeft: fd.guessesLeft||0}, idx);
      if(!res){ cnSel = null; return; }
      await roomRef.update({
        board: res.board, phase: res.phase, turnTeam: res.turnTeam, guessesLeft: res.guessesLeft,
        clue: res.phase==="guess" ? (fd.clue||null) : null,
        redLeft: res.redLeft, blueLeft: res.blueLeft,
        winner: res.winner, winReason: res.winReason, lastActivityAt: Date.now()
      });
      cnSel = null;
      if(res.outcome==="own"){ beep(660,90,"sine"); vibrate(20); } else { beep(180,220,"sawtooth"); vibrate([40,40,40]); }
    });
    if(!ok) showToast(MSG_RETRY);   // 選取的牌保留著，按「確定翻開」再試一次就好
  }catch(e){ showToast(MSG_RETRY); }
  voteBusy = false;
  render();
}

async function doCnEndGuess(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const ok = await cnLocked(async (fd, players)=>{
      if(fd.phase!=="guess") return;
      const meDoc = players.find(p=>p.id===identity.playerId);
      const sm = fd.spymasters || {};
      if(!meDoc || meDoc.team!==fd.turnTeam || sm[fd.turnTeam]===identity.playerId) return;
      await roomRef.update({phase:"clue", turnTeam: cnOther(fd.turnTeam), clue:null, guessesLeft:0, lastActivityAt: Date.now()});
      cnSel = null;
    });
    if(!ok) showToast(MSG_RETRY);
  }catch(e){ showToast(MSG_RETRY); }
  voteBusy = false;
  render();
}

async function cnApplyPlan(plan, fd){
  if(plan.kind==="swap"){
    const sm = Object.assign({}, fd.spymasters||{});
    sm[plan.team] = plan.spy;
    await roomRef.update({spymasters: sm, lastActivityAt: Date.now()});
  } else {
    await roomRef.update({phase:"clue", turnTeam: cnOther(fd.turnTeam), clue:null, guessesLeft:0, lastActivityAt: Date.now()});
  }
}

// 房主端看門狗：指揮官離線就自動換人、整隊猜測者都離線就跳過回合。
async function cnWatchdog(){
  if(!cnPlan(roomData, playersData, Date.now(), identity.playerId)) return;
  await withFreshRoom(async (fd, players)=>{
    const plan = cnPlan(fd, players, Date.now(), identity.playerId);
    if(plan) await cnApplyPlan(plan, fd);
  }, {tries:4});
}

// 房主的安全閥（手動按鈕）：指揮官離開/離線了就換同隊另一位當指揮官；否則直接跳過這隊目前的回合。
async function doCnForceSkip(){
  try{
    const r = await withFreshRoom(async (fd, players)=>{
      if(fd.phase!=="clue" && fd.phase!=="guess") return;
      const plan = cnPlan(fd, players, Date.now(), identity.playerId);
      if(plan && plan.kind==="swap" && fd.phase==="clue") await cnApplyPlan(plan, fd);
      else await cnApplyPlan({kind:"skip"}, fd);
    }, {tries:5});
    if(!r.ok) showToast(MSG_RETRY);
  }catch(e){}
}

// 再來一局：保留分隊、直接開新盤面；指揮官輪換成同隊下一位；有隊伍不足 2 人就回大廳重新分隊。
async function doRematchCodenames(){
  try{
    cnResetLocal();
    const players = await cnFreshPlayers();
    const fd = (await roomRef.get()).data() || {};
    const teamed = players.filter(p=>p.team==="red" || p.team==="blue");
    const reds = teamed.filter(p=>p.team==="red"), blues = teamed.filter(p=>p.team==="blue");
    if(reds.length<2 || blues.length<2 || teamed.length<4){
      await Promise.all(players.map(p=> playersCol.doc(p.id).update({ready:false})));
      await roomRef.update({
        phase:"lobby", round:0, board:[], spymasters:null, startTeam:null, turnTeam:null, clue:null, guessesLeft:0,
        clueLog:[], redLeft:0, blueLeft:0, winner:null, winReason:null, lastActivityAt: Date.now()
      });
      return;
    }
    const next = (list, cur)=>{ const i = list.findIndex(p=>p.id===cur); return list[(i+1)%list.length].id; };
    const old = fd.spymasters || {};
    const spymasters = {red: next(reds, old.red), blue: next(blues, old.blue)};
    const startTeam = Math.random()<0.5 ? "red" : "blue";
    await roomRef.update(cnNewGameFields(startTeam, spymasters));
  }catch(e){}
}

// ---------- 只有一個：資料 / 動作 ----------

async function joFreshPlayers(){
  const snap = await playersCol.get().catch(()=>({docs:[]}));
  return snap.docs.map(dd=>({id:dd.id, ...dd.data()})).sort((a,b)=>a.joinedAt-b.joinedAt);
}
function joResetLocal(){ joHintDraft = ""; joHintError = ""; joGuessDraft = ""; joGuessError = ""; joDraftKey = ""; joRenderedKey = ""; }

async function doStartJustone(){
  const players = playersData;
  if(players.length<3){ startError = "至少需要 3 位玩家才能開始只有一個"; render(); return; }
  if(players.length>8){ startError = "只有一個最多 8 位玩家"; render(); return; }
  if(!players.every(p=>p.ready)){ startError = "還有人沒按「我準備好了」，等他們準備好才能開始"; render(); return; }
  const total = joTotal(roomData.settings);
  const deck = joBuildDeck(total);
  const guesserOrder = players.slice().sort((a,b)=>a.joinedAt-b.joinedAt).map(p=>p.id);
  const guesserId = guesserOrder[0];
  startError = "";
  joResetLocal();
  try{
    await roomRef.update({
      phase:"clue", round:1, deck, deckIndex:0, guesserOrder, guesserId, cardsUsed:0, score:0,
      clueEligible: guesserOrder.filter(id=>id!==guesserId), hints:{}, validHints:[], removedIds:[],
      joGuess:null, joVerdict:null, joOverridden:false, joLog:[], lastActivityAt: Date.now()
    });
  }catch(e){}
}

// 在線的、而且有玩家文件的 id（給「下一位猜詞者 / 提示者」用）；沒有任何人在線時退回全部。
function joPresentOnline(players){
  const on = onlineIdsOf(players, Date.now(), identity.playerId);
  return on.length ? on : players.map(p=>p.id);
}

// 每位提示者只寫「自己的」hints.<id>，不需要鎖，同時送出不會互相蓋掉；只有結算會拿短租約鎖（重抓資料、確認階段，冪等）。
async function doJoSubmitHint(){
  if(voteBusy) return;
  const rd0 = roomData;
  if(!rd0 || rd0.phase!=="clue") return;
  const v = joValidateHint(joHintDraft, (rd0.deck||[])[rd0.deckIndex||0] || "");
  if(!v.ok){ joHintError = v.msg; render(); return; }
  voteBusy = true;
  let wrote = false;
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="clue"){ voteBusy=false; return; }
    const fd = fresh.data();
    const me = identity.playerId;
    if(fd.guesserId===me || !(fd.clueEligible||[]).includes(me)){ voteBusy=false; return; }
    if((fd.hints||{})[me]!=null){ voteBusy=false; return; }
    const v2 = joValidateHint(v.text, (fd.deck||[])[fd.deckIndex||0] || "");
    if(!v2.ok){ joHintError = v2.msg; voteBusy=false; render(); return; }
    wrote = await writeOwnField("hints."+me, v2.text, "clue");
    if(wrote){ joHintDraft = ""; joHintError = ""; playVoteSound(); }
    else { joHintError = MSG_RETRY; }   // 草稿還在，再按一次送出就好
  }catch(e){ joHintError = MSG_RETRY; }
  voteBusy = false;
  render();
  if(wrote) await joResolve(false);
}

// 結算提示：鎖 + 重新讀房間、確認還在 clue 階段，再把重複的提示作廢並進入 guess。
// force=true 時不要求每個人都送出（房主強制進入猜測）。
async function joResolveInner(fd, force){
  if(fd.phase!=="clue") return;
  const elig = fd.clueEligible || [];
  const r = joResolveHints(fd.hints || {}, elig, (fd.deck||[])[fd.deckIndex||0] || "");
  await roomRef.update({phase:"guess", validHints: r.validHints, removedIds: r.removedIds, lastActivityAt: Date.now()});
}
async function joResolve(force){
  try{
    await withFreshRoom(async (fd, players)=>{
      if(force){ if(isHostNow(players)) await joResolveInner(fd, true); return; }
      const plan = joPlan(fd, players, Date.now(), identity.playerId);
      if(plan && plan.kind==="resolve") await joResolveInner(fd, false);
    }, {tries:6});
  }catch(e){}
}

async function doJoForce(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const r = await withFreshRoom(async (fd, players)=>{
      if(!isHostNow(players)) return;
      await joResolveInner(fd, true);
    }, {tries:5});
    if(!r.ok) showToast(MSG_RETRY);
  }catch(e){}
  voteBusy = false;
  render();
}

async function doJoGuess(skip){
  if(voteBusy) return;
  let text = "";
  if(!skip){
    text = String(joGuessDraft||"").trim();
    if(!text){ joGuessError = "請輸入你的答案"; render(); return; }
    if(Array.from(text).length>20){ joGuessError = "答案最多 20 個字"; render(); return; }
  }
  voteBusy = true;
  try{
    const r = await withFreshRoom(async (fd)=>{
      if(fd.phase!=="guess") return;
      if(fd.guesserId!==identity.playerId) return;
      const word = (fd.deck||[])[fd.deckIndex||0] || "";
      const action = skip ? "skip" : (joGuessCorrect(text, word) ? "correct" : "wrong");
      const r = joApplyResult({cardsUsed: fd.cardsUsed||0, score: fd.score||0}, action);
      const joLog = (fd.joLog||[]).concat([{word, verdict: r.verdict, guesser: fd.guesserId, overridden:false}]);
      await roomRef.update({
        phase:"result", joGuess: skip ? null : text, joVerdict: r.verdict, joOverridden:false,
        cardsUsed: r.cardsUsed, score: r.score, joLog, lastActivityAt: Date.now()
      });
      joGuessDraft = ""; joGuessError = "";
      if(r.verdict==="correct") playResultSound(true); else if(r.verdict==="wrong") playResultSound(false);
    });
    if(!r.ok) joGuessError = "目前有人正在操作，請再按一次";   // 答案草稿還在
  }catch(e){ joGuessError = "目前有人正在操作，請再按一次"; }
  voteBusy = false;
  render();
}

// 房主把「猜錯」改判成「猜中」（同義詞）：只能改一次。
async function doJoOverride(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const r = await withFreshRoom(async (fd, players)=>{
      if(fd.phase!=="result") return;
      if(!isHostNow(players)) return;
      const r = joOverride({cardsUsed: fd.cardsUsed||0, score: fd.score||0, verdict: fd.joVerdict, overridden: !!fd.joOverridden});
      if(!r) return;
      const joLog = (fd.joLog||[]).slice();
      if(joLog.length) joLog[joLog.length-1] = Object.assign({}, joLog[joLog.length-1], {verdict:"correct", overridden:true});
      await roomRef.update({joVerdict:"correct", joOverridden:true, cardsUsed: r.cardsUsed, score: r.score, joLog, lastActivityAt: Date.now()});
      playResultSound(true);
    }, {tries:5});
    if(!r.ok) showToast(MSG_RETRY);
  }catch(e){}
  voteBusy = false;
  render();
}

// 房主按「下一輪」：換下一位（在線的）猜詞者與下一張牌，或牌用完就結束。
async function doJoContinue(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const r = await withFreshRoom(async (fd, players)=>{
      if(fd.phase!=="result") return;
      if(!isHostNow(players)) return;
      const after = joAfterRound({cardsUsed: fd.cardsUsed||0, total: joTotal(fd.settings), deckIndex: fd.deckIndex||0, deckLen: (fd.deck||[]).length, verdict: fd.joVerdict});
      const patch = joAdvancePatch(fd, fd.cardsUsed||0, after.nextIndex, joPresentOnline(players));
      patch.lastActivityAt = Date.now();
      await roomRef.update(patch);
      joResetLocal();
    }, {tries:5});
    if(!r.ok) showToast(MSG_RETRY);
  }catch(e){}
  voteBusy = false;
  render();
}

// 猜詞者離開/離線後沒人能猜，把這張牌當作跳過、換下一位猜詞者（房主手動按，或看門狗自動做）。
async function joReplaceInner(fd, players){
  const word = (fd.deck||[])[fd.deckIndex||0] || "";
  const r = joApplyResult({cardsUsed: fd.cardsUsed||0, score: fd.score||0}, "skip");
  const joLog = (fd.joLog||[]).concat([{word, verdict:"skip", guesser: fd.guesserId, overridden:false}]);
  const patch = joAdvancePatch(fd, r.cardsUsed, (fd.deckIndex||0)+1, joPresentOnline(players));
  patch.joLog = joLog; patch.score = r.score; patch.lastActivityAt = Date.now();
  await roomRef.update(patch);
  joResetLocal();
}
async function doJoReplaceGuesser(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const r = await withFreshRoom(async (fd, players)=>{
      if(!isHostNow(players)) return;
      const plan = joPlan(fd, players, Date.now(), identity.playerId);
      if(plan && plan.kind==="replace") await joReplaceInner(fd, players);
    }, {tries:5});
    if(!r.ok) showToast(MSG_RETRY);
  }catch(e){}
  voteBusy = false;
  render();
}

// 房主端看門狗：猜詞者離線 → 跳過這張牌換人；在線的提示者都送出了卻沒人結算 → 補結算。
async function joWatchdog(){
  if(!joPlan(roomData, playersData, Date.now(), identity.playerId)) return;
  await withFreshRoom(async (fd, players)=>{
    const plan = joPlan(fd, players, Date.now(), identity.playerId);
    if(!plan) return;
    if(plan.kind==="replace") await joReplaceInner(fd, players);
    else if(plan.kind==="resolve") await joResolveInner(fd, false);
  }, {tries:4});
}

// 再來一局：回到大廳（保留玩家與設定），大家重新按準備。
async function doRematchJustone(){
  try{
    joResetLocal();
    await Promise.all(playersData.map(p=> playersCol.doc(p.id).update({ready:false})));
    await roomRef.update({
      phase:"lobby", round:0, deck:[], deckIndex:0, guesserOrder:[], guesserId:null, cardsUsed:0, score:0,
      clueEligible:[], hints:{}, validHints:[], removedIds:[], joGuess:null, joVerdict:null, joOverridden:false, joLog:[],
      lastActivityAt: Date.now()
    });
  }catch(e){}
}

// 把種子/修正流程中遇到的第一個錯誤顯示在題庫畫面上（例如 Firestore 規則沒開放寫入權限），方便排查。
function reportSeedError(prefix, e){
  if(bankLoadError) return; // 只留第一個錯誤，避免畫面被洗掉
  bankLoadError = prefix + "：" + ((e && (e.message||e.code)) || String(e));
  render();
}

async function ensureSeeded(d){
  try{
    const marker = d.doc("meta/questionsSeeded");
    const snap = await marker.get();
    if(snap.exists) return;
    await Promise.all(QUESTIONS.map((item,i)=>
      d.collection("customQuestions").doc("seed_"+i).set({
        q: item[0], options: item[1], category: item[2]||"other", builtin: true, createdAt: Date.now()
      })
    ));
    await marker.set({done:true, at: Date.now()});
  }catch(e){ reportSeedError("題庫初始化失敗（ensureSeeded）", e); }
}
// 第二批種子題（「關於你」題型），跟第一批分開用獨立標記，這樣已經玩過的房間也會補到新題目，不會重複。
async function ensureSeededV2(d){
  try{
    const marker = d.doc("meta/questionsSeededV2");
    const snap = await marker.get();
    if(snap.exists) return;
    await Promise.all(TARGETED_QUESTIONS.map((item,i)=>
      d.collection("customQuestions").doc("seedv2_"+i).set({
        q: item[0], options: item[1], category: item[2]||"aboutyou", builtin: true, targeted: true, createdAt: Date.now()
      })
    ));
    await marker.set({done:true, at: Date.now()});
  }catch(e){ reportSeedError("題庫初始化失敗（ensureSeededV2）", e); }
}

// 修正題庫的寫入邏輯：改成一筆一筆依序寫入「完整」內容（含 createdAt），把所有 seed_/seedv2_ 題目資料修好，
// 同時把題目文字裡的 {player}/{P} 改成更短的 PP。
async function ensureContentPatchV5(d){
  try{
    const marker = d.doc("meta/questionsContentPatchV5");
    const snap = await marker.get();
    if(snap.exists) return;
    const col = d.collection("customQuestions");
    for(let i=0;i<QUESTIONS.length;i++){
      const item = QUESTIONS[i];
      try{
        await col.doc("seed_"+i).set({
          q: item[0], options: item[1], category: item[2]||"other",
          builtin: true, targeted: true, createdAt: 1788857016000 + i
        });
      }catch(e){ reportSeedError("題庫寫入失敗（seed_"+i+"）", e); }
    }
    for(let i=0;i<TARGETED_QUESTIONS.length;i++){
      const item = TARGETED_QUESTIONS[i];
      try{
        await col.doc("seedv2_"+i).set({
          q: item[0], options: item[1], category: item[2]||"aboutyou",
          builtin: true, targeted: true, createdAt: 1788857017000 + i
        });
      }catch(e){ reportSeedError("題庫寫入失敗（seedv2_"+i+"）", e); }
    }
    await marker.set({done:true, at: Date.now()});
  }catch(e){ reportSeedError("題庫修正失敗（ensureContentPatchV5）", e); }
}

// ---------- boot ----------
(async ()=>{
  const vLine = document.getElementById("versionLine");
  if(vLine) vLine.textContent = `${APP_VERSION} · 更新於 ${APP_UPDATED}`;
  render();
  const d = await ensureDb();
  if(d){
    customQuestionsCol = d.collection("customQuestions");
    unsubCustomQuestions = customQuestionsCol.orderBy("createdAt","asc").onSnapshot(qsnap=>{
      bankLoadError = "";
      customQuestionsData = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
      render();
    }, err=>{
      // 常見原因：Firestore 安全規則沒開放 customQuestions 這個 collection 的讀取權限。
      bankLoadError = (err && (err.message||err.code)) || String(err);
      render();
    });
    ensureSeeded(d);
    ensureSeededV2(d);
    ensureContentPatchV5(d);
  }
  if(identity){
    if(!db){
      app.innerHTML = `<div class="card" style="text-align:center;"><p>目前無法連線到房間服務。</p><button class="btn-secondary" id="backBtn">回首頁</button></div>`;
      document.getElementById("backBtn").onclick = leaveToHome;
      return;
    }
    connectRoom();
  }
})();

// 手機切到背景、螢幕鎖定或網路重新連上時，即時連線常常會斷掉但不會自動補上；
// 回到前景 / 恢復網路時主動重新訂閱，不用使用者自己重新整理頁面。
let lastReconnectAt = 0;
function reconnectIfNeeded(){
  if(!identity || !roomRef) return;
  const now = Date.now();
  if(now - lastReconnectAt < 1500) return; // 避免短時間內重複觸發
  lastReconnectAt = now;
  connectRoom();
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){ reconnectIfNeeded(); sendHeartbeat(true); }
});
window.addEventListener("focus", ()=>{ reconnectIfNeeded(); sendHeartbeat(true); });
window.addEventListener("online", ()=>{ reconnectIfNeeded(); sendHeartbeat(true); });
</script>
