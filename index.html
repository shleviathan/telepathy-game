<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>派對遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Orbitron:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#eae3da; --surface:#f8f4ee; --surface-2:#e6ddd1; --ink:#4a4038; --muted:#93887c;
  --accent:#a68b7c; --accent-ink:#fdfaf7; --warn:#b57568; --warn-ink:#fff8f6; --safe:#7f9482; --safe-ink:#f3f8f4;
  --gold:#c0a377; --line:#d9cebd; --shadow:rgba(58,48,38,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a2521; --surface:#332d27; --surface-2:#3d362e; --ink:#e9e1d6; --muted:#a89b8b;
    --accent:#c4a493; --accent-ink:#2b1c15; --warn:#c68e7c; --warn-ink:#2b1712; --safe:#9bab97; --safe-ink:#17211a;
    --gold:#d0b788; --line:#4a4138; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#2a2521; --surface:#332d27; --surface-2:#3d362e; --ink:#e9e1d6; --muted:#a89b8b;
  --accent:#c4a493; --accent-ink:#2b1c15; --warn:#c68e7c; --warn-ink:#2b1712; --safe:#9bab97; --safe-ink:#17211a;
  --gold:#d0b788; --line:#4a4138; --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 560px at 12% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent),
    radial-gradient(700px 480px at 92% 6%, color-mix(in srgb, var(--safe) 10%, transparent), transparent),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,ui-sans-serif,"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  min-height:100vh; display:flex; justify-content:center;
  padding:26px 14px 60px;
}
h1,h2{font-family:"Noto Sans TC",sans-serif; font-weight:900; text-wrap:balance; margin:0;}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
.digits{font-family:"Orbitron",ui-monospace,monospace;}
.wrap{width:100%; max-width:440px;}

.masthead{text-align:center; margin-bottom:18px;}
.masthead .kicker{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.28em; color:var(--muted); text-transform:uppercase;}
.masthead h1{font-size:32px; margin-top:4px; background:linear-gradient(100deg, var(--accent), var(--safe)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.masthead .sub{color:var(--muted); font-size:13px; margin-top:6px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 40px -22px var(--shadow), 0 2px 0 var(--line) inset; padding:22px; margin-bottom:16px; position:relative;}
.badge{position:absolute; top:14px; right:14px; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.16em; padding:5px 10px; border-radius:20px; text-transform:uppercase; font-weight:800;}
.badge.purple{background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--accent);}
.badge.red{background:color-mix(in srgb, var(--warn) 20%, transparent); color:var(--warn);}
.badge.green{background:color-mix(in srgb, var(--safe) 20%, transparent); color:var(--safe);}

label{display:block; font-size:12px; letter-spacing:.08em; color:var(--muted); margin:0 0 6px; text-transform:uppercase; font-weight:700;}
input[type=text]{width:100%; font-size:17px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-family:inherit; margin-bottom:14px;}
input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px;}
.roomcode-input{font-family:"JetBrains Mono",monospace; letter-spacing:.3em; text-transform:uppercase; text-align:center; font-size:22px;}

button{font:inherit; cursor:pointer; border:none; border-radius:14px; padding:13px 18px; font-weight:800; font-size:15px; width:100%; transition:transform .08s ease, filter .15s ease;}
button:active{transform:scale(.98);}
button:disabled{opacity:.4; cursor:not-allowed;}
.btn-primary{background:linear-gradient(120deg, var(--accent), #c9ab98); color:var(--accent-ink);}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);}
.btn-secondary{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn-secondary:hover:not(:disabled){background:var(--surface-2);}
.btn-ghost{background:transparent; color:var(--muted); font-weight:700; font-size:13px; padding:8px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.stack{display:flex; flex-direction:column; gap:10px;}

.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tab{flex:1; text-align:center; padding:10px; border-radius:12px; font-weight:800; font-size:14px; border:1.5px solid var(--line); color:var(--muted); cursor:pointer;}
.tab.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}

.gamepicker{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.gamecard{text-align:left; padding:10px 11px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); display:grid; grid-template-columns:38px 1fr; column-gap:10px; row-gap:1px; align-items:center; align-content:center; min-height:0;}
.gamecard.on{background:linear-gradient(150deg, var(--accent), #c9ab98); border-color:var(--accent); color:var(--accent-ink);}
.gamecard .gc-icon{grid-row:1/3; width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:linear-gradient(145deg, color-mix(in srgb, var(--gc) 30%, transparent), color-mix(in srgb, var(--gc) 12%, transparent)); color:var(--gc); box-shadow:0 0 0 1px color-mix(in srgb, var(--gc) 28%, transparent) inset;}
.gamecard .gc-icon svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.gamecard.on .gc-icon{background:rgba(255,255,255,.3); color:var(--accent-ink); box-shadow:none;}
.gamecard .gc-title{font-weight:800; font-size:14.5px; align-self:end;}
.gamecard .gc-desc{font-size:11px; opacity:.8; line-height:1.3; align-self:start;}
.gamecard.wide{grid-column:1/-1;}
.cnteams{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.cnteamcol{border-radius:14px; padding:10px; border:1.5px solid var(--line); background:var(--surface-2); display:flex; flex-direction:column; gap:8px;}
.cnteamcol.red{border-color:#c0594e; background:color-mix(in srgb, #c0594e 12%, var(--surface-2));}
.cnteamcol.blue{border-color:#4f7cae; background:color-mix(in srgb, #4f7cae 12%, var(--surface-2));}
.cnteamhead{font-weight:800; font-size:14px;}
.cnteammembers{display:flex; flex-direction:column; gap:4px; min-height:48px;}
.cnmember{font-size:13.5px; font-weight:600; word-break:break-all;}
.cnmember.empty{color:var(--muted); font-weight:500;}
.cnjoinbtn{padding:9px 6px; font-size:13px; margin:0;}
.cattag.cn-red,.cn-red{color:#c0594e;}
.cattag.cn-blue,.cn-blue{color:#4f7cae;}
.cnrole{font-weight:800; font-size:16px; text-align:center;}
.cnrole.red{color:#c0594e;}
.cnrole.blue{color:#4f7cae;}
.cnstatus{margin-bottom:10px; padding:12px 14px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line);}
.cnscores{display:flex; gap:8px; margin-bottom:8px;}
.cnpill{flex:1; text-align:center; font-weight:800; font-size:14px; padding:6px 0; border-radius:10px; color:#fff;}
.cnpill.red{background:#c0594e;}
.cnpill.blue{background:#4f7cae;}
.cnturn{font-weight:700; font-size:14.5px;}
.cnclue{margin-top:6px; font-size:16px;}
.cnclue b{font-size:20px;}
.cnleft{margin-left:10px; font-size:13px; color:var(--muted); font-weight:700;}
.cngrid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:100%;}
.cncard{position:relative; display:flex; align-items:center; justify-content:center; text-align:center; min-height:62px; padding:4px 2px; border-radius:10px; border:2px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:800; font-size:clamp(12px,3.9vw,16px); line-height:1.15; word-break:break-all; user-select:none;}
.cncard.tap{cursor:pointer;}
.cncard.sel{outline:3px solid var(--accent); outline-offset:1px; transform:translateY(-2px);}
.cncard.hint.red{background:color-mix(in srgb, #c0594e 24%, var(--surface-2)); border-color:#c0594e;}
.cncard.hint.blue{background:color-mix(in srgb, #4f7cae 24%, var(--surface-2)); border-color:#4f7cae;}
.cncard.hint.neutral{background:color-mix(in srgb, #cbbfa9 32%, var(--surface-2)); border-color:#b8aa91; border-style:dashed;}
.cncard.hint.assassin{background:color-mix(in srgb, #25201c 28%, var(--surface-2)); border-color:#25201c;}
.cncard.rev.red{background:#c0594e; border-color:#c0594e; color:#fff;}
.cncard.rev.blue{background:#4f7cae; border-color:#4f7cae; color:#fff;}
.cncard.rev.neutral{background:#cbbfa9; border-color:#cbbfa9; color:#4a4038;}
.cncard.rev.assassin{background:#25201c; border-color:#25201c; color:#fff;}
.cnmark{position:absolute; top:1px; right:3px; font-size:11px;}
.cnlogtoggle{margin:0; text-align:left; padding:4px 0;}
.joword{font-size:34px; font-weight:900; text-align:center; letter-spacing:.08em; padding:16px 8px; border-radius:16px; background:linear-gradient(150deg, var(--accent), #c9ab98); color:var(--accent-ink); margin:6px 0 12px; word-break:break-all;}
.jolabel{font-size:11px; font-weight:800; letter-spacing:.2em; color:var(--muted); text-align:center;}
.jostatus{display:flex; gap:8px; margin-bottom:8px;}
.jopill{flex:1; text-align:center; font-weight:800; font-size:12.5px; padding:6px 4px; border-radius:10px; background:var(--surface); border:1.5px solid var(--line);}
.jochips{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 8px;}
.jochip{padding:8px 14px; border-radius:20px; font-weight:800; font-size:17px; background:var(--surface-2); border:1.5px solid var(--line); color:var(--ink);}
.jochip.off,.jotext.off{text-decoration:line-through; opacity:.55;}
.jochip.off{border-style:dashed;}
.jotext{font-weight:800; font-size:15px; text-align:right;}

.playerlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.playerlist li{display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 13px;}
.pname{font-weight:800; display:flex; align-items:center; gap:8px;}
.pname .you{font-size:10px; color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:1px 6px; letter-spacing:.06em;}
.pname .host{font-size:10px; color:var(--warn); border:1px solid var(--warn); border-radius:6px; padding:1px 6px; letter-spacing:.06em;}
.offtag{display:inline-block; font-size:10px; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 6px; margin-left:4px; letter-spacing:.06em; opacity:.75; vertical-align:middle;}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); max-width:86vw; background:var(--surface); color:var(--ink); border:1.5px solid var(--warn); border-radius:12px; padding:10px 16px; font-size:14px; font-weight:700; z-index:300; opacity:0; transition:opacity .25s; pointer-events:none; box-shadow:0 6px 20px var(--shadow);}
.strikes{font-family:"JetBrains Mono",monospace; font-weight:800; color:var(--warn); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:6px;}
.strikes .dots{display:flex; gap:3px;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
.dot.on{background:var(--warn);}
.prow-actions{display:flex; align-items:center; gap:8px;}
.kickbtn{width:auto; padding:3px 9px; font-size:11px; font-weight:800; background:transparent; color:var(--warn); border:1px solid var(--warn); border-radius:8px; flex:none;}

.settingsrow{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line);}
.settingsrow:first-of-type{border-top:none;}
.settingsrow span{font-size:14px; font-weight:700;}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:32px; height:32px; padding:0; border-radius:9px; font-size:16px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
.stepper .n{font-family:"JetBrains Mono",monospace; font-weight:800; min-width:44px; text-align:center; font-size:13px;}

.catchips{display:flex; flex-wrap:wrap; gap:8px;}
.catchip{
  width:auto; padding:8px 14px; border-radius:20px; font-size:13px; font-weight:700;
  background:var(--surface-2); color:var(--muted); border:1.5px solid var(--line);
}
.catchip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.cattag{
  display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px;
  background:var(--surface); color:var(--muted); border:1px solid var(--line); margin-top:4px;
}
select{
  width:100%; font-size:15px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-family:inherit; margin-bottom:14px; appearance:none;
}

.avatargrid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px;}
.avatarbtn{
  width:auto; padding:0; aspect-ratio:1; font-size:22px; border-radius:11px;
  background:var(--surface-2); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
}
.avatarbtn.on{background:var(--accent); border-color:var(--accent);}
.avatarpick{width:auto; padding:6px 10px; font-size:12px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:20px; flex:none;}
.avatarchip{display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:4px 10px; font-size:12.5px; font-weight:700;}
.avatarchip.mini{background:var(--surface-2); border-color:var(--line); padding:3px 8px; font-size:11.5px; gap:3px; margin:0 4px 4px 0;}
.avatarchip.struckchip{background:var(--warn); border-color:var(--warn); color:var(--warn-ink);}
.helptitle{font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}

.iconrow{display:flex; gap:10px; margin-bottom:16px;}
.iconbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:14px 10px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line); box-shadow:0 10px 24px -18px var(--shadow);}
.iconbtn .iconbtn-emoji{font-size:22px;}
.iconbtn span:last-child{font-size:12px; font-weight:700; color:var(--muted);}

.modalbackdrop{position:fixed; inset:0; background:rgba(10,6,20,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0;}
.modalsheet{width:100%; max-width:440px; max-height:86vh; overflow-y:auto; background:var(--surface); border-radius:20px 20px 0 0; padding:20px 20px 28px; box-shadow:0 -14px 44px -12px var(--shadow); animation:slideup .28s cubic-bezier(.2,.6,.3,1);}
.modalhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:sticky; top:-20px; background:var(--surface); padding-top:4px; z-index:2;}
.modalhead h2{font-size:19px;}
.modalclose{width:32px; height:32px; padding:0; border-radius:9px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); font-size:16px; flex:none;}
@keyframes slideup{from{transform:translateY(24px); opacity:.3;} to{transform:translateY(0); opacity:1;}}
@media (prefers-reduced-motion: reduce){.modalsheet{animation:none;}}

.sharerow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:12px; margin-top:10px; flex-wrap:wrap;}
.sharerow.lose{background:color-mix(in srgb, var(--warn) 14%, var(--surface-2)); border:1.5px solid var(--warn);}
.sharerow.win{background:color-mix(in srgb, var(--safe) 14%, var(--surface-2)); border:1.5px solid var(--safe);}
.sharerow-label{font-weight:800; font-size:14px; flex:none;}
.sharerow-people{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end;}

.error{color:var(--warn); font-size:13px; margin:-6px 0 12px; min-height:1em; font-weight:700;}
.helper{color:var(--muted); font-size:13px; text-align:center; margin:0 0 14px;}
.codeshare{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
.codeshare .lockbadge{font-size:18px;}
.codeshare.clear-badge{margin-top:22px;}
.codeshare .code{font-family:"JetBrains Mono",monospace; font-weight:800; font-size:28px; letter-spacing:.22em; color:var(--accent);}
.copybtn{width:auto; padding:8px 12px; font-size:12px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:10px;}
.spin{display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){
  .spin{animation:none;} button{transition:none;} .flipcard-inner{transition:none;} .barfill{transition:none;}
  .revealfade, .noanswer{animation:none; opacity:1; transform:none;}
  .flipface.back.struck-blink{animation:none;}
}

.timerzone{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:14px;}
.ring-wrap{position:relative; width:104px; height:104px;}
.ring-wrap svg{transform:rotate(-90deg); width:100%; height:100%;}
.ring-bg{fill:none; stroke:var(--line); stroke-width:8;}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .18s linear, stroke .2s;}
.ring-fg.low{stroke:var(--warn);}
.ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; font-variant-numeric:tabular-nums;}

.qtext{text-align:center; font-family:"Noto Sans TC",sans-serif; font-weight:900; font-size:21px; line-height:1.4; margin:4px 0 18px;}
.optgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.optbtn{
  text-align:left; padding:16px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink);
  display:flex; flex-direction:column; gap:6px; min-height:88px; justify-content:center;
}
.optbtn .letter{font-family:"Orbitron",monospace; font-weight:800; font-size:13px; color:var(--muted);}
.optbtn .txt{font-weight:700; font-size:14.5px; line-height:1.35;}
.optbtn.picked{background:linear-gradient(150deg, var(--accent), #c9ab98); border-color:var(--accent); color:var(--accent-ink);}
.optbtn.picked .letter{color:var(--accent-ink); opacity:.85;}

.pickgrid{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
.pickbtn{display:flex; align-items:center; gap:10px; text-align:left; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:700; font-size:14px;}
.pickbtn.picked{background:linear-gradient(150deg, var(--accent), #c9ab98); border-color:var(--accent); color:var(--accent-ink);}
.pickbtn:disabled{opacity:.5;}
.avtracker{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:6px 0 12px;}
.avdots{display:flex; gap:8px;}
.avdot{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-weight:800; font-size:13px; border:2px solid var(--line); background:var(--surface-2); color:var(--muted);}
.avdot.cur{border-color:var(--accent); color:var(--accent);}
.avdot.ok{background:var(--safe); border-color:var(--safe); color:#fff;}
.avdot.bad{background:var(--warn); border-color:var(--warn); color:#fff;}
.avreject{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em;}

.mlranklist{display:flex; flex-direction:column; gap:8px; margin-top:4px; position:relative;}
.mlrankitem{display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:10px; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; transition:transform .18s ease; touch-action:none;}
.mlrankitem.base{border-color:var(--accent);}
.mlrankitem.dragging{transition:none; z-index:5; box-shadow:0 14px 30px -16px var(--shadow); background:var(--surface); cursor:grabbing;}
.mlrankidx{font-family:"JetBrains Mono",monospace; font-weight:800; color:var(--muted); text-align:center;}
.mlrankname{font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; user-select:none;}
.mlrankhandle{width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; color:var(--muted); font-size:16px; flex:none; cursor:grab; touch-action:none;}
.mlscale{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin:2px 2px 0; font-weight:700;}

<script>

const AVATARS = ["🦊","🐱","🐶","🐼","🐨","🐸","🦁","🐵","🐰","🐯","🦄","🐙","🦉","🐢","🐧","🦋","🐻","🐮","🐷","🦖"];
function randomAvatar(){ return AVATARS[Math.floor(Math.random()*AVATARS.length)]; }

// ---------- 同步：鎖 / 在線狀態 / 房主 的純邏輯（不碰 DOM、不碰資料庫，方便單元測試） ----------

const PRESENCE_TTL_MS = 40000;   // 超過這麼久沒有心跳就當作離線
const HEARTBEAT_MS = 12000;      // 頁面可見時每隔多久寫一次 lastSeen
const WATCHDOG_MS = 5000;        // 房主端的看門狗週期
const LOCK_TTL_MS = 4000;        // 短租約：臨界區間做完就釋放，這只是當機時的保險
const LOCK_TRIES = 8;            // 搶鎖最多嘗試次數（指數退避 + 抖動）

// 玩家是否在線：沒有 lastSeen 的舊資料用 joinedAt 當最後一次看到的時間。
function isOnline(p, now){
  if(!p) return false;
  const t = p.lastSeen || p.joinedAt || 0;
  return (now - t) < PRESENCE_TTL_MS;
}
function joinOrder(players){
  return (players||[]).slice().sort((a,b)=> ((a.joinedAt||0)-(b.joinedAt||0)) || (a.id<b.id ? -1 : (a.id>b.id ? 1 : 0)));
}
// 在線的玩家 id（selfId 一定算在線：程式正在這個人的裝置上跑）。
function onlineIdsOf(players, now, selfId){
  return (players||[]).filter(p=> p.id===selfId || isOnline(p, now)).map(p=>p.id);
}
// 房主 = 最早加入的「在線」玩家。規則是確定性的（每個人看到同樣的資料就算出同一位），
// 原房主離線超過 PRESENCE_TTL_MS 控制權自動轉給下一位；他回來（心跳恢復）且仍是最早的在線者就自動拿回。
// 沒有任何人在線時退回最早加入者。
function pickHostId(players, now, selfId){
  const ord = joinOrder(players);
  const h = ord.find(p=> p.id===selfId || isOnline(p, now));
  return h ? h.id : (ord[0] ? ord[0].id : null);
}
// 搶鎖失敗後的等待時間：150ms 起跳、上限約 600ms 的指數退避，rnd(0~1) 是抖動，避免大家同時重試。
function backoffDelay(attempt, rnd){
  const hi = Math.min(600, 250 * Math.pow(1.4, attempt));
  return Math.round(150 + (hi - 150) * (rnd==null ? Math.random() : rnd));
}
// {"a.b.c":1, "a.d":2} -> {a:{b:{c:1}, d:2}}（Artifact 版 update() 不支援點路徑）
function expandDotted(flat){
  const out = {};
  Object.keys(flat).forEach(k=>{
    const parts = k.split(".");
    let o = out;
    for(let i=0;i<parts.length-1;i++){
      if(typeof o[parts[i]]!=="object" || o[parts[i]]===null) o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length-1]] = flat[k];
  });
  return out;
}
function getPathValue(obj, path){
  let o = obj;
  const parts = path.split(".");
  for(let i=0;i<parts.length;i++){
    if(o==null || typeof o!=="object") return undefined;
    o = o[parts[i]];
  }
  return o;
}
function deepEq(a, b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }
// 比較玩家名單時忽略 lastSeen（心跳每 12 秒就會讓資料變一次，不能每次都重畫畫面）。
function stripSeen(players){
  return (players||[]).map(p=>{ const q = Object.assign({}, p); delete q.lastSeen; return q; });
}
// 這些 id 之中「在線」的。
function onlineSubset(ids, players, now, selfId){
  const on = new Set(onlineIdsOf(players, now, selfId));
  return (ids||[]).filter(id=> on.has(id));
}
// 通用「全員送出了嗎」：required 之中在線的人都有交（在線的人數為 0 也算齊了，避免永遠卡住）。
function allOnlineSubmitted(requiredIds, submitted, players, now, selfId){
  return onlineSubset(requiredIds, players, now, selfId).every(id=> submitted && submitted[id]!=null);
}
// 離線標籤（小的灰色字，大廳與各遊戲畫面共用）。
function offBadgeHtml(p, now, selfId){
  if(!p || p.id===selfId || isOnline(p, now)) return "";
  return `<span class="offtag">離線</span>`;
}

// 「誰最可能」的題目：不需要主角/選項，每題就是丟一句敘述，大家投票選房間裡的某個人。
const MOST_LIKELY_PROMPTS = [

// 用 usedIdx（這一局已經抽過的題目索引）排除重複，抽完整組才重新洗牌。
function pickMLPrompt(usedIdx){
  const usedSet = new Set(usedIdx||[]);
  let candidates = MOST_LIKELY_PROMPTS.map((_,i)=>i).filter(i=>!usedSet.has(i));
  let resetUsed = false;
  if(candidates.length===0){
    candidates = MOST_LIKELY_PROMPTS.map((_,i)=>i);
    resetUsed = true;
  }
  const idx = candidates[Math.floor(Math.random()*candidates.length)];
  return {idx, resetUsed};
}
// 挑本輪「誰最可能」的基準玩家：輪流讓每個人都當過基準，玩家都輪過一次後才重新洗牌。
function pickMLBase(playerIds, usedIds){
  const usedSet = new Set(usedIds||[]);
  let candidates = playerIds.filter(id=>!usedSet.has(id));
  let resetUsed = false;
  if(candidates.length===0){
    candidates = playerIds.slice();
    resetUsed = true;

const DRAW_SUBJECTS = [

  "老虎","猴子","長頸鹿","無尾熊","浣熊","狐狸","兔子","貓頭鷹","烏龜","章魚",

];
const DRAW_ACTIONS = [

function pickDrawPrompt(usedKeys){
  const usedSet = new Set(usedKeys||[]);
  let key, si, pi, ai, tries = 0;
  do{

    tries++;
  }while(usedSet.has(key) && tries<30);
  const resetUsed = usedSet.has(key);
  const subject = DRAW_SUBJECTS[si], place = DRAW_PLACES[pi], action = DRAW_ACTIONS[ai];
  const text = `${subject}在${place}${action}`;
  return {key, text, subject, place, action, resetUsed};
}

};
// 狼人人數不給房主調整，直接依人數自動算：5人以下1隻、9人以下2隻、其餘3隻。
function computeWolfCount(n){ return n<=5 ? 1 : (n<=9 ? 2 : 3); }
// 洗牌玩家順序後依序分配：狼人優先，接著依開關分配特殊角色，剩下的人都是村民。
function assignWerewolfRoles(players, rolesSettings){
  const shuffled = players.map(p=>p.id);
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const roles = {};
  const wolfCount = computeWolfCount(players.length);
  const pool = shuffled.slice();
  pool.splice(0, wolfCount).forEach(id=>{ roles[id] = "wolf"; });
  WEREWOLF_ROLE_TOGGLES.forEach(role=>{
    if(rolesSettings && rolesSettings[role] && pool.length){
      const id = pool.shift();
      roles[id] = role;
    }
  });
  pool.forEach(id=>{ roles[id] = "villager"; });
  return roles;
}
// 夜晚行動的固定順序：醫生 → 狼人 → 預言家 → 女巫。狼人一定會行動，其他角色要開關開著、且該角色還活著才會輪到。
// 找不到下一個該行動的角色就回傳 null，代表這一夜的行動都做完了，該進入結算。
const WEREWOLF_NIGHT_STEPS = ["guard","wolf","seer","witch"];
function nextNightStep(afterStep, rolesSettings, roles, players){
  const startIdx = afterStep ? WEREWOLF_NIGHT_STEPS.indexOf(afterStep)+1 : 0;
  for(let i=startIdx;i<WEREWOLF_NIGHT_STEPS.length;i++){
    const step = WEREWOLF_NIGHT_STEPS[i];
    if(step==="wolf"){
      const aliveWolves = players.filter(p=>p.alive!==false && roles[p.id]==="wolf");
      if(aliveWolves.length>0) return step;
      continue;
    }
    if(!rolesSettings || !rolesSettings[step]) continue;
    const holder = players.find(p=>p.alive!==false && roles[p.id]===step);
    if(holder) return step;
  }
  return null;
}

// 看門狗 / 結算共用的判斷（純函式）：目前狀態下「該不該往前推一步」。離線的人一律當作缺席：
//   夜晚：醫生/預言家/女巫離線 → 跳過該步驟（安全預設：不守護 / 不查驗 / 不用藥）；
//         狼人：在線的活狼都投了（或活狼全部離線）→ 結算（沒人投 = 今晚沒人被襲擊）；
//   獵人離線 → 不開槍；投票階段：在線且活著的玩家都投了 → 結算（沒投的人當棄票）。
function wwPlan(fd, players, now, selfId){
  if(!fd) return null;
  const roles = fd.roles || {};
  const on = new Set(onlineIdsOf(players, now, selfId));
  const alive = players.filter(p=> p.alive!==false && roles[p.id]);
  if(fd.phase==="night"){
    const step = fd.nightStep;
    if(step==="wolf"){
      const wv = fd.wolfVotes || {};
      const onWolves = alive.filter(p=> roles[p.id]==="wolf" && on.has(p.id));
      return onWolves.every(w=> wv[w.id]!=null) ? {kind:"resolveWolf"} : null;
    }
    if(step==="guard" || step==="seer" || step==="witch"){
      const holder = alive.find(p=> roles[p.id]===step);
      if(!holder || !on.has(holder.id)) return {kind:"skipStep", step};
    }
    return null;
  }
  if(fd.phase==="hunter"){
    const h = (fd.hunterQueue||[])[0];
    if(h && !on.has(h)) return {kind:"hunterSkip"};
    return null;
  }
  if(fd.phase==="vote"){
    const vt = fd.voteTally || {};
    return alive.filter(p=>on.has(p.id)).every(p=> vt[p.id]!=null) ? {kind:"resolveVote"} : null;
  }
  return null;
}

// 「阿瓦隆」：人數對應的好壞人數、每輪任務隊伍人數，以及角色分配等純邏輯。
const AVALON_TEAM_SIZES = {
  5:[2,3,2,3,3], 6:[2,3,4,3,4], 7:[2,3,3,4,4], 8:[3,4,4,5,5], 9:[3,4,4,5,5], 10:[3,4,4,5,5]

const AVALON_FACTION_COUNTS = {
  5:{good:3, evil:2}, 6:{good:4, evil:2}, 7:{good:4, evil:3}, 8:{good:5, evil:3}, 9:{good:6, evil:3}, 10:{good:6, evil:4}

function isEvilRole(role){ return role==="assassin" || role==="morgana" || role==="mordred" || role==="minion"; }
function avalonClampN(n){ return Math.max(5, Math.min(10, n|0)); }
function avalonTeamSize(n, missionNo){
  const row = AVALON_TEAM_SIZES[avalonClampN(n)];
  return row[Math.max(0, Math.min(4, (missionNo|0)-1))];
}
// 第 4 輪任務在 7 人以上要 2 張失敗票才算失敗，其餘一律 1 張。
function avalonFailsNeeded(n, missionNo){ return (missionNo===4 && n>=7) ? 2 : 1; }
// 組隊投票：同意票嚴格多於反對票才通過，平票視為否決。
function avalonTally(teamVotes){
  let approve = 0, reject = 0;
  Object.keys(teamVotes||{}).forEach(id=>{
    if(teamVotes[id]==="approve") approve++;
    else if(teamVotes[id]==="reject") reject++;
  });
  return {approve, reject, approved: approve>reject};
}
// 隊長依加入順序輪流；找不到目前隊長（例如他離開了）就回到第一位。
function avalonNextLeader(orderedIds, currentId){
  if(!orderedIds.length) return null;
  const idx = orderedIds.indexOf(currentId);
  return orderedIds[(idx+1) % orderedIds.length];
}
// 隊長輪替但跳過離線的人（從目前隊長的下一位往後找第一位在線者；找不到在線者就維持原本的下一位）。
function avalonNextOnlineLeader(orderedIds, currentId, onlineSet){
  const n = orderedIds.length;
  if(!n) return null;
  const start = orderedIds.indexOf(currentId);
  for(let k=1;k<=n;k++){
    const id = orderedIds[(start+k) % n];
    if(onlineSet.has(id)) return id;
  }
  return avalonNextLeader(orderedIds, currentId);
}
// 這局有角色的玩家（依加入順序）。
function avalonRolled(fd, players){
  const roles = (fd && fd.roles) || {};
  return joinOrder(players).filter(p=>roles[p.id]);
}
// 看門狗 / 結算共用的判斷（純函式）：目前這個房間狀態下「該不該往前推一步」。
//   team：隊長離開或離線 → 換下一位在線隊長；vote：在線的有角色玩家都投了 → 結算；
//   mission：在線的隊員都出牌了（或隊員全離線）→ 結算；assassin：刺客離線 → 當作沒刺中。
function avalonPlan(fd, players, now, selfId){
  if(!fd) return null;
  const rolled = avalonRolled(fd, players);
  const ids = rolled.map(p=>p.id);
  const on = new Set(onlineIdsOf(rolled, now, selfId));
  if(fd.phase==="team"){
    if(!ids.includes(fd.leaderId) || !on.has(fd.leaderId)){
      const nxt = avalonNextOnlineLeader(ids, fd.leaderId, on);
      if(nxt && nxt!==fd.leaderId) return {kind:"leader", leaderId:nxt};
    }
    return null;
  }
  if(fd.phase==="vote"){
    return ids.filter(id=>on.has(id)).every(id=> (fd.teamVotes||{})[id]!=null) ? {kind:"resolveVote"} : null;
  }
  if(fd.phase==="mission"){
    const members = (fd.teamSelection||[]).filter(id=>ids.includes(id));
    return members.filter(id=>on.has(id)).every(id=> (fd.missionVotes||{})[id]!=null) ? {kind:"resolveMission"} : null;
  }
  if(fd.phase==="assassin"){
    const a = ids.find(id=> (fd.roles||{})[id]==="assassin");
    if(!a || !on.has(a)) return {kind:"assassinMiss"};
  }
  return null;
}
// 洗牌後先抽壞人：刺客 → 莫甘娜 → 莫德雷德（依開關、名額還有才給），剩下是爪牙；
// 好人：梅林 → 派西維爾（依開關、名額還有才給），剩下是忠臣。
function assignAvalonRoles(players, rolesSettings){
  const shuffled = players.map(p=>p.id);
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const counts = AVALON_FACTION_COUNTS[avalonClampN(players.length)];
  const rs = rolesSettings || {};
  const roles = {};
  const evilIds = shuffled.slice(0, counts.evil);
  const goodIds = shuffled.slice(counts.evil, counts.evil + counts.good);
  const evilRoles = ["assassin"];
  if(rs.morgana) evilRoles.push("morgana");
  if(rs.mordred) evilRoles.push("mordred");
  evilIds.forEach((id,i)=>{ roles[id] = i<evilRoles.length ? evilRoles[i] : "minion"; });
  const goodRoles = ["merlin"];
  if(rs.percival) goodRoles.push("percival");
  goodIds.forEach((id,i)=>{ roles[id] = i<goodRoles.length ? goodRoles[i] : "loyal"; });
  return roles;
}
// 夜晚情報（純前端計算）：壞人互相認識；梅林看得到壞人（莫德雷德除外）；派西維爾看到梅林和莫甘娜但分不出誰是誰；忠臣什麼都看不到。
function avalonNightInfo(roles, myId, orderedIds){
  const my = roles[myId];
  const ids = orderedIds || Object.keys(roles);
  if(isEvilRole(my)) return {kind:"evil", ids: ids.filter(id=> id!==myId && roles[id] && isEvilRole(roles[id]))};
  if(my==="merlin") return {kind:"merlin", ids: ids.filter(id=> roles[id] && isEvilRole(roles[id]) && roles[id]!=="mordred")};
  if(my==="percival") return {kind:"percival", ids: ids.filter(id=> roles[id]==="merlin" || roles[id]==="morgana")};
  return {kind:"none", ids:[]};
}

const CN_TEAM_LABEL = {red:"紅隊", blue:"藍隊"};
const CN_TEAM_EMOJI = {red:"🔴", blue:"🔵"};
function cnOther(t){ return t==="red" ? "blue" : "red"; }
function cnShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];

// 25 張牌：先手隊 9、另一隊 8、中立 7、刺客 1；字從詞庫不重複抽出。
function cnGenBoard(startTeam, words){
  const pool = cnShuffle(words || CN_WORDS).slice(0,25);
  const other = cnOther(startTeam);
  const colors = [];
  for(let i=0;i<9;i++) colors.push(startTeam);
  for(let i=0;i<8;i++) colors.push(other);
  for(let i=0;i<7;i++) colors.push("neutral");
  colors.push("assassin");
  const shuffled = cnShuffle(colors);
  return pool.map((w,i)=>({word:w, color:shuffled[i], revealed:false}));
}
function cnCountLeft(board){
  let red = 0, blue = 0;
  (board||[]).forEach(c=>{ if(!c.revealed){ if(c.color==="red") red++; else if(c.color==="blue") blue++; } });
  return {red, blue};
}
// 提示規則：去頭尾空白、不能空、不超過 8 字、不能含空白、不能跟盤面上「還沒翻開」的字相同或互相包含。
function cnValidateClue(raw, board){
  const word = String(raw==null?"":raw).trim();
  if(!word) return {ok:false, msg:"請輸入提示詞", word};
  if(/\s/.test(word)) return {ok:false, msg:"提示只能是一個詞，不能有空白", word};
  if(Array.from(word).length>8) return {ok:false, msg:"提示最多 8 個字", word};
  const lw = word.toLowerCase();
  const bad = (board||[]).find(c=>{
    if(c.revealed) return false;
    const bw = String(c.word).toLowerCase();
    return bw===lw || lw.indexOf(bw)>=0 || bw.indexOf(lw)>=0;
  });
  if(bad) return {ok:false, msg:`提示不能和盤面上的「${bad.word}」相同或互相包含`, word};
  return {ok:true, msg:"", word};
}
// 翻一張牌的結果（純函式）。st = {board, turnTeam, guessesLeft}；牌已翻開或不存在回傳 null。
// 自己顏色：繼續（猜測次數用完就換隊）；中立/對方顏色：換隊；刺客：當前隊伍立刻輸；任一隊的牌全翻開，該隊獲勝。
function cnApplyGuess(st, idx){
  const card = st.board[idx];
  if(!card || card.revealed) return null;
  const team = st.turnTeam, other = cnOther(team);
  const board = st.board.map((c,i)=> i===idx ? {word:c.word, color:c.color, revealed:true} : c);
  const left = cnCountLeft(board);
  let phase = "guess", turnTeam = team, guessesLeft = st.guessesLeft, winner = null, winReason = null, outcome;
  const endTurn = ()=>{ phase = "clue"; turnTeam = other; guessesLeft = 0; };
  if(card.color==="assassin"){
    outcome = "assassin"; winner = other; winReason = "assassin"; phase = "ended"; guessesLeft = 0;
  } else {
    outcome = card.color===team ? "own" : (card.color==="neutral" ? "neutral" : "opponent");
    if(left.red===0) winner = "red"; else if(left.blue===0) winner = "blue";
    if(winner){ winReason = "all"; phase = "ended"; guessesLeft = 0; }
    else if(outcome==="own"){ guessesLeft = st.guessesLeft-1; if(guessesLeft<=0) endTurn(); }
    else endTurn();
  }
  return {board, phase, turnTeam, guessesLeft, winner, winReason, outcome, redLeft:left.red, blueLeft:left.blue};
}
// 隨機分隊：洗牌後輪流分給兩隊，人數差最多 1，奇數時哪隊多一人也是隨機。
function cnBalanceTeams(ids){
  const sh = cnShuffle(ids);
  const first = Math.random()<0.5 ? "red" : "blue";
  const res = {};
  sh.forEach((id,i)=>{ res[id] = (i%2===0) ? first : cnOther(first); });
  return res;
}

// 看門狗 / 手動安全閥共用的判斷（純函式）。
//   clue 階段：輪到的隊伍指揮官離線（或不在隊伍裡）→ 換同隊另一位在線的人當指揮官；沒有人可換 → 跳過這隊回合。
//   guess 階段：這隊的猜測者全都離線 → 跳過這隊回合。
function cnPlan(fd, players, now, selfId){
  if(!fd || (fd.phase!=="clue" && fd.phase!=="guess")) return null;
  const team = fd.turnTeam;
  if(team!=="red" && team!=="blue") return null;
  const spyId = (fd.spymasters||{})[team];
  const on = new Set(onlineIdsOf(players, now, selfId));
  const members = joinOrder(players).filter(p=>p.team===team);
  const spyOk = members.some(p=>p.id===spyId) && on.has(spyId);
  if(fd.phase==="clue"){
    if(spyOk) return null;
    const cand = members.find(p=> p.id!==spyId && on.has(p.id));
    return cand ? {kind:"swap", team, spy: cand.id} : {kind:"skip"};
  }
  const guessers = members.filter(p=> p.id!==spyId && on.has(p.id));
  return guessers.length ? null : {kind:"skip"};
}

// ---------- 只有一個：純邏輯 ----------
function joShuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// 比對用的正規化：全形轉半形、轉小寫，去掉空白與標點符號。
function joNorm(s){
  let out = "";
  for(const ch of String(s==null?"":s)){
    const c = ch.codePointAt(0);
    if(c===0x3000) out += " ";
    else if(c>=0xFF01 && c<=0xFF5E) out += String.fromCodePoint(c-0xFEE0);
    else out += ch;
  }
  return out.toLowerCase().replace(/[\s\p{P}\p{S}​-‍﻿]/gu, "");
}
function joTotal(settings){ return settings && settings.totalRounds===7 ? 7 : 13; }
function joKeyOf(rd){ return `${(rd&&rd.round)||0}|${(rd&&rd.deckIndex)||0}|${(rd&&rd.guesserId)||""}`; }
// 牌堆：洗牌後取 totalRounds+2 個字（猜錯會連帶丟掉下一張，多備 2 張）。
function joBuildDeck(total, words){
  return joShuffle(words || JO_WORDS).slice(0, total+2);
}
// 提示規則：去頭尾空白、不能空、不能含空白、最多 8 字、不能和神祕詞相同或互相包含。
function joValidateHint(raw, word){
  const text = String(raw==null?"":raw).trim();
  if(!text) return {ok:false, msg:"請輸入提示", text};
  if(/\s/.test(text)) return {ok:false, msg:"提示只能是一個詞，不能有空白", text};
  if(Array.from(text).length>8) return {ok:false, msg:"提示最多 8 個字", text};
  const nt = joNorm(text), nw = joNorm(word);
  if(!nt) return {ok:false, msg:"提示不能只有符號", text};
  if(nw && (nt===nw || nt.indexOf(nw)>=0 || nw.indexOf(nt)>=0)) return {ok:false, msg:"提示不能和答案相同或互相包含", text};
  return {ok:true, msg:"", text};
}
// 結算提示：正規化後相同的提示，只要有 2 人以上寫一樣，全部作廢（包含寫的人都算）。
// 回傳的 validHints 順序是洗牌過的（不會洩漏是誰寫的）。word 有給的話，順便把違規提示也作廢。
function joResolveHints(hints, eligibleIds, word){
  const entries = [];
  (eligibleIds||[]).forEach(pid=>{
    const raw = hints ? hints[pid] : null;
    if(raw==null) return;
    const text = String(raw).trim();
    entries.push({pid, text, n: joNorm(text)});
  });
  const count = {};
  entries.forEach(e=>{ count[e.n] = (count[e.n]||0)+1; });
  const kept = [], removedIds = [];
  entries.forEach(e=>{
    const bad = !e.n || count[e.n]>=2 || (word!=null && !joValidateHint(e.text, word).ok);
    if(bad) removedIds.push(e.pid); else kept.push({pid:e.pid, text:e.text});
  });
  return {validHints: joShuffle(kept), removedIds};
}
function joGuessCorrect(guess, word){
  const g = joNorm(guess);
  return !!g && g===joNorm(word);
}
// 一輪結算：答對 +1 分、用 1 張；跳過用 1 張；答錯用 2 張（下一張牌也丟掉）。
function joApplyResult(st, action){
  const cardsUsed = st.cardsUsed||0, score = st.score||0;
  if(action==="correct") return {cardsUsed: cardsUsed+1, score: score+1, verdict:"correct"};
  if(action==="skip") return {cardsUsed: cardsUsed+1, score, verdict:"skip"};
  return {cardsUsed: cardsUsed+2, score, verdict:"wrong"};
}
// 房主改判（同義詞）：只有「猜錯」且還沒改判過才能改，改完等於答對：+1 分、用牌數變成只用 1 張。
function joOverride(st){
  if(st.verdict!=="wrong" || st.overridden) return null;
  return {cardsUsed: (st.cardsUsed||0)-1, score: (st.score||0)+1, verdict:"correct", overridden:true};
}
// 這輪結束後：下一張牌的位置（猜錯要多丟一張）與是否結束。
function joAfterRound(st){
  const nextIndex = (st.deckIndex||0) + (st.verdict==="wrong" ? 2 : 1);
  const over = (st.cardsUsed||0) >= st.total || nextIndex >= st.deckLen;
  return {nextIndex, over};
}
// 猜詞者依加入順序輪流；目前這位不在名單或離開了也能從他的位置往後找；找不到在場的人回傳 null。
function joNextGuesser(order, currentId, presentIds){
  const n = (order||[]).length;
  if(!n) return null;
  const present = new Set(presentIds||[]);
  const start = order.indexOf(currentId);
  for(let k=1;k<=n;k++){
    const id = order[(start+k) % n];
    if(present.has(id)) return id;
  }
  return null;
}
function joEligible(order, guesserId, presentIds){
  const present = new Set(presentIds||[]);
  return (order||[]).filter(id=> id!==guesserId && present.has(id));
}
// 換下一輪（或結束）要寫進房間的欄位。fd = 目前房間資料；cardsUsed/nextIndex = 這輪結算後的值。
function joAdvancePatch(fd, cardsUsed, nextIndex, presentIds){
  const total = joTotal(fd.settings);
  const over = cardsUsed>=total || nextIndex>=(fd.deck||[]).length;
  const nextG = over ? null : joNextGuesser(fd.guesserOrder||[], fd.guesserId, presentIds);
  const elig = nextG ? joEligible(fd.guesserOrder||[], nextG, presentIds) : [];
  if(over || !nextG || elig.length<1) return {phase:"ended", cardsUsed, deckIndex: nextIndex};
  return {
    phase:"clue", round:(fd.round||0)+1, deckIndex: nextIndex, cardsUsed, guesserId: nextG, clueEligible: elig,
    hints:{}, validHints:[], removedIds:[], joGuess:null, joVerdict:null, joOverridden:false
  };
}
// 看門狗 / 手動安全閥共用的判斷（純函式）。
//   clue 階段：猜詞者離開/離線 → 換猜詞者（這張牌當跳過）；在線的提示者都送出了 → 結算進猜測。
//   guess 階段：猜詞者離開/離線 → 換猜詞者（這張牌當跳過）。
function joPlan(fd, players, now, selfId){
  if(!fd || (fd.phase!=="clue" && fd.phase!=="guess")) return null;
  const on = new Set(onlineIdsOf(players, now, selfId));
  const g = fd.guesserId;
  if(g && !on.has(g)) return {kind:"replace"};   // 不在名單裡的人 onlineIdsOf 也不會包含
  if(fd.phase==="clue"){
    const elig = (fd.clueEligible||[]).filter(id=>on.has(id));
    if(elig.every(id=> (fd.hints||{})[id]!=null)) return {kind:"resolve"};
  }
  return null;
}
// 評語：13 張為基準，7 張的局依比例換算。
function joRating(score, total){
  let s = Math.round((score||0)/total*13);
  if(score<total && s>=13) s = 12;
  if(s>=13) return "完美！";
  if(s===12) return "太神啦";
  if(s===11) return "太強了";
  if(s>=9) return "很優秀";
  if(s>=7) return "不錯喔";
  if(s>=5) return "普通";
  return "再接再厲";
}

function getPool(enabledCategories){
  const enabled = enabledCategories && enabledCategories.length ? new Set(enabledCategories) : new Set(ALL_CATEGORY_IDS);
  const all = customQuestionsData.map(c=>({q:c.q, options:c.options, category:c.category||"other", kind:c.builtin?"builtin":"custom", key:c.id, targeted:!!c.targeted}));
  return all.filter(item=>enabled.has(item.category));
}
// 每一題都會帶入「本輪主角」：PP 會被換成本輪輪到的玩家名字，全場一起猜這個人的答案。
// 主角是依加入順序（joinedAt）輪流分配，用回合數(round)決定輪到誰，不是隨機挑，確保每個人被當主角的次數公平。
function pickProtagonist(players, round){
  if(!players || !players.length) return null;
  const ordered = players.slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
  const idx = ((round||1)-1) % ordered.length;
  return ordered[idx];
}
function materializeQuestion(item, players, round){
  if(!players || !players.length) return {q:item.q, options:item.options};
  const p = pickProtagonist(players, round);
  const nm = p ? p.name : "某人";
  return {q:item.q.replace(/PP/g, nm), options:item.options};
}
// ---------- 音效 / 震動回饋 ----------
function setSoundEnabled(v){
  soundEnabled = v;
  try{ localStorage.setItem("telepathySound", v?"on":"off"); }catch(e){}
}
function beep(freq, durMs, type){
  if(!soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type||"sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durMs/1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durMs/1000);
  }catch(e){}
}
function vibrate(pattern){
  if(!soundEnabled) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function playVoteSound(){ beep(520,70,"sine"); vibrate(15); }
function playResultSound(safe){
  if(safe){
    beep(660,90,"sine");
    setTimeout(()=>beep(880,120,"sine"), 90);
    vibrate(20);
  } else {
    beep(180,220,"sawtooth");
    vibrate([40,40,40]);
  }
}

async function deleteRoomBestEffort(ref){
  try{
    const pCol = ref.collection("players");
    const vCol = ref.collection("votes");
    const lCol = ref.collection("_locks");
    const [pSnap, vSnap, lSnap] = await Promise.all([
      pCol.get().catch(()=>({docs:[]})),
      vCol.get().catch(()=>({docs:[]})),
      lCol.get().catch(()=>({docs:[]})),
    ]);
    await Promise.all([
      ...pSnap.docs.map(dd=>pCol.doc(dd.id).delete().catch(()=>{})),
      ...vSnap.docs.map(dd=>vCol.doc(dd.id).delete().catch(()=>{})),
      ...lSnap.docs.map(dd=>lCol.doc(dd.id).delete().catch(()=>{})),
    ]);
    await ref.delete();
  }catch(e){}
}

// 用 usedKeys（這一局已經抽過的題目 id）排除掉抽過的題目，同一局不會再抽到同一題。
// 如果選的類型池子小、整組都抽完了，就重新洗牌繼續玩（resetUsed 會告訴呼叫端把已抽清單重新算）。
function pickQuestion(usedKeys, enabledCategories){
  const pool = getPool(enabledCategories);
  if(pool.length===0) return {idx:-1, pool, resetUsed:false};
  const usedSet = new Set(usedKeys||[]);
  let candidates = pool.map((item,i)=>i).filter(i=>!usedSet.has(pool[i].key));
  let resetUsed = false;
  if(candidates.length===0){
    candidates = pool.map((item,i)=>i);
    resetUsed = true;
  }
  const idx = candidates[Math.floor(Math.random()*candidates.length)];
  return {idx, pool, resetUsed};
}

let drawingInProgress = false; // 目前是否正在畫一筆，畫的當下不要整頁重畫
let drawGuessInput = ""; // 猜謎者輸入中的猜測文字
let drawPromptAnimRound = null; // 已經播放過拉霸抽題動畫的回合，避免重複播放
let drawPromptAnimating = false; // 拉霸動畫播放中，暫停整頁重繪
// 分享出去的連結會帶 ?code=XXXX，開啟時直接幫忙切到「加入房間」分頁並帶入代碼。
try{
  const _params = new URLSearchParams(location.search);
  const _sharedCode = (_params.get("code")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
  if(_sharedCode){ homeTab = "join"; homeCode = _sharedCode; sharedLinkProbePending = true; }
}catch(e){}
let tickTimer=null;
// 房間超過這麼久沒有任何動作，視為過期，加入時會被擋下並順手清掉舊資料。
const ROOM_EXPIRE_MS = 12*60*60*1000;
let expireCleanupDone = false;
let soundEnabled = (function(){ try{ return localStorage.getItem("telepathySound") !== "off"; }catch(e){ return true; } })();
let audioCtx = null;
let soundedRound = null;
let voteBusy=false, resolveBusy=false;

const app = document.getElementById("app");

function render(){
  if(mlDragging || drawingInProgress || drawPromptAnimating) return; // 拖曳排序中/畫畫中/抽題拉霸動畫中先不要整頁重畫，不然手指動作或動畫會被背景更新打斷、跳掉
  if(!identity){ renderHome(); return; }
  if(!roomData){ renderConnecting(); return; }
  if(!roomData.exists){ renderGone(); return; }
  if(roomData.lastActivityAt && (Date.now()-roomData.lastActivityAt > ROOM_EXPIRE_MS)){ renderExpired(); return; }
  const me = playersData.find(p=>p.id===identity.playerId);
  if(!me){ renderRejoining(); return; }
  const hostId = playersData.length ? pickHostId(playersData, Date.now(), identity.playerId) : null;
  const isHost = hostId === identity.playerId;
  const phase = roomData.phase;
  const gameType = roomData.gameType || "telepathy";
  manageTicking(phase);
  manageVoteSub(phase);
  manageStrokeSub(phase);
  if(gameType==="mostlikely"){
    if(phase==="lobby") return renderLobby(isHost);
    if(phase==="question") return renderMLQuestion(me, isHost);
    if(phase==="reveal") return renderMLReveal(isHost);
    if(phase==="ended") return renderMLEnded(isHost);
    return renderConnecting();
  }
  if(gameType==="draw"){
    if(phase==="lobby") return renderLobby(isHost);
    if(phase==="drawing") return renderDrawTurn(me, isHost);
    if(phase==="guessing") return renderDrawGuessing(isHost);
    if(phase==="reveal") return renderDrawReveal(isHost);
    if(phase==="ended") return renderDrawEnded(isHost);
    return renderConnecting();
  }
  if(gameType==="werewolf"){
    if(phase==="lobby") return renderLobby(isHost);
    // 遊戲已經開始後才加入/重新整理進來的人，房間裡沒有幫他分配角色，這些畫面都預設看得到者已有角色，直接擋掉。
    if(!(roomData.roles && roomData.roles[identity.playerId])) return renderWerewolfNoRole();
    if(phase==="night") return renderWerewolfNight(me, isHost);
    if(phase==="hunter") return renderWerewolfHunterShoot(me, isHost);
    if(phase==="daydeaths") return renderWerewolfDayDeaths(isHost);
    if(phase==="discuss") return renderWerewolfDiscuss(isHost);
    if(phase==="vote") return renderWerewolfVote(me, isHost);
    if(phase==="voteresult") return renderWerewolfVoteResult(isHost);
    if(phase==="ended") return renderWerewolfEnded(isHost);
    return renderConnecting();
  }
  if(gameType==="avalon"){
    if(phase==="lobby") return renderLobby(isHost);
    // 遊戲已經開始後才加入/重新整理進來的人，房間裡沒有幫他分配角色，這些畫面都預設看得到者已有角色，直接擋掉。
    if(!(roomData.roles && roomData.roles[identity.playerId])) return renderAvalonNoRole();
    if(phase==="reveal") return renderAvalonReveal(me, isHost);
    if(phase==="team") return renderAvalonTeam(me, isHost);
    if(phase==="vote") return renderAvalonVote(me, isHost);
    if(phase==="voteresult") return renderAvalonVoteResult(isHost);
    if(phase==="mission") return renderAvalonMission(me, isHost);
    if(phase==="missionresult") return renderAvalonMissionResult(isHost);
    if(phase==="assassin") return renderAvalonAssassin(me, isHost);
    if(phase==="ended") return renderAvalonEnded(isHost);
    return renderConnecting();
  }
  if(gameType==="codenames"){
    if(phase==="lobby") return renderLobby(isHost);
    if(phase==="clue" || phase==="guess" || phase==="ended"){
      // 指揮官正在輸入提示時，背景更新不要整頁重畫（會讓輸入框失焦、鍵盤收起）；階段一變就會照常重畫。
      const ae = document.activeElement;
      if(phase==="clue" && ae && ae.id==="cnClueInput") return;
      return renderCnGame(me, isHost);
    }
    return renderConnecting();
  }
  if(gameType==="justone"){
    if(phase==="lobby") return renderLobby(isHost);
    if(phase==="clue" || phase==="guess" || phase==="result" || phase==="ended"){
      // 正在輸入提示/答案時，背景更新不要整頁重畫（會讓輸入框失焦、鍵盤收起）；階段或輪次一變就會照常重畫。
      const ae = document.activeElement;
      if(ae && ((phase==="clue" && ae.id==="joHintInput") || (phase==="guess" && ae.id==="joGuessInput")) && joRenderedKey===phase+"|"+joKeyOf(roomData)) return;
      return renderJoGame(me, isHost);
    }
    return renderConnecting();
  }
  if(phase==="lobby") return renderLobby(isHost);
  if(phase==="question") return renderQuestion(me, isHost);
  if(phase==="reveal") return renderReveal(isHost);
  if(phase==="ended") return renderEnded(isHost);
  renderConnecting();
}

  document.getElementById("durPlus").onclick = ()=> updateSettings({duration: Math.min(30, settings.duration+5)});
  document.getElementById("tgtMinus").onclick = ()=> updateSettings({targetStrikes: Math.max(2, settings.targetStrikes-1)});
  document.getElementById("tgtPlus").onclick = ()=> updateSettings({targetStrikes: Math.min(10, settings.targetStrikes+1)});
  document.querySelectorAll("[data-mode]").forEach(b=> b.onclick = ()=> updateSettings({mode: b.dataset.mode}));
  document.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.cat;
      const current = new Set(settings.enabledCategories && settings.enabledCategories.length ? settings.enabledCategories : ALL_CATEGORY_IDS);
      if(current.has(id)){
        if(current.size>1) current.delete(id); // keep at least one category enabled
      } else {
        current.add(id);
      }
      updateSettings({enabledCategories: ALL_CATEGORY_IDS.filter(c=>current.has(c))});
    };
  });
}

async function doSaveCustomQuestion(){
  const q = bankDraft.q.trim();
  const opts = bankDraft.opts.map(o=>o.trim());
  if(!q || opts.some(o=>!o)){ bankError = "題目跟四個選項都要填喔"; render(); return; }
  if(!q.includes("PP")){ bankError = "題目裡要包含 PP，出題時才會換成本輪主角的名字"; render(); return; }
  const d = await ensureDb();
  if(!d){ bankError = "目前無法連線儲存"; render(); return; }
  try{
    if(bankEditingId){
      await customQuestionsCol.doc(bankEditingId).update({q, options:opts, category: bankDraft.cat||"life", targeted:true});
    } else {
      await customQuestionsCol.add({q, options:opts, category: bankDraft.cat||"life", targeted:true, createdAt: Date.now()});
    }
    bankFormOpen = false; bankEditingId = null; bankDraft = {q:"", opts:["","","",""], cat:"life"}; bankError = "";
    render();
  }catch(e){ bankError = "儲存失敗：" + ((e && (e.message||e.code)) || String(e)); render(); }
}

function remainingSeconds(){
  if(!roomData || !roomData.roundEndAt) return 0;
  return Math.max(0, (roomData.roundEndAt - Date.now())/1000);
}

let revealAnimRound = null;
let revealStage = 0;
let revealTimers = [];
function clearRevealTimers(){ revealTimers.forEach(t=>clearTimeout(t)); revealTimers=[]; }
function startRevealAnim(round){
  clearRevealTimers();
  revealAnimRound = round;
  revealStage = 0;
  // 翻牌的 CSS 動畫要 0.55 秒才轉完，原本每 420ms 就翻下一張，
  // 會在前一張還沒轉完時就疊上新的翻轉，看起來像在「搶拍」、一閃而過。
  // 這裡把起始停頓跟每張間隔都拉長到比動畫時間長一點，讓每張牌都轉完才翻下一張，
  // 同時也讓答題畫面切過來後有個喘息的瞬間，不會覺得畫面在硬切。
  const startDelay = 700;
  const stepDelay = 650;
  LETTERS.forEach((_,i)=>{
    revealTimers.push(setTimeout(()=>{ revealStage = i+1; render(); }, startDelay + stepDelay*i));
  });
}

function renderScoreboard(){
  const target = (roomData.settings && roomData.settings.targetStrikes) || 3;
  const ranked = playersData.slice().sort((a,b)=>{

    return rb-ra;
  });
  return `
    <div class="card revealfade">
      <div class="badge purple">戰況</div>
      <label>目前戰況（剩餘分數，越多越安全）</label>
      <div class="barchart">
        ${ranked.map(p=>{
          const remain = Math.max(0, target-(p.strikes||0));
          const pct = target>0 ? Math.round(remain/target*100) : 0;
          return `<div class="barrow ${p.id===identity.playerId?'me':''}">
            <div class="barlabel">${avatarOf(p)} ${esc(p.name)}</div>
            <div class="bartrack"><div class="barfill" style="width:${pct}%"></div></div>
            <div class="barvalue">${remain}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

function renderReveal(isHost){
  const log = (roomData.revealLog||[]);
  const last = log[log.length-1];
  if(!last){ renderConnecting(); return; }
  if(revealAnimRound !== last.round) startRevealAnim(last.round);
  const struckSet = new Set(last.struckIds||[]);
  const noAnswer = (last.noAnswerIds||[]).map(id=> avatarOf(playersData.find(p=>p.id===id)) + " " + ((playersData.find(p=>p.id===id)||{}).name || "?"));
  const doneFlipping = revealStage >= LETTERS.length;
  if(doneFlipping && soundedRound !== last.round){
    soundedRound = last.round;
    const iWasOut = struckSet.has(identity.playerId) || (last.noAnswerIds||[]).includes(identity.playerId);
    playResultSound(!iWasOut);
  }

  app.innerHTML = `

              <div class="flipface back ${isStruck?'struck':''} ${(doneFlipping&&isStruck)?'struck-blink':''}">

    <button class="btn-ghost" id="leaveBtn">離開房間</button>

  if(doneFlipping && isHost) document.getElementById("nextBtn").onclick = doNextQuestion;
  document.getElementById("leaveBtn").onclick = doLeave;

// 用手指/滑鼠拖曳排序：拖曳過程中不整頁重畫（只移動被拖的那一列＋讓其他列讓位），
// 放開時才把新順序寫回 mlRankOrder 並重新整頁畫面。
function wireMLDrag(){
  const list = document.querySelector(".mlranklist");
  if(!list) return;
  list.querySelectorAll("[data-handle]").forEach(handle=>{
    handle.addEventListener("pointerdown", (e)=> startMLDrag(e, handle.closest(".mlrankitem"), list));
  });
}

function startMLDrag(e, item, list){
  if(!item || !list) return;
  e.preventDefault();
  const id = item.dataset.id;
  const baseOrder = mlRankOrder.slice();
  const fromIndex = baseOrder.indexOf(id);
  if(fromIndex<0) return;
  mlDragging = true;
  const rows = Array.from(list.children);
  const gap = 8; // 對應 .mlranklist 的 gap
  const rowHeight = item.getBoundingClientRect().height + gap;
  const startY = e.clientY;
  let lastToIndex = fromIndex;
  try{ item.setPointerCapture(e.pointerId); }catch(err){}
  item.classList.add("dragging");

  function applyOffsets(toIndex){
    rows.forEach((row,i)=>{
      if(row===item) return;
      let shift = 0;
      if(fromIndex < toIndex && i > fromIndex && i <= toIndex) shift = -rowHeight;
      else if(fromIndex > toIndex && i >= toIndex && i < fromIndex) shift = rowHeight;
      row.style.transform = shift ? `translateY(${shift}px)` : "";
    });
  }
  function onMove(ev){
    const dy = ev.clientY - startY;
    item.style.transform = `translateY(${dy}px)`;
    let toIndex = fromIndex + Math.round(dy / rowHeight);
    toIndex = Math.max(0, Math.min(rows.length-1, toIndex));
    if(toIndex !== lastToIndex){ lastToIndex = toIndex; applyOffsets(toIndex); }
  }
  function onUp(){
    item.removeEventListener("pointermove", onMove);
    item.removeEventListener("pointerup", onUp);
    item.removeEventListener("pointercancel", onUp);
    item.classList.remove("dragging");
    rows.forEach(row=>{ row.style.transform = ""; });
    if(lastToIndex !== fromIndex){
      const next = baseOrder.slice();
      next.splice(fromIndex,1);
      next.splice(lastToIndex,0,id);
      mlRankOrder = next;
    }
    mlDragging = false;
    render();
  }
  item.addEventListener("pointermove", onMove);
  item.addEventListener("pointerup", onUp);
  item.addEventListener("pointercancel", onUp);
}

// ---------- 接力畫猜：畫布 ----------

// 畫布固定內部解析度，用 CSS 縮放成響應式大小；座標一律換算成 0~1 的相對位置存進資料庫，
// 這樣不同螢幕大小/裝置的人看到的畫都會對齊，不會因為畫布尺寸不同而變形錯位。
function replayStrokesOnCanvas(canvas, strokes){
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = "#2b2b2b";
  ctx.lineWidth = 5;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  (strokes||[]).forEach(s=>{
    const path = s.path||[];
    if(path.length<1) return;
    ctx.beginPath();
    path.forEach((pt,i)=>{
      const x = pt[0]*canvas.width, y = pt[1]*canvas.height;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
}

function setupDrawCanvas(canvasId, enabled){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  canvas.width = 600; canvas.height = 450;
  replayStrokesOnCanvas(canvas, strokesData);
  if(!enabled) return;
  let currentPath = null;
  function posFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    return [Math.max(0,Math.min(1,x)), Math.max(0,Math.min(1,y))];
  }
  function onDown(e){
    e.preventDefault();
    drawingInProgress = true; // 畫的當下暫停整頁重畫，不然畫布會被背景更新換掉、畫一半跳掉
    currentPath = [posFromEvent(e)];
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
  }
  function onMove(e){
    if(!currentPath) return;
    currentPath.push(posFromEvent(e));
    const ctx = canvas.getContext("2d");
    ctx.strokeStyle = "#2b2b2b"; ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.lineCap = "round";
    const n = currentPath.length;
    if(n>=2){
      const [x1,y1] = currentPath[n-2], [x2,y2] = currentPath[n-1];
      ctx.beginPath();
      ctx.moveTo(x1*canvas.width, y1*canvas.height);
      ctx.lineTo(x2*canvas.width, y2*canvas.height);
      ctx.stroke();
    }
  }
  function onUp(){
    canvas.removeEventListener("pointermove", onMove);
    canvas.removeEventListener("pointerup", onUp);
    canvas.removeEventListener("pointercancel", onUp);
    const path = currentPath;
    currentPath = null;
    drawingInProgress = false;
    if(path && path.length>1) commitStroke(path);
    else render();
  }
  canvas.addEventListener("pointerdown", onDown);
}

async function commitStroke(path){
  const stroke = {round: roomData.round, playerId: identity.playerId, path, ts: Date.now()};
  // 先樂觀地把這一筆加進本地資料重畫一次，免得放開手指那瞬間、資料庫還沒回傳前畫面閃一下不見；
  // 等 onSnapshot 真的收到這筆資料時，strokesData 會整包被換成資料庫的版本，這筆本地暫存會自然被取代掉。
  strokesData = strokesData.concat([{...stroke, id:`local_${Date.now()}_${Math.random().toString(36).slice(2,7)}`}]);
  render();
  try{
    await strokesCol.doc().set(stroke);
    touchActivity();
  }catch(e){}
}

// 拉霸式抽題動畫：三個字詞欄位各自快速跑動後依序停下，最後停在真正抽到的題目。
// 期間把 drawPromptAnimating 設為 true，讓 render() 暫停整頁重畫，避免動畫被打斷。
function playDrawSlotAnim(subject, place, action){
  const elS = document.getElementById("slotSubject");
  const elP = document.getElementById("slotPlace");
  const elA = document.getElementById("slotAction");
  if(!elS || !elP || !elA){ drawPromptAnimating = false; return; }
  drawPromptAnimating = true;
  const reels = [
    {el: elS, pool: DRAW_SUBJECTS, final: subject, stopAt: 650},
    {el: elP, pool: DRAW_PLACES, final: place, stopAt: 950},
    {el: elA, pool: DRAW_ACTIONS, final: action, stopAt: 1300}
  ];
  const start = Date.now();
  reels.forEach((r, i)=>{
    r.el.classList.add("spin");
    const tick = ()=>{
      const elapsed = Date.now() - start;
      if(elapsed >= r.stopAt){
        r.el.textContent = r.final;
        r.el.classList.remove("spin");
        r.el.classList.add("landed");
        beep(520 + i*160, 70, "square");
        vibrate(12);
        return;
      }
      r.el.textContent = r.pool[Math.floor(Math.random()*r.pool.length)];
      const delay = (r.stopAt - elapsed) < 220 ? 110 : 55;
      setTimeout(tick, delay);
    };
    tick();
  });
  setTimeout(()=>{ drawPromptAnimating = false; render(); }, 1300 + 120);
}

// 5 個任務圓圈（成功/失敗/目前這輪/尚未進行的隊伍人數）+ 連續否決計數。
function renderAvalonTracker(){
  const n = avalonN();
  const results = roomData.missionResults || [];
  const missionNo = roomData.missionNo || 1;
  const rc = Math.max(0, Math.min(5, roomData.rejectCount || 0));
  const dots = [1,2,3,4,5].map(i=>{
    const r = results[i-1];
    if(r) return `<div class="avdot ${r.ok?'ok':'bad'}">${r.ok?'✓':'✗'}</div>`;
    const size = avalonTeamSize(n, i) + (avalonFailsNeeded(n, i)===2 ? '*' : '');
    return `<div class="avdot ${(i===missionNo && roomData.phase!=='ended')?'cur':''}">${size}</div>`;
  }).join("");
  return `
    <div class="avtracker">
      <div class="avdots">${dots}</div>
      <div class="avreject">否決 ${"●".repeat(rc)}${"○".repeat(5-rc)}</div>
    </div>
  `;
}

function renderCnGame(me, isHost){
  const rd = roomData;
  const phase = rd.phase;
  const board = rd.board || [];
  const myTeam = (me.team==="red" || me.team==="blue") ? me.team : null;
  const sm = rd.spymasters || {};
  const isSpy = !!myTeam && sm[myTeam]===me.id;
  const ended = phase==="ended";
  const turn = rd.turnTeam;
  const canGuess = phase==="guess" && myTeam===turn && !isSpy;
  const canClue = phase==="clue" && myTeam===turn && isSpy;
  const showAll = isSpy || ended;
  const key = `${(rd.clueLog||[]).length}|${turn}|${phase}`;
  if(cnSelKey!==key){ cnSelKey = key; cnSel = null; if(phase==="clue"){ cnClueDraft = ""; cnClueError = ""; } }
  if(cnSel!=null && (!board[cnSel] || board[cnSel].revealed)) cnSel = null;
  const left = cnCountLeft(board);
  const redLeft = (typeof rd.redLeft==="number") ? rd.redLeft : left.red;
  const blueLeft = (typeof rd.blueLeft==="number") ? rd.blueLeft : left.blue;
  const clue = rd.clue;
  const spyGone = !!turn && !!sm[turn] && !playersData.some(p=>p.id===sm[turn] && (p.id===identity.playerId || isOnline(p, Date.now())));

  const roleHtml = myTeam
    ? `<div class="cnrole ${myTeam}">${CN_TEAM_EMOJI[myTeam]} 你是${CN_TEAM_LABEL[myTeam]} · ${isSpy?'指揮官':'猜測者'}</div>${isSpy && !ended ? `<p class="helper" style="margin:6px 0 0; text-align:left;">你看得到所有牌的顏色，別讓隊友偷看你的手機。</p>` : ``}`
    : `<div class="cnrole">👀 旁觀者</div><p class="helper" style="margin:6px 0 0; text-align:left;">這局開始時你還沒加入隊伍，只能看盤面，沒有操作權限。下一局再一起玩！</p>`;

  const statusHtml = ended ? `` : `
    <div class="cnstatus">
      <div class="cnscores"><span class="cnpill red">🔴 剩 ${redLeft}</span><span class="cnpill blue">🔵 剩 ${blueLeft}</span></div>
      <div class="cnturn">輪到 <b class="cn-${turn}">${CN_TEAM_EMOJI[turn]||''} ${esc(CN_TEAM_LABEL[turn]||'')}</b> ${phase==="clue"?'給提示':'猜測'}</div>
      ${clue && phase==="guess" ? `<div class="cnclue">提示：<b>${esc(clue.word)}</b> · ${clue.num===0?'無限':clue.num}<span class="cnleft">剩 ${(rd.guessesLeft||0)>=99?'無限':(rd.guessesLeft||0)} 次猜測</span></div>` : ``}
      <div class="helper" style="margin:6px 0 0; text-align:left;">指揮官：${sm.red?`🔴 ${cnName(sm.red)}`:''}　${sm.blue?`🔵 ${cnName(sm.blue)}`:''}</div>
    </div>`;

  let bannerHtml = "";
  if(ended){
    const w = rd.winner;
    const lost = myTeam && myTeam!==w;
    bannerHtml = `
      <div class="${lost?'losebanner':'winbanner'}">
        <h2>${CN_TEAM_EMOJI[w]||''} ${esc(CN_TEAM_LABEL[w]||'')}勝利！</h2>
        <p>${esc(CN_TEAM_LABEL[w]||'')}${esc(CN_WIN_REASON[rd.winReason]||'贏得了比賽')}</p>
      </div>`;
  }

  const cardsHtml = board.map((c,i)=>{
    const cls = ["cncard"];
    if(c.revealed) cls.push("rev", c.color);
    else if(showAll) cls.push("hint", c.color);
    const tappable = canGuess && !c.revealed;
    if(tappable) cls.push("tap");
    if(cnSel===i) cls.push("sel");
    const mark = (!c.revealed && showAll && c.color==="assassin") ? `<span class="cnmark">☠</span>` : ``;
    return `<div class="${cls.join(" ")}" data-cn="${i}">${esc(c.word)}${mark}</div>`;
  }).join("");

  let actionHtml = "";
  if(!ended){
    if(phase==="clue"){
      if(canClue){
        actionHtml = `
          <div class="card" style="margin-top:12px;">
            <label style="margin-top:0;">給你的隊友一個提示詞</label>
            <input type="text" id="cnClueInput" maxlength="8" placeholder="一個詞（最多 8 字）" autocomplete="off" value="${esc(cnClueDraft)}">

            </div>
            <div class="error">${esc(cnClueError)}</div>
            <button class="btn-primary" id="cnClueBtn">送出提示</button>
          </div>`;
      } else if(myTeam===turn && myTeam){
        actionHtml = `<div class="card" style="margin-top:12px; text-align:center;"><p style="margin:0;">等待你們的指揮官給提示…</p></div>`;
      } else {
        actionHtml = `<div class="card" style="margin-top:12px; text-align:center;"><p style="margin:0;">等待 ${esc(CN_TEAM_LABEL[turn]||'')}指揮官給提示…</p></div>`;
      }
    } else if(phase==="guess"){
      if(canGuess){
        const sel = cnSel!=null ? board[cnSel] : null;
        actionHtml = `
          <div class="card" style="margin-top:12px;">
            <p class="helper" style="margin:0 0 10px; text-align:left;">${sel?`已選「<b>${esc(sel.word)}</b>」，確定要翻開嗎？`:'點一張牌選取，再按「確定翻開」。'}</p>
            <button class="btn-primary" id="cnConfirmBtn" ${sel?'':'disabled'}>確定翻開</button>
            <button class="btn-secondary" id="cnEndBtn" style="margin-top:10px;">結束猜測</button>
          </div>`;
      } else if(isSpy && myTeam===turn){
        actionHtml = `<div class="card" style="margin-top:12px; text-align:center;"><p style="margin:0;">隊友猜測中，你只能安靜等待…</p></div>`;
      } else {
        actionHtml = `<div class="card" style="margin-top:12px; text-align:center;"><p style="margin:0;">${esc(CN_TEAM_LABEL[turn]||'')}猜測中…</p></div>`;
      }
    }
    if(isHost){
      actionHtml += `<button class="btn-ghost" id="cnForceBtn">${spyGone?'指揮官已離開或離線，換一位指揮官':'強制換隊（跳過目前回合）'}</button>`;
    }
  }

  const endedExtra = ended ? `
    ${isHost ? `<button class="btn-primary" id="rematchBtn" style="margin-top:12px;">再來一局</button>` : `<p class="helper">等待房主開始下一局</p>`}` : ``;

  app.innerHTML = `
    <div class="card">
      ${roleHtml}
    </div>
    ${bannerHtml}
    ${statusHtml}
    <div class="cngrid">${cardsHtml}</div>
    ${actionHtml}
    ${cnClueLogHtml()}
    ${endedExtra}
    <button class="btn-ghost" id="leaveBtn">離開房間</button>
    ${helpModalOpen ? renderCnHelpModal() : ``}
  `;

  document.getElementById("leaveBtn").onclick = doLeave;
  if(helpModalOpen) wireCnHelpModal();
  const logBtn = document.getElementById("cnLogBtn");
  if(logBtn) logBtn.onclick = ()=>{ cnLogOpen = !cnLogOpen; render(); };
  if(canGuess){
    document.querySelectorAll(".cncard.tap").forEach(el=> el.onclick = ()=>{
      const i = parseInt(el.dataset.cn, 10);
      cnSel = (cnSel===i) ? null : i;
      render();
    });
    const cb = document.getElementById("cnConfirmBtn");
    if(cb) cb.onclick = doCnGuess;
    document.getElementById("cnEndBtn").onclick = doCnEndGuess;
  }
  if(canClue){
    const input = document.getElementById("cnClueInput");
    input.oninput = e=>{ cnClueDraft = e.target.value; };
    input.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); input.blur(); doCnSubmitClue(); } };
    document.querySelectorAll("[data-cnnum]").forEach(b=> b.onclick = ()=>{
      cnNumDraft = parseInt(b.dataset.cnnum, 10);
      document.querySelectorAll("[data-cnnum]").forEach(x=> x.classList.toggle("on", x===b));
    });
    document.getElementById("cnClueBtn").onclick = ()=>{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); doCnSubmitClue(); };
  }
  const fb = document.getElementById("cnForceBtn");
  if(fb) fb.onclick = ()=>{ if(confirm(spyGone?'要幫這隊換一位指揮官嗎？':'要跳過這一隊目前的回合嗎？')) doCnForceSkip(); };
  if(isHost && ended) document.getElementById("rematchBtn").onclick = doRematchCodenames;
}

function renderJoGame(me, isHost){
  const rd = roomData;
  const phase = rd.phase;
  const myId = identity.playerId;
  const total = joTotal(rd.settings);
  const word = (rd.deck||[])[rd.deckIndex||0] || "";
  const guesserId = rd.guesserId;
  const eligible = rd.clueEligible || [];
  const hints = rd.hints || {};
  const removed = rd.removedIds || [];
  const validHints = rd.validHints || [];
  const role = myId===guesserId ? "guesser" : (eligible.includes(myId) ? "hinter" : "spectator");
  const ended = phase==="ended";
  const key = joKeyOf(rd);
  if(joDraftKey!==key){ joDraftKey = key; joHintDraft = ""; joHintError = ""; joGuessDraft = ""; joGuessError = ""; }
  joRenderedKey = phase + "|" + key;
  const nowMs = Date.now();
  const isPresent = id=> playersData.some(p=>p.id===id && (p.id===myId || isOnline(p, nowMs)));
  const guesserGone = !!guesserId && !isPresent(guesserId);
  const presentEl = eligible.filter(isPresent);
  const submitted = presentEl.filter(id=> hints[id]!=null);
  const score = rd.score || 0;
  const used = Math.min(rd.cardsUsed || 0, total);
  const verdict = rd.joVerdict;

  const roleHtml = role==="guesser"
    ? `<div class="cnrole">🤔 你是猜詞者</div>`
    : role==="hinter"
    ? `<div class="cnrole">💡 你是提示者</div>`

  const wordHtml = `<div class="jolabel">神祕詞</div><div class="joword">${esc(word)}</div>`;

    if(role==="guesser"){
      bodyHtml = `
        <div class="card" style="text-align:center;">
          <div style="font-size:42px;">🤔</div>
          <p style="font-size:18px; font-weight:800; margin:8px 0;">大家正在想提示…</p>

        </div>`;
    } else if(role==="hinter" && hints[myId]==null){
      bodyHtml = `
        <div class="card">
          ${wordHtml}
          <label>寫一個提示，幫猜詞者猜出來</label>
          <input type="text" id="joHintInput" maxlength="8" placeholder="一個詞（最多 8 字）" autocomplete="off" value="${esc(joHintDraft)}">

          <button class="btn-primary" id="joHintBtn">送出</button>
          <div style="margin-top:10px;">${progressHtml}</div>
        </div>`;
    } else if(role==="hinter"){
      bodyHtml = `
        <div class="card" style="text-align:center;">
          ${wordHtml}
          <p style="font-size:17px; font-weight:800; margin:8px 0;">已送出，等待其他人</p>
          <p class="helper" style="margin:0 0 6px;">你的提示：<b>${esc(hints[myId])}</b></p>
          ${progressHtml}
        </div>`;
    } else {
      bodyHtml = `
        <div class="card" style="text-align:center;">
          ${wordHtml}
          <p style="font-size:16px; font-weight:800; margin:8px 0;">大家正在寫提示…</p>
          ${progressHtml}
        </div>`;
    }
  } else if(phase==="guess"){
    if(role==="guesser"){
      bodyHtml = `

          <label style="margin-top:0;">你的提示（${validHints.length}）</label>
          ${validHints.length ? hintChips(validHints.map(h=>h.text)) : `<p class="helper" style="text-align:left;">所有提示都被作廢了…只能憑直覺猜，或選擇跳過。</p>`}

          <input type="text" id="joGuessInput" maxlength="20" placeholder="輸入你猜的詞" autocomplete="off" value="${esc(joGuessDraft)}">
          <div class="error">${esc(joGuessError)}</div>
          <button class="btn-primary" id="joGuessBtn">猜！</button>
          <button class="btn-secondary" id="joSkipBtn" style="margin-top:10px;">跳過</button>
        </div>`;
    } else {
      const removedTexts = removed.map(pid=>hints[pid]).filter(t=>t!=null);
      bodyHtml = `
        <div class="card">
          ${wordHtml}
          <label>提示</label>
          ${validHints.length ? hintChips(validHints.map(h=>h.text)) : ``}
          ${removedTexts.length ? hintChips(removedTexts, "off") : ``}
          ${(!validHints.length && !removedTexts.length) ? `<p class="helper" style="text-align:left;">沒有任何提示</p>` : ``}

    const bannerSub = verdict==="correct"
      ? (rd.joOverridden ? "房主改判為正確，+1 分" : "+1 分，用掉 1 張牌")

  let hostHtml = "";
  if(isHost && (phase==="clue" || phase==="guess")){
    if(guesserGone) hostHtml += `<button class="btn-secondary" id="joReplaceBtn" style="margin-top:4px;">猜詞者已離開或離線，換一位猜詞者（跳過這張牌）</button>`;

    </div>

  `;

  document.getElementById("leaveBtn").onclick = doLeave;
  document.getElementById("joHelpBtn").onclick = ()=>{ helpModalOpen = true; render(); };
  if(helpModalOpen) wireJoHelpModal();
  const hi = document.getElementById("joHintInput");
  if(hi){
    hi.oninput = e=>{ joHintDraft = e.target.value; };
    hi.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); hi.blur(); doJoSubmitHint(); } };
    document.getElementById("joHintBtn").onclick = ()=>{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); doJoSubmitHint(); };
  }
  const gi = document.getElementById("joGuessInput");
  if(gi){
    gi.oninput = e=>{ joGuessDraft = e.target.value; };
    gi.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); gi.blur(); doJoGuess(false); } };
    document.getElementById("joGuessBtn").onclick = ()=>{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); doJoGuess(false); };
    document.getElementById("joSkipBtn").onclick = ()=>{ if(confirm("確定要跳過這張牌嗎？（不得分，用掉 1 張牌）")) doJoGuess(true); };
  }
  const fb = document.getElementById("joForceBtn");
  if(fb) fb.onclick = ()=>{ if(confirm("要用目前已送出的提示直接進入猜測嗎？沒送出的人就沒有提示了。")) doJoForce(); };
  const rb = document.getElementById("joReplaceBtn");
  if(rb) rb.onclick = ()=>{ if(confirm("要跳過這張牌，換下一位猜詞者嗎？（用掉 1 張牌）")) doJoReplaceGuesser(); };
  const ob = document.getElementById("joOverrideBtn");
  if(ob) ob.onclick = doJoOverride;
  const nb = document.getElementById("joNextBtn");
  if(nb) nb.onclick = doJoContinue;
  if(isHost && ended) document.getElementById("rematchBtn").onclick = doRematchJustone;
}

// ---------- data / actions ----------

async function ensureDb(){
  if(db) return db;
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; }
  return db;
}

// Firestore 沒有內建的 acquire() 租約機制，這裡用一個 transaction 模擬「同一時間只有一個人能執行」的效果。
async function acquireLock(ref, holder, ttlMs){
  try{
    let acquired = false;
    const lockRef = ref.collection("_locks").doc("resolve");
    await db.runTransaction(async tx=>{
      const snap = await tx.get(lockRef);
      const now = Date.now();
      const data = snap.exists ? snap.data() : null;
      if(data && data.expiresAt > now){ acquired = false; return; }
      tx.set(lockRef, {holder, expiresAt: now + (ttlMs||4000)});
      acquired = true;
    });
    return {acquired};
  }catch(e){ return {acquired:false}; }
}

// 釋放鎖：只有 holder 相符才刪除鎖文件（鎖已經過期被別人拿走時不會誤刪對方的鎖）。
async function releaseLock(ref, holder){
  try{
    const lockRef = ref.collection("_locks").doc("resolve");
    await db.runTransaction(async tx=>{
      const snap = await tx.get(lockRef);
      const data = snap.exists ? snap.data() : null;
      if(data && data.holder === holder) tx.delete(lockRef);
    });
    return true;
  }catch(e){ return false; }
}

// 共用的鎖介面（遊戲程式碼一律透過 sync.js 的 withRoomLock 使用，不直接呼叫）。
function lockRoom(ref, holder, ttlMs){ return acquireLock(ref, holder, ttlMs); }
function unlockRoom(ref, holder){ return releaseLock(ref, holder); }

// 欄位層級的原子更新：Firestore 的 update() 原生支援 "a.b.c" 點路徑，只改那一個欄位，不會蓋掉別人同時寫的其他欄位。
function patchDoc(ref, flat){ return ref.update(flat); }
// 點路徑更新本身就是原子的，不需要寫完再讀回來確認。
const VERIFY_FIELD_WRITES = false;

// 房間文件的參照：Firestore 的 update() 本來就是「頂層欄位取代」，不需要包裝。
function wrapRoomRef(ref){ return ref; }

      acks:{}, leaderId:null, missionNo:0, missionResults:[], rejectCount:0, teamSelection:[], teamVotes:{}, missionVotes:{},
      lastMissionFails:0, assassinTarget:null, winReason:null,

      deck:[], deckIndex:0, guesserOrder:[], guesserId:null, cardsUsed:0, score:0, clueEligible:[], hints:{}, validHints:[], removedIds:[],
      joGuess:null, joVerdict:null, joOverridden:false, joLog:[],
      createdAt: Date.now(), lastActivityAt: Date.now()
    });
    await ref.collection("players").doc(pid).set({ name, avatar:homeAvatar, joinedAt: Date.now(), lastSeen: Date.now(), strikes:0, mlScore:0, ready:false });

async function doJoin(){
  joinError = "";
  const name = homeName.trim();
  const code = homeCode.trim().toUpperCase();
  if(!name){ joinError = "請先輸入暱稱"; render(); return; }
  if(code.length!==4){ joinError = "房間代碼是 4 碼"; render(); return; }
  const d = await ensureDb();
  if(!d){ joinError = "目前無法連線加入房間，稍後再試"; render(); return; }
  const ref = d.doc(`telepathyrooms/${code}`);
  const snap = await ref.get().catch(()=>({exists:false}));
  if(!snap.exists){ joinError = "找不到這個房間，確認代碼是否正確"; render(); return; }
  const rd = snap.data()||{};
  const lastActive = rd.lastActivityAt || rd.createdAt || 0;
  if(lastActive && (Date.now()-lastActive > ROOM_EXPIRE_MS)){
    joinError = "這個房間已經太久沒有動靜、過期了，請朋友開一個新房間";
    deleteRoomBestEffort(ref);
    render(); return;
  }
  // 舊房間沒有 password 欄位（undefined/null）= 不需要密碼。已加入者的 identity 存在 sessionStorage，
  // 重新整理走 connectRoom()，不經過這裡，所以不用重填密碼。（UI 層門檻，見 doCreate 註解。）
  if(rd.password){
    if(String(homePassword||"").trim() !== String(rd.password)){ joinError = "這個房間需要密碼，或密碼不正確"; render(); return; }
  }
  const pid = uid();
  try{ await ref.collection("players").doc(pid).set({ name, avatar:homeAvatar, joinedAt: Date.now(), lastSeen: Date.now(), strikes:0, mlScore:0, ready:false }); }
  catch(e){ joinError="加入房間失敗，請再試一次"; render(); return; }
  try{ await ref.update({lastActivityAt: Date.now()}); }catch(e){}
  identity = {code, playerId: pid, name};
  homePassword = "";
  saveIdentity(identity);
  connectRoom();
}
