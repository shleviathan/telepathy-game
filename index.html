<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>派對遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Orbitron:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#eae3da; --surface:#f8f4ee; --surface-2:#e6ddd1; --ink:#4a4038; --muted:#93887c;
  --accent:#a68b7c; --accent-ink:#fdfaf7; --warn:#b57568; --warn-ink:#fff8f6; --safe:#7f9482; --safe-ink:#f3f8f4;
  --gold:#c0a377; --line:#d9cebd; --shadow:rgba(58,48,38,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2a2521; --surface:#332d27; --surface-2:#3d362e; --ink:#e9e1d6; --muted:#a89b8b;
    --accent:#c4a493; --accent-ink:#2b1c15; --warn:#c68e7c; --warn-ink:#2b1712; --safe:#9bab97; --safe-ink:#17211a;
    --gold:#d0b788; --line:#4a4138; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#2a2521; --surface:#332d27; --surface-2:#3d362e; --ink:#e9e1d6; --muted:#a89b8b;
  --accent:#c4a493; --accent-ink:#2b1c15; --warn:#c68e7c; --warn-ink:#2b1712; --safe:#9bab97; --safe-ink:#17211a;
  --gold:#d0b788; --line:#4a4138; --shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 560px at 12% -8%, color-mix(in srgb, var(--accent) 16%, transparent), transparent),
    radial-gradient(700px 480px at 92% 6%, color-mix(in srgb, var(--safe) 10%, transparent), transparent),
    var(--bg);
  color:var(--ink);
  font-family:-apple-system,ui-sans-serif,"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  min-height:100vh; display:flex; justify-content:center;
  padding:26px 14px 60px;
}
h1,h2{font-family:"Noto Sans TC",sans-serif; font-weight:900; text-wrap:balance; margin:0;}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
.digits{font-family:"Orbitron",ui-monospace,monospace;}
.wrap{width:100%; max-width:440px;}

.masthead{text-align:center; margin-bottom:18px;}
.masthead .kicker{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.28em; color:var(--muted); text-transform:uppercase;}
.masthead h1{font-size:32px; margin-top:4px; background:linear-gradient(100deg, var(--accent), var(--safe)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.masthead .sub{color:var(--muted); font-size:13px; margin-top:6px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 40px -22px var(--shadow), 0 2px 0 var(--line) inset; padding:22px; margin-bottom:16px; position:relative;}
.badge{position:absolute; top:14px; right:14px; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.16em; padding:5px 10px; border-radius:20px; text-transform:uppercase; font-weight:800;}
.badge.purple{background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--accent);}
.badge.red{background:color-mix(in srgb, var(--warn) 20%, transparent); color:var(--warn);}
.badge.green{background:color-mix(in srgb, var(--safe) 20%, transparent); color:var(--safe);}

label{display:block; font-size:12px; letter-spacing:.08em; color:var(--muted); margin:0 0 6px; text-transform:uppercase; font-weight:700;}
input[type=text]{width:100%; font-size:17px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-family:inherit; margin-bottom:14px;}
input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px;}
.roomcode-input{font-family:"JetBrains Mono",monospace; letter-spacing:.3em; text-transform:uppercase; text-align:center; font-size:22px;}

button{font:inherit; cursor:pointer; border:none; border-radius:14px; padding:13px 18px; font-weight:800; font-size:15px; width:100%; transition:transform .08s ease, filter .15s ease;}
button:active{transform:scale(.98);}
button:disabled{opacity:.4; cursor:not-allowed;}
.btn-primary{background:linear-gradient(120deg, var(--accent), #c9ab98); color:var(--accent-ink);}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);}
.btn-secondary{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn-secondary:hover:not(:disabled){background:var(--surface-2);}
.btn-ghost{background:transparent; color:var(--muted); font-weight:700; font-size:13px; padding:8px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.stack{display:flex; flex-direction:column; gap:10px;}

.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tab{flex:1; text-align:center; padding:10px; border-radius:12px; font-weight:800; font-size:14px; border:1.5px solid var(--line); color:var(--muted); cursor:pointer;}
.tab.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}

.gamepicker{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.gamecard{text-align:left; padding:14px 12px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); display:flex; flex-direction:column; gap:4px; min-height:92px; justify-content:center;}
.gamecard.on{background:linear-gradient(150deg, var(--accent), #c9ab98); border-color:var(--accent); color:var(--accent-ink);}
.gamecard .gc-emoji{font-size:22px;}
.gamecard .gc-title{font-weight:800; font-size:14.5px;}
.gamecard .gc-desc{font-size:11.5px; opacity:.8; line-height:1.35;}
.gamecard.wide{grid-column:1/-1;}

.playerlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.playerlist li{display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 13px;}
.pname{font-weight:800; display:flex; align-items:center; gap:8px;}
.pname .you{font-size:10px; color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:1px 6px; letter-spacing:.06em;}
.pname .host{font-size:10px; color:var(--warn); border:1px solid var(--warn); border-radius:6px; padding:1px 6px; letter-spacing:.06em;}
.strikes{font-family:"JetBrains Mono",monospace; font-weight:800; color:var(--warn); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:6px;}
.strikes .dots{display:flex; gap:3px;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
.dot.on{background:var(--warn);}
.prow-actions{display:flex; align-items:center; gap:8px;}
.kickbtn{width:auto; padding:3px 9px; font-size:11px; font-weight:800; background:transparent; color:var(--warn); border:1px solid var(--warn); border-radius:8px; flex:none;}

.settingsrow{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line);}
.settingsrow:first-of-type{border-top:none;}
.settingsrow span{font-size:14px; font-weight:700;}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:32px; height:32px; padding:0; border-radius:9px; font-size:16px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}
.stepper .n{font-family:"JetBrains Mono",monospace; font-weight:800; min-width:44px; text-align:center; font-size:13px;}

.catchips{display:flex; flex-wrap:wrap; gap:8px;}
.catchip{
  width:auto; padding:8px 14px; border-radius:20px; font-size:13px; font-weight:700;
  background:var(--surface-2); color:var(--muted); border:1.5px solid var(--line);
}
.catchip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.cattag{
  display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px;
  background:var(--surface); color:var(--muted); border:1px solid var(--line); margin-top:4px;
}
select{
  width:100%; font-size:15px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-family:inherit; margin-bottom:14px; appearance:none;
}

.avatargrid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:14px;}
.avatarbtn{
  width:auto; padding:0; aspect-ratio:1; font-size:22px; border-radius:11px;
  background:var(--surface-2); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
}
.avatarbtn.on{background:var(--accent); border-color:var(--accent);}
.avatarpick{width:auto; padding:6px 10px; font-size:12px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:20px; flex:none;}
.avatarchip{display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:4px 10px; font-size:12.5px; font-weight:700;}
.avatarchip.mini{background:var(--surface-2); border-color:var(--line); padding:3px 8px; font-size:11.5px; gap:3px; margin:0 4px 4px 0;}
.avatarchip.struckchip{background:var(--warn); border-color:var(--warn); color:var(--warn-ink);}
.helptitle{font-weight:800; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px;}

.iconrow{display:flex; gap:10px; margin-bottom:16px;}
.iconbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:14px 10px; border-radius:14px; background:var(--surface); border:1.5px solid var(--line); box-shadow:0 10px 24px -18px var(--shadow);}
.iconbtn .iconbtn-emoji{font-size:22px;}
.iconbtn span:last-child{font-size:12px; font-weight:700; color:var(--muted);}

.modalbackdrop{position:fixed; inset:0; background:rgba(10,6,20,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0;}
.modalsheet{width:100%; max-width:440px; max-height:86vh; overflow-y:auto; background:var(--surface); border-radius:20px 20px 0 0; padding:20px 20px 28px; box-shadow:0 -14px 44px -12px var(--shadow); animation:slideup .28s cubic-bezier(.2,.6,.3,1);}
.modalhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:sticky; top:-20px; background:var(--surface); padding-top:4px; z-index:2;}
.modalhead h2{font-size:19px;}
.modalclose{width:32px; height:32px; padding:0; border-radius:9px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); font-size:16px; flex:none;}
@keyframes slideup{from{transform:translateY(24px); opacity:.3;} to{transform:translateY(0); opacity:1;}}
@media (prefers-reduced-motion: reduce){.modalsheet{animation:none;}}

.sharerow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:12px; margin-top:10px; flex-wrap:wrap;}
.sharerow.lose{background:color-mix(in srgb, var(--warn) 14%, var(--surface-2)); border:1.5px solid var(--warn);}
.sharerow.win{background:color-mix(in srgb, var(--safe) 14%, var(--surface-2)); border:1.5px solid var(--safe);}
.sharerow-label{font-weight:800; font-size:14px; flex:none;}
.sharerow-people{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end;}

.error{color:var(--warn); font-size:13px; margin:-6px 0 12px; min-height:1em; font-weight:700;}
.helper{color:var(--muted); font-size:13px; text-align:center; margin:0 0 14px;}
.codeshare{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
.codeshare.clear-badge{margin-top:22px;}
.codeshare .code{font-family:"JetBrains Mono",monospace; font-weight:800; font-size:28px; letter-spacing:.22em; color:var(--accent);}
.copybtn{width:auto; padding:8px 12px; font-size:12px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:10px;}
.spin{display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){
  .spin{animation:none;} button{transition:none;} .flipcard-inner{transition:none;} .barfill{transition:none;}
  .revealfade, .noanswer{animation:none; opacity:1; transform:none;}
  .flipface.back.struck-blink{animation:none;}
}

.timerzone{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:14px;}
.ring-wrap{position:relative; width:104px; height:104px;}
.ring-wrap svg{transform:rotate(-90deg); width:100%; height:100%;}
.ring-bg{fill:none; stroke:var(--line); stroke-width:8;}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .18s linear, stroke .2s;}
.ring-fg.low{stroke:var(--warn);}
.ring-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; font-variant-numeric:tabular-nums;}

.qtext{text-align:center; font-family:"Noto Sans TC",sans-serif; font-weight:900; font-size:21px; line-height:1.4; margin:4px 0 18px;}
.optgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.optbtn{
  text-align:left; padding:16px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink);
  display:flex; flex-direction:column; gap:6px; min-height:88px; justify-content:center;
}
.optbtn .letter{font-family:"Orbitron",monospace; font-weight:800; font-size:13px; color:var(--muted);}
.optbtn .txt{font-weight:700; font-size:14.5px; line-height:1.35;}
.optbtn.picked{background:linear-gradient(150deg, var(--accent), #c9ab98); border-color:var(--accent); color:var(--accent-ink);}
.optbtn.picked .letter{color:var(--accent-ink); opacity:.85;}

.pickgrid{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
.pickbtn{display:flex; align-items:center; gap:10px; text-align:left; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-weight:700; font-size:14px;}
.pickbtn.picked{background:linear-gradient(150deg, var(--accent), #c9ab98); border-color:var(--accent); color:var(--accent-ink);}
.pickbtn:disabled{opacity:.5;}
.avtracker{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:6px 0 12px;}
.avdots{display:flex; gap:8px;}
.avdot{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:"JetBrains Mono",monospace; font-weight:800; font-size:13px; border:2px solid var(--line); background:var(--surface-2); color:var(--muted);}
.avdot.cur{border-color:var(--accent); color:var(--accent);}
.avdot.ok{background:var(--safe); border-color:var(--safe); color:#fff;}
.avdot.bad{background:var(--warn); border-color:var(--warn); color:#fff;}
.avreject{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em;}

.mlranklist{display:flex; flex-direction:column; gap:8px; margin-top:4px; position:relative;}
.mlrankitem{display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:10px; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:9px 12px; transition:transform .18s ease; touch-action:none;}
.mlrankitem.base{border-color:var(--accent);}
.mlrankitem.dragging{transition:none; z-index:5; box-shadow:0 14px 30px -16px var(--shadow); background:var(--surface); cursor:grabbing;}
.mlrankidx{font-family:"JetBrains Mono",monospace; font-weight:800; color:var(--muted); text-align:center;}
.mlrankname{font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; user-select:none;}
.mlrankhandle{width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; color:var(--muted); font-size:16px; flex:none; cursor:grab; touch-action:none;}
.mlscale{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin:2px 2px 0; font-weight:700;}

.drawcanvas-wrap{margin-top:10px; border-radius:14px; overflow:hidden; border:1.5px solid var(--line); background:#fff; touch-action:none;}
.drawcanvas-wrap canvas{display:block; width:100%; height:auto; aspect-ratio:4/3; touch-action:none;}
.drawcanvas-wrap.locked{opacity:.85;}
.drawturnstrip{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px;}
.drawturnchip{font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted);}
.drawturnchip.current{background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); border-color:var(--accent);}
.drawturnchip.done{background:color-mix(in srgb, var(--safe) 20%, transparent); color:var(--safe); border-color:var(--safe);}
.guessinput{width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); font-family:inherit; margin:12px 0;}
.drawslot{display:inline-block; padding:1px 8px; margin:0 2px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); font-weight:800; min-width:1.6em;}
.drawslot.spin{animation:drawslotspin .09s linear infinite; filter:blur(.3px);}
.drawslot.landed{animation:drawslotland .32s cubic-bezier(.34,1.56,.64,1);}
@keyframes drawslotspin{0%{transform:translateY(0);}50%{transform:translateY(-3px);}100%{transform:translateY(0);}}
@keyframes drawslotland{0%{transform:scale(1.35); background:color-mix(in srgb, var(--accent) 30%, transparent);}100%{transform:scale(1);}}
.answeredrow{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:16px;}
.achip{font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted);}
.achip.done{background:color-mix(in srgb, var(--safe) 20%, transparent); color:var(--safe); border-color:var(--safe);}

.tallywrap{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
.tallyrow{border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--surface-2);}
.tallyrow.struck{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, var(--surface-2));}
.tallyhead{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:6px;}
.tallyhead .opt{font-weight:800;}
.tallyhead .cnt{font-family:"JetBrains Mono",monospace; color:var(--muted); font-weight:700;}
.tallynames{font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap;}
.tallynames b{color:var(--warn); font-weight:800;}
.noanswer{font-size:12.5px; color:var(--muted); margin-top:8px; text-align:center; opacity:0; animation:fadein .4s ease forwards;}

.flipcard{perspective:900px; margin-bottom:0;}
.flipcard-inner{position:relative; min-height:78px; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.32,.1,.2,1);}
.flipcard-inner.flipped{transform:rotateY(180deg);}
.flipface{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2); padding:10px 12px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center;}
.flipface.front{align-items:center; justify-content:center; font-family:"Orbitron",monospace; font-size:24px; font-weight:800; color:var(--muted);}
.flipface.back{transform:rotateY(180deg); justify-content:center;}
.flipface.back.struck{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, var(--surface-2));}
@keyframes struckBlink{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--warn) 55%, transparent);} 50%{box-shadow:0 0 0 7px color-mix(in srgb, var(--warn) 0%, transparent);}}
.flipface.back.struck-blink{animation:struckBlink .6s ease-in-out 3;}
.revealfade{opacity:0; animation:fadein .4s ease forwards;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.barchart{display:flex; flex-direction:column; gap:11px; margin-top:6px;}
.barrow{display:grid; grid-template-columns:104px 1fr 26px; align-items:center; gap:10px;}
.barlabel{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.barrow.me .barlabel{color:var(--accent);}
.bartrack{height:10px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden;}
.barfill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent), #c9ab98); transition:width .6s cubic-bezier(.2,.6,.3,1);}
.barfill.winner{background:linear-gradient(90deg, var(--warn), #f0c98a);}
.barvalue{font-family:"JetBrains Mono",monospace; font-weight:800; font-size:12.5px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums;}

.mlanswerkey{background:color-mix(in srgb, var(--accent) 12%, var(--surface-2)); border:1.5px solid var(--accent); border-radius:12px; padding:12px; margin-top:10px;}
.mlrankrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.mlrankchip{display:inline-flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:4px 9px; font-size:12px; font-weight:700; color:var(--muted);}
.mlrankchip.match{background:color-mix(in srgb, var(--safe) 22%, transparent); border-color:var(--safe); color:var(--safe);}
.mlcomparewrap{display:flex; flex-direction:column; gap:12px; margin-top:14px;}

// 用 usedIdx（這一局已經抽過的題目索引）排除重複，抽完整組才重新洗牌。

// 「接力畫猜」的題目：主體 + 地點 + 動作 隨機各抽一個組成一句情境描述，增加難度與變化。

// 「狼人殺」角色設定：狼人/村民一定存在，其他角色由房主開關決定要不要加進這一局。
const WEREWOLF_ROLE_TOGGLES = ["seer","witch","hunter","guard"];
const ROLE_LABEL = {
  wolf:"🐺 狼人", villager:"😇 村民", seer:"🔮 預言家", witch:"🧪 女巫", hunter:"🔫 獵人", guard:"🛡️ 醫生"
};
// 狼人人數不給房主調整，直接依人數自動算：5人以下1隻、9人以下2隻、其餘3隻。
function computeWolfCount(n){ return n<=5 ? 1 : (n<=9 ? 2 : 3); }
// 洗牌玩家順序後依序分配：狼人優先，接著依開關分配特殊角色，剩下的人都是村民。
function assignWerewolfRoles(players, rolesSettings){
  const shuffled = players.map(p=>p.id);
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const roles = {};
  const wolfCount = computeWolfCount(players.length);
  const pool = shuffled.slice();
  pool.splice(0, wolfCount).forEach(id=>{ roles[id] = "wolf"; });
  WEREWOLF_ROLE_TOGGLES.forEach(role=>{
    if(rolesSettings && rolesSettings[role] && pool.length){
      const id = pool.shift();
      roles[id] = role;
    }
  });
  pool.forEach(id=>{ roles[id] = "villager"; });
  return roles;
}
// 夜晚行動的固定順序：醫生 → 狼人 → 預言家 → 女巫。狼人一定會行動，其他角色要開關開著、且該角色還活著才會輪到。
// 找不到下一個該行動的角色就回傳 null，代表這一夜的行動都做完了，該進入結算。
const WEREWOLF_NIGHT_STEPS = ["guard","wolf","seer","witch"];
function nextNightStep(afterStep, rolesSettings, roles, players){
  const startIdx = afterStep ? WEREWOLF_NIGHT_STEPS.indexOf(afterStep)+1 : 0;
  for(let i=startIdx;i<WEREWOLF_NIGHT_STEPS.length;i++){
    const step = WEREWOLF_NIGHT_STEPS[i];
    if(step==="wolf"){
      const aliveWolves = players.filter(p=>p.alive!==false && roles[p.id]==="wolf");
      if(aliveWolves.length>0) return step;
      continue;
    }
    if(!rolesSettings || !rolesSettings[step]) continue;
    const holder = players.find(p=>p.alive!==false && roles[p.id]===step);
    if(holder) return step;
  }
  return null;
}

// 「阿瓦隆」：人數對應的好壞人數、每輪任務隊伍人數，以及角色分配等純邏輯。
const AVALON_TEAM_SIZES = {
  5:[2,3,2,3,3], 6:[2,3,4,3,4], 7:[2,3,3,4,4], 8:[3,4,4,5,5], 9:[3,4,4,5,5], 10:[3,4,4,5,5]
};
const AVALON_FACTION_COUNTS = {
  5:{good:3, evil:2}, 6:{good:4, evil:2}, 7:{good:4, evil:3}, 8:{good:5, evil:3}, 9:{good:6, evil:3}, 10:{good:6, evil:4}
};
const AVALON_ROLE_LABEL = {
  merlin:"🧙 梅林", percival:"🛡️ 派西維爾", loyal:"⚔️ 忠臣",
  assassin:"🗡️ 刺客", morgana:"🧛 莫甘娜", mordred:"👿 莫德雷德", minion:"😈 爪牙"
};
const AVALON_ROLE_DESC = {
  merlin:"你知道誰是壞人（莫德雷德除外）。任務成功三次後，要小心別被刺客認出來。",
  percival:"你看得到兩個人，其中一個是梅林、另一個可能是莫甘娜，請判斷誰才是真的梅林並保護他。",
  loyal:"你沒有任何情報，靠推理與觀察找出壞人，確保任務成功。",
  assassin:"你是壞人。如果好人完成三次任務，你有最後一次機會刺殺梅林翻盤。",
  morgana:"你是壞人，會被派西維爾誤認為梅林，盡量裝得像梅林。",
  mordred:"你是壞人，而且梅林看不到你，可以放心混進好人當中。",
  minion:"你是壞人，和夥伴一起暗中破壞任務。"
};
function isEvilRole(role){ return role==="assassin" || role==="morgana" || role==="mordred" || role==="minion"; }
function avalonClampN(n){ return Math.max(5, Math.min(10, n|0)); }
function avalonTeamSize(n, missionNo){
  const row = AVALON_TEAM_SIZES[avalonClampN(n)];
  return row[Math.max(0, Math.min(4, (missionNo|0)-1))];
}
// 第 4 輪任務在 7 人以上要 2 張失敗票才算失敗，其餘一律 1 張。
function avalonFailsNeeded(n, missionNo){ return (missionNo===4 && n>=7) ? 2 : 1; }
// 組隊投票：同意票嚴格多於反對票才通過，平票視為否決。
function avalonTally(teamVotes){
  let approve = 0, reject = 0;
  Object.keys(teamVotes||{}).forEach(id=>{
    if(teamVotes[id]==="approve") approve++;
    else if(teamVotes[id]==="reject") reject++;
  });
  return {approve, reject, approved: approve>reject};
}
// 隊長依加入順序輪流；找不到目前隊長（例如他離開了）就回到第一位。
function avalonNextLeader(orderedIds, currentId){
  if(!orderedIds.length) return null;
  const idx = orderedIds.indexOf(currentId);
  return orderedIds[(idx+1) % orderedIds.length];
}
// 洗牌後先抽壞人：刺客 → 莫甘娜 → 莫德雷德（依開關、名額還有才給），剩下是爪牙；
// 好人：梅林 → 派西維爾（依開關、名額還有才給），剩下是忠臣。
function assignAvalonRoles(players, rolesSettings){
  const shuffled = players.map(p=>p.id);
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const counts = AVALON_FACTION_COUNTS[avalonClampN(players.length)];
  const rs = rolesSettings || {};
  const roles = {};
  const evilIds = shuffled.slice(0, counts.evil);
  const goodIds = shuffled.slice(counts.evil, counts.evil + counts.good);
  const evilRoles = ["assassin"];
  if(rs.morgana) evilRoles.push("morgana");
  if(rs.mordred) evilRoles.push("mordred");
  evilIds.forEach((id,i)=>{ roles[id] = i<evilRoles.length ? evilRoles[i] : "minion"; });
  const goodRoles = ["merlin"];
  if(rs.percival) goodRoles.push("percival");
  goodIds.forEach((id,i)=>{ roles[id] = i<goodRoles.length ? goodRoles[i] : "loyal"; });
  return roles;
}
// 夜晚情報（純前端計算）：壞人互相認識；梅林看得到壞人（莫德雷德除外）；派西維爾看到梅林和莫甘娜但分不出誰是誰；忠臣什麼都看不到。
function avalonNightInfo(roles, myId, orderedIds){
  const my = roles[myId];
  const ids = orderedIds || Object.keys(roles);
  if(isEvilRole(my)) return {kind:"evil", ids: ids.filter(id=> id!==myId && roles[id] && isEvilRole(roles[id]))};
  if(my==="merlin") return {kind:"merlin", ids: ids.filter(id=> roles[id] && isEvilRole(roles[id]) && roles[id]!=="mordred")};
  if(my==="percival") return {kind:"percival", ids: ids.filter(id=> roles[id]==="merlin" || roles[id]==="morgana")};
  return {kind:"none", ids:[]};
}

// 每一題都會帶入「本輪主角」：PP 會被換成本輪輪到的玩家名字，全場一起猜這個人的答案。
// 主角是依加入順序（joinedAt）輪流分配，用回合數(round)決定輪到誰，不是隨機挑，確保每個人被當主角的次數公平。
function pickProtagonist(players, round){
  if(!players || !players.length) return null;
  const ordered = players.slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
  const idx = ((round||1)-1) % ordered.length;
  return ordered[idx];
}
function materializeQuestion(item, players, round){
  if(!players || !players.length) return {q:item.q, options:item.options};
  const p = pickProtagonist(players, round);
  const nm = p ? p.name : "某人";
  return {q:item.q.replace(/PP/g, nm), options:item.options};
}
// ---------- 音效 / 震動回饋 ----------
function setSoundEnabled(v){
  soundEnabled = v;
  try{ localStorage.setItem("telepathySound", v?"on":"off"); }catch(e){}
}
function beep(freq, durMs, type){
  if(!soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type||"sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durMs/1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durMs/1000);
  }catch(e){}
}
function vibrate(pattern){
  if(!soundEnabled) return;
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function playVoteSound(){ beep(520,70,"sine"); vibrate(15); }
function playResultSound(safe){
  if(safe){
    beep(660,90,"sine");
    setTimeout(()=>beep(880,120,"sine"), 90);
    vibrate(20);
  } else {
    beep(180,220,"sawtooth");
    vibrate([40,40,40]);
  }
}

// 房間資料一直沒動作就會永遠留在資料庫裡，這裡順手把整組房間（玩家/投票/鎖）都清掉。
async function deleteRoomBestEffort(ref){
  try{
    const pCol = ref.collection("players");
    const vCol = ref.collection("votes");
    const lCol = ref.collection("_locks");
    const [pSnap, vSnap, lSnap] = await Promise.all([
      pCol.get().catch(()=>({docs:[]})),
      vCol.get().catch(()=>({docs:[]})),
      lCol.get().catch(()=>({docs:[]})),
    ]);
    await Promise.all([
      ...pSnap.docs.map(dd=>pCol.doc(dd.id).delete().catch(()=>{})),
      ...vSnap.docs.map(dd=>vCol.doc(dd.id).delete().catch(()=>{})),
      ...lSnap.docs.map(dd=>lCol.doc(dd.id).delete().catch(()=>{})),
    ]);
    await ref.delete();
  }catch(e){}
}

}

// 用 usedKeys（這一局已經抽過的題目 id）排除掉抽過的題目，同一局不會再抽到同一題。
// 如果選的類型池子小、整組都抽完了，就重新洗牌繼續玩（resetUsed 會告訴呼叫端把已抽清單重新算）。
function pickQuestion(usedKeys, enabledCategories){
  const pool = getPool(enabledCategories);
  if(pool.length===0) return {idx:-1, pool, resetUsed:false};
  const usedSet = new Set(usedKeys||[]);
  let candidates = pool.map((item,i)=>i).filter(i=>!usedSet.has(pool[i].key));
  let resetUsed = false;
  if(candidates.length===0){
    candidates = pool.map((item,i)=>i);
    resetUsed = true;
  }
  const idx = candidates[Math.floor(Math.random()*candidates.length)];
  return {idx, pool, resetUsed};
}

function render(){
  if(mlDragging || drawingInProgress || drawPromptAnimating) return; // 拖曳排序中/畫畫中/抽題拉霸動畫中先不要整頁重畫，不然手指動作或動畫會被背景更新打斷、跳掉
  if(!identity){ renderHome(); return; }
  if(!roomData){ renderConnecting(); return; }
  if(!roomData.exists){ renderGone(); return; }
  if(roomData.lastActivityAt && (Date.now()-roomData.lastActivityAt > ROOM_EXPIRE_MS)){ renderExpired(); return; }
  const me = playersData.find(p=>p.id===identity.playerId);
  if(!me){ renderRejoining(); return; }
  const hostId = playersData.length ? playersData.slice().sort((a,b)=>a.joinedAt-b.joinedAt)[0].id : null;
  const isHost = hostId === identity.playerId;
  const phase = roomData.phase;
  const gameType = roomData.gameType || "telepathy";
  manageTicking(phase);
  manageVoteSub(phase);
  manageStrokeSub(phase);
  if(gameType==="mostlikely"){
    if(phase==="lobby") return renderLobby(isHost);
    if(phase==="question") return renderMLQuestion(me, isHost);
    if(phase==="reveal") return renderMLReveal(isHost);
    if(phase==="ended") return renderMLEnded(isHost);
    return renderConnecting();
  }
  if(gameType==="draw"){
    if(phase==="lobby") return renderLobby(isHost);
    if(phase==="drawing") return renderDrawTurn(me, isHost);
    if(phase==="guessing") return renderDrawGuessing(isHost);
    if(phase==="reveal") return renderDrawReveal(isHost);
    if(phase==="ended") return renderDrawEnded(isHost);
    return renderConnecting();
  }
  if(gameType==="werewolf"){
    if(phase==="lobby") return renderLobby(isHost);
    // 遊戲已經開始後才加入/重新整理進來的人，房間裡沒有幫他分配角色，這些畫面都預設看得到者已有角色，直接擋掉。
    if(!(roomData.roles && roomData.roles[identity.playerId])) return renderWerewolfNoRole();
    if(phase==="night") return renderWerewolfNight(me, isHost);
    if(phase==="hunter") return renderWerewolfHunterShoot(me, isHost);
    if(phase==="daydeaths") return renderWerewolfDayDeaths(isHost);
    if(phase==="discuss") return renderWerewolfDiscuss(isHost);
    if(phase==="vote") return renderWerewolfVote(me, isHost);
    if(phase==="voteresult") return renderWerewolfVoteResult(isHost);
    if(phase==="ended") return renderWerewolfEnded(isHost);
    return renderConnecting();
  }
  if(gameType==="avalon"){
    if(phase==="lobby") return renderLobby(isHost);
    // 遊戲已經開始後才加入/重新整理進來的人，房間裡沒有幫他分配角色，這些畫面都預設看得到者已有角色，直接擋掉。
    if(!(roomData.roles && roomData.roles[identity.playerId])) return renderAvalonNoRole();
    if(phase==="reveal") return renderAvalonReveal(me, isHost);
    if(phase==="team") return renderAvalonTeam(me, isHost);
    if(phase==="vote") return renderAvalonVote(me, isHost);
    if(phase==="voteresult") return renderAvalonVoteResult(isHost);
    if(phase==="mission") return renderAvalonMission(me, isHost);
    if(phase==="missionresult") return renderAvalonMissionResult(isHost);
    if(phase==="assassin") return renderAvalonAssassin(me, isHost);
    if(phase==="ended") return renderAvalonEnded(isHost);
    return renderConnecting();
  }
  if(phase==="lobby") return renderLobby(isHost);
  if(phase==="question") return renderQuestion(me, isHost);
  if(phase==="reveal") return renderReveal(isHost);
  if(phase==="ended") return renderEnded(isHost);
  renderConnecting();
}

  document.getElementById("durPlus").onclick = ()=> updateSettings({duration: Math.min(30, settings.duration+5)});
  document.getElementById("tgtMinus").onclick = ()=> updateSettings({targetStrikes: Math.max(2, settings.targetStrikes-1)});
  document.getElementById("tgtPlus").onclick = ()=> updateSettings({targetStrikes: Math.min(10, settings.targetStrikes+1)});
  document.querySelectorAll("[data-mode]").forEach(b=> b.onclick = ()=> updateSettings({mode: b.dataset.mode}));
  document.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.cat;
      const current = new Set(settings.enabledCategories && settings.enabledCategories.length ? settings.enabledCategories : ALL_CATEGORY_IDS);
      if(current.has(id)){
        if(current.size>1) current.delete(id); // keep at least one category enabled
      } else {
        current.add(id);
      }
      updateSettings({enabledCategories: ALL_CATEGORY_IDS.filter(c=>current.has(c))});
    };
  });
}

async function doSaveCustomQuestion(){
  const q = bankDraft.q.trim();
  const opts = bankDraft.opts.map(o=>o.trim());
  if(!q || opts.some(o=>!o)){ bankError = "題目跟四個選項都要填喔"; render(); return; }
  if(!q.includes("PP")){ bankError = "題目裡要包含 PP，出題時才會換成本輪主角的名字"; render(); return; }
  const d = await ensureDb();
  if(!d){ bankError = "目前無法連線儲存"; render(); return; }
  try{
    if(bankEditingId){
      await customQuestionsCol.doc(bankEditingId).update({q, options:opts, category: bankDraft.cat||"life", targeted:true});
    } else {
      await customQuestionsCol.add({q, options:opts, category: bankDraft.cat||"life", targeted:true, createdAt: Date.now()});
    }
    bankFormOpen = false; bankEditingId = null; bankDraft = {q:"", opts:["","","",""], cat:"life"}; bankError = "";
    render();

let revealAnimRound = null;
let revealStage = 0;
let revealTimers = [];
function clearRevealTimers(){ revealTimers.forEach(t=>clearTimeout(t)); revealTimers=[]; }
function startRevealAnim(round){
  clearRevealTimers();
  revealAnimRound = round;
  revealStage = 0;
  // 翻牌的 CSS 動畫要 0.55 秒才轉完，原本每 420ms 就翻下一張，
  // 會在前一張還沒轉完時就疊上新的翻轉，看起來像在「搶拍」、一閃而過。
  // 這裡把起始停頓跟每張間隔都拉長到比動畫時間長一點，讓每張牌都轉完才翻下一張，
  // 同時也讓答題畫面切過來後有個喘息的瞬間，不會覺得畫面在硬切。
  const startDelay = 700;
  const stepDelay = 650;
  LETTERS.forEach((_,i)=>{
    revealTimers.push(setTimeout(()=>{ revealStage = i+1; render(); }, startDelay + stepDelay*i));
  });
}

          return `<div class="barrow ${p.id===identity.playerId?'me':''}">
            <div class="barlabel">${avatarOf(p)} ${esc(p.name)}</div>
            <div class="bartrack"><div class="barfill" style="width:${pct}%"></div></div>

// 用手指/滑鼠拖曳排序：拖曳過程中不整頁重畫（只移動被拖的那一列＋讓其他列讓位），
// 放開時才把新順序寫回 mlRankOrder 並重新整頁畫面。
function wireMLDrag(){
  const list = document.querySelector(".mlranklist");
  if(!list) return;
  list.querySelectorAll("[data-handle]").forEach(handle=>{
    handle.addEventListener("pointerdown", (e)=> startMLDrag(e, handle.closest(".mlrankitem"), list));
  });
}

function startMLDrag(e, item, list){
  if(!item || !list) return;
  e.preventDefault();
  const id = item.dataset.id;
  const baseOrder = mlRankOrder.slice();
  const fromIndex = baseOrder.indexOf(id);
  if(fromIndex<0) return;
  mlDragging = true;
  const rows = Array.from(list.children);
  const gap = 8; // 對應 .mlranklist 的 gap
  const rowHeight = item.getBoundingClientRect().height + gap;
  const startY = e.clientY;
  let lastToIndex = fromIndex;
  try{ item.setPointerCapture(e.pointerId); }catch(err){}
  item.classList.add("dragging");

  function applyOffsets(toIndex){
    rows.forEach((row,i)=>{
      if(row===item) return;
      let shift = 0;
      if(fromIndex < toIndex && i > fromIndex && i <= toIndex) shift = -rowHeight;
      else if(fromIndex > toIndex && i >= toIndex && i < fromIndex) shift = rowHeight;
      row.style.transform = shift ? `translateY(${shift}px)` : "";
    });
  }
  function onMove(ev){
    const dy = ev.clientY - startY;
    item.style.transform = `translateY(${dy}px)`;
    let toIndex = fromIndex + Math.round(dy / rowHeight);
    toIndex = Math.max(0, Math.min(rows.length-1, toIndex));
    if(toIndex !== lastToIndex){ lastToIndex = toIndex; applyOffsets(toIndex); }
  }
  function onUp(){
    item.removeEventListener("pointermove", onMove);
    item.removeEventListener("pointerup", onUp);
    item.removeEventListener("pointercancel", onUp);
    item.classList.remove("dragging");
    rows.forEach(row=>{ row.style.transform = ""; });
    if(lastToIndex !== fromIndex){
      const next = baseOrder.slice();
      next.splice(fromIndex,1);
      next.splice(lastToIndex,0,id);
      mlRankOrder = next;
    }
    mlDragging = false;
    render();
  }
  item.addEventListener("pointermove", onMove);
  item.addEventListener("pointerup", onUp);
  item.addEventListener("pointercancel", onUp);
}

  revealTimers.push(setTimeout(()=>{ mlRevealReady = true; render(); }, 700));

// 畫布固定內部解析度，用 CSS 縮放成響應式大小；座標一律換算成 0~1 的相對位置存進資料庫，
// 這樣不同螢幕大小/裝置的人看到的畫都會對齊，不會因為畫布尺寸不同而變形錯位。
function replayStrokesOnCanvas(canvas, strokes){
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = "#2b2b2b";
  ctx.lineWidth = 5;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  (strokes||[]).forEach(s=>{
    const path = s.path||[];
    if(path.length<1) return;
    ctx.beginPath();
    path.forEach((pt,i)=>{
      const x = pt[0]*canvas.width, y = pt[1]*canvas.height;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
}

function setupDrawCanvas(canvasId, enabled){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  canvas.width = 600; canvas.height = 450;
  replayStrokesOnCanvas(canvas, strokesData);
  if(!enabled) return;
  let currentPath = null;
  function posFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    return [Math.max(0,Math.min(1,x)), Math.max(0,Math.min(1,y))];
  }
  function onDown(e){
    e.preventDefault();
    drawingInProgress = true; // 畫的當下暫停整頁重畫，不然畫布會被背景更新換掉、畫一半跳掉
    currentPath = [posFromEvent(e)];
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
  }
  function onMove(e){
    if(!currentPath) return;
    currentPath.push(posFromEvent(e));
    const ctx = canvas.getContext("2d");
    ctx.strokeStyle = "#2b2b2b"; ctx.lineWidth = 5; ctx.lineJoin = "round"; ctx.lineCap = "round";
    const n = currentPath.length;
    if(n>=2){
      const [x1,y1] = currentPath[n-2], [x2,y2] = currentPath[n-1];
      ctx.beginPath();
      ctx.moveTo(x1*canvas.width, y1*canvas.height);
      ctx.lineTo(x2*canvas.width, y2*canvas.height);
      ctx.stroke();
    }
  }
  function onUp(){
    canvas.removeEventListener("pointermove", onMove);
    canvas.removeEventListener("pointerup", onUp);
    canvas.removeEventListener("pointercancel", onUp);
    const path = currentPath;
    currentPath = null;
    drawingInProgress = false;
    if(path && path.length>1) commitStroke(path);
    else render();
  }
  canvas.addEventListener("pointerdown", onDown);
}

async function commitStroke(path){
  const stroke = {round: roomData.round, playerId: identity.playerId, path, ts: Date.now()};
  // 先樂觀地把這一筆加進本地資料重畫一次，免得放開手指那瞬間、資料庫還沒回傳前畫面閃一下不見；
  // 等 onSnapshot 真的收到這筆資料時，strokesData 會整包被換成資料庫的版本，這筆本地暫存會自然被取代掉。
  strokesData = strokesData.concat([{...stroke, id:`local_${Date.now()}_${Math.random().toString(36).slice(2,7)}`}]);
  render();
  try{
    await strokesCol.doc().set(stroke);
    touchActivity();
  }catch(e){}
}

// 拉霸式抽題動畫：三個字詞欄位各自快速跑動後依序停下，最後停在真正抽到的題目。
// 期間把 drawPromptAnimating 設為 true，讓 render() 暫停整頁重畫，避免動畫被打斷。
function playDrawSlotAnim(subject, place, action){
  const elS = document.getElementById("slotSubject");
  const elP = document.getElementById("slotPlace");
  const elA = document.getElementById("slotAction");
  if(!elS || !elP || !elA){ drawPromptAnimating = false; return; }
  drawPromptAnimating = true;
  const reels = [
    {el: elS, pool: DRAW_SUBJECTS, final: subject, stopAt: 650},
    {el: elP, pool: DRAW_PLACES, final: place, stopAt: 950},
    {el: elA, pool: DRAW_ACTIONS, final: action, stopAt: 1300}
  ];
  const start = Date.now();
  reels.forEach((r, i)=>{
    r.el.classList.add("spin");
    const tick = ()=>{
      const elapsed = Date.now() - start;
      if(elapsed >= r.stopAt){
        r.el.textContent = r.final;
        r.el.classList.remove("spin");
        r.el.classList.add("landed");
        beep(520 + i*160, 70, "square");
        vibrate(12);
        return;
      }
      r.el.textContent = r.pool[Math.floor(Math.random()*r.pool.length)];
      const delay = (r.stopAt - elapsed) < 220 ? 110 : 55;
      setTimeout(tick, delay);
    };
    tick();
  });
  setTimeout(()=>{ drawPromptAnimating = false; render(); }, 1300 + 120);
}

// 5 個任務圓圈（成功/失敗/目前這輪/尚未進行的隊伍人數）+ 連續否決計數。
function renderAvalonTracker(){
  const n = avalonN();
  const results = roomData.missionResults || [];
  const missionNo = roomData.missionNo || 1;
  const rc = Math.max(0, Math.min(5, roomData.rejectCount || 0));
  const dots = [1,2,3,4,5].map(i=>{
    const r = results[i-1];
    if(r) return `<div class="avdot ${r.ok?'ok':'bad'}">${r.ok?'✓':'✗'}</div>`;
    const size = avalonTeamSize(n, i) + (avalonFailsNeeded(n, i)===2 ? '*' : '');
    return `<div class="avdot ${(i===missionNo && roomData.phase!=='ended')?'cur':''}">${size}</div>`;
  }).join("");
  return `
    <div class="avtracker">
      <div class="avdots">${dots}</div>
      <div class="avreject">否決 ${"●".repeat(rc)}${"○".repeat(5-rc)}</div>
    </div>
  `;
}

async function ensureDb(){
  if(db) return db;
  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; }
  return db;
}

// Firestore 沒有內建的 acquire() 租約機制，這裡用一個 transaction 模擬「同一時間只有一個人能執行」的效果。
async function acquireLock(ref, holder, ttlMs){
  try{
    let acquired = false;
    const lockRef = ref.collection("_locks").doc("resolve");
    await db.runTransaction(async tx=>{
      const snap = await tx.get(lockRef);
      const now = Date.now();
      const data = snap.exists ? snap.data() : null;
      if(data && data.expiresAt > now){ acquired = false; return; }
      tx.set(lockRef, {holder, expiresAt: now + (ttlMs||4000)});
      acquired = true;
    });
    return {acquired};
  }catch(e){ return {acquired:false}; }
}

// 資料內容沒變就不要重新 render()：避免彈跳視窗（設定/玩法說明）在開著的時候，
// 因為背景輪詢或監聽觸發整個畫面重繪、視窗看起來一直閃一下（重新播放滑入動畫）。
function sameData(a,b){
  try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; }
}

function connectRoom(){
  const d = db;
  roomRef = d.doc(`telepathyrooms/${identity.code}`);
  playersCol = roomRef.collection("players");
  roomData = null; playersData = [];
  expireCleanupDone = false;
  soundedRound = null;
  mlRevealAnimRound = null; mlRevealReady = false; mlSoundedRound = null; mlRankOrder = null; mlRankOrderRound = null;
  drawingInProgress = false; drawGuessInput = ""; strokesData = []; drawPromptAnimRound = null; drawPromptAnimating = false;
  witchPoisonPickOpen = false;
  if(unsubRoom) unsubRoom();
  if(unsubPlayers) unsubPlayers();
  unsubRoom = roomRef.onSnapshot(snap=>{
    const next = {exists: snap.exists, ...(snap.data()||{})};
    if(sameData(next, roomData)) return;
    roomData = next;
    render();
  }, ()=>{ roomData = {exists:false}; render(); });
  unsubPlayers = playersCol.onSnapshot(qsnap=>{
    const next = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    if(sameData(next, playersData)) return;
    playersData = next;
    render();
  }, ()=>{});
  render();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollRoomOnce, 2000);
}

// 保底機制：即時監聽偶爾會漏更新（尤其手機網路不穩時），
// 每幾秒主動抓一次最新房間狀態，避免有人卡在舊畫面看不到別人已經開始遊戲。
// 資料跟目前畫面一樣的話就不 render()，不然設定/玩法說明視窗開著的時候會一直被重畫、看起來像自動刷新。
async function pollRoomOnce(){
  if(!roomRef) return;
  try{
    const snap = await roomRef.get();
    const next = {exists: snap.exists, ...(snap.data()||{})};
    if(!sameData(next, roomData)){ roomData = next; render(); }
  }catch(e){}
  if(!playersCol) return;
  try{
    const qsnap = await playersCol.get();
    const next = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    if(!sameData(next, playersData)){ playersData = next; render(); }
  }catch(e){}
}

function manageVoteSub(phase){
  const wantVotes = phase === "question";
  if(wantVotes && !unsubVotes){
    votesCol = roomRef.collection("votes");
    unsubVotes = votesCol.where("round","==",roomData.round).onSnapshot(qsnap=>{
      votesData = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
      render();
      if(votesData.length >= playersData.length && playersData.length>0){
        if(roomData && roomData.gameType==="mostlikely") tryResolveML(); else tryResolve();
      }
    }, ()=>{});
  } else if(!wantVotes && unsubVotes){
    unsubVotes(); unsubVotes = null; votesData = [];
  }
}

function manageTicking(phase){
  const should = phase === "question" || phase === "drawing";
  if(should && !tickTimer){
    tickTimer = setInterval(()=>{
      if(drawingInProgress || drawPromptAnimating) return; // 正在畫的時候/拉霸動畫播放中先不要因為倒數計時重畫打斷
      render();
      if(remainingSeconds()<=0){
        if(roomData && roomData.gameType==="mostlikely") tryResolveML();
        else if(roomData && roomData.gameType==="draw") tryAdvanceDraw();
        else tryResolve();
      }
    }, 250);
  } else if(!should && tickTimer){
    clearInterval(tickTimer); tickTimer = null;
  }
}

// 「接力畫猜」的筆畫：跟 votes 一樣，依目前這一輪 round 訂閱，畫畫/猜謎/公布答案時都要看得到已經畫的東西。
function manageStrokeSub(phase){
  const wantStrokes = roomData && roomData.gameType==="draw" && (phase==="drawing" || phase==="guessing" || phase==="reveal");
  if(wantStrokes && !unsubStrokes){
    strokesCol = roomRef.collection("strokes");
    unsubStrokes = strokesCol.where("round","==",roomData.round).onSnapshot(qsnap=>{
      strokesData = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
      if(!drawingInProgress) render();
    }, ()=>{});
  } else if(!wantStrokes && unsubStrokes){
    unsubStrokes(); unsubStrokes = null; strokesData = [];
  }
}

function leaveToHome(){

async function tryResolve(){
  if(resolveBusy) return;
  if(!roomData || roomData.phase!=="question") return;
  resolveBusy = true;
  try{
    const lease = await acquireLock(roomRef, identity.playerId, 4000).catch(()=>({acquired:false}));
    if(!lease.acquired){ resolveBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="question"){ resolveBusy=false; return; }
    const fd = fresh.data();
    // 用 Firestore 現場抓一次玩家名單，不要用本地快取的 playersData——
    // 這裡會有 await，快取可能在等待期間被 onSnapshot 換成「已經扣過分」的新資料，
    // 如果還拿快取來算「扣分後是不是達標」會整組多算一次分（導致明明還沒到目標分數就結束遊戲）。
    const freshPlayersSnap = await playersCol.get().catch(()=>({docs:[]}));
    const freshPlayers = freshPlayersSnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    const allVotedSnap = await votesCol.where("round","==",fd.round).get().catch(()=>({docs:[]}));
    const roundVotes = allVotedSnap.docs.map(dd=>dd.data());
    const timeUp = Date.now() >= (fd.roundEndAt||0);
    const allVoted = roundVotes.length >= freshPlayers.length;
    if(!timeUp && !allVoted){ resolveBusy=false; return; }

    const byOption = {A:[],B:[],C:[],D:[]};
    const votedIds = new Set();
    roundVotes.forEach(v=>{ if(byOption[v.choice]){ byOption[v.choice].push(v.playerId); votedIds.add(v.playerId); } });
    const mode = (fd.settings && fd.settings.mode) || "normal";
    const struckIds = [];
    if(mode==="majority"){
      const counts = LETTERS.map(L=>byOption[L].length).filter(c=>c>0);
      const maxCount = counts.length ? Math.max(...counts) : 0;
      const leading = new Set(LETTERS.filter(L=>byOption[L].length===maxCount && maxCount>0));
      LETTERS.forEach(L=>{ if(byOption[L].length>0 && !leading.has(L)) struckIds.push(...byOption[L]); });
    } else {
      LETTERS.forEach(L=>{ if(byOption[L].length===1) struckIds.push(byOption[L][0]); });
    }
    const noAnswerIds = freshPlayers.map(p=>p.id).filter(id=>!votedIds.has(id));
    const allStruck = new Set([...struckIds, ...noAnswerIds]);

    const newStrikesById = new Map();
    await Promise.all(freshPlayers.map(p=>{
      if(allStruck.has(p.id)){
        const ns = (p.strikes||0)+1;
        newStrikesById.set(p.id, ns);
        return playersCol.doc(p.id).update({strikes:ns});
      }
      return Promise.resolve();
    }));

    const target = (fd.settings && fd.settings.targetStrikes) || 3;
    const losers = freshPlayers.filter(p=> newStrikesById.has(p.id) && newStrikesById.get(p.id) >= target).map(p=>({id:p.id, name:p.name}));

    const log = (fd.revealLog||[]).slice();
    log.push({round: fd.round, q: fd.currentQuestion.q, options: fd.currentQuestion.options, byOption, struckIds, noAnswerIds});

    if(losers.length>0){
      await roomRef.update({phase:"ended", losers, revealLog: log, lastActivityAt: Date.now()});
    } else {
      await roomRef.update({phase:"reveal", revealLog: log, lastActivityAt: Date.now()});
    }
  }catch(e){}
  resolveBusy = false;
}

async function doNextQuestion(){
  const settings = roomData.settings || {duration:15, targetStrikes:3, enabledCategories:ALL_CATEGORY_IDS};
  const {idx, pool, resetUsed} = pickQuestion(roomData.usedQKeys, settings.enabledCategories);
  if(idx<0) return;
  const nextRound = (roomData.round||1)+1;
  const {q, options} = materializeQuestion(pool[idx], playersData, nextRound);
  const usedQKeys = resetUsed ? [pool[idx].key] : [...(roomData.usedQKeys||[]), pool[idx].key];
  try{
    await roomRef.update({
      phase:"question", round:nextRound, currentQuestion:{q, options},
      roundEndAt: Date.now() + settings.duration*1000, usedQKeys, lastActivityAt: Date.now()
    });

async function tryResolveML(){
  if(resolveBusy) return;
  if(!roomData || roomData.phase!=="question") return;
  resolveBusy = true;
  try{
    const lease = await acquireLock(roomRef, identity.playerId, 4000).catch(()=>({acquired:false}));
    if(!lease.acquired){ resolveBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="question"){ resolveBusy=false; return; }
    const fd = fresh.data();
    const freshPlayersSnap = await playersCol.get().catch(()=>({docs:[]}));
    const freshPlayers = freshPlayersSnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    const allVotedSnap = await votesCol.where("round","==",fd.round).get().catch(()=>({docs:[]}));
    const roundVotes = allVotedSnap.docs.map(dd=>dd.data());
    const timeUp = Date.now() >= (fd.roundEndAt||0);
    const allVoted = roundVotes.length >= freshPlayers.length;
    if(!timeUp && !allVoted){ resolveBusy=false; return; }

    // 用基準者自己送出的排序當這一題的標準答案；基準者沒送出就整題不計分。
    const baseVote = roundVotes.find(v=>v.playerId===fd.currentBaseId);
    const baseRanking = baseVote ? baseVote.ranking : null;
    const gainedById = {};
    freshPlayers.forEach(p=>{ gainedById[p.id]=0; });
    if(baseRanking){
      roundVotes.forEach(v=>{
        if(v.playerId===fd.currentBaseId) return; // 基準者這輪不跟自己比對、不計分
        let matches = 0;
        (v.ranking||[]).forEach((id,i)=>{ if(baseRanking[i]===id) matches++; });
        gainedById[v.playerId] = matches;
      });
      await Promise.all(freshPlayers.map(p=>{
        const gained = gainedById[p.id]||0;
        if(gained>0) return playersCol.doc(p.id).update({mlScore:(p.mlScore||0)+gained});
        return Promise.resolve();
      }));
    }

    const log = (fd.revealLog||[]).slice();
    log.push({
      round: fd.round, prompt: fd.currentPrompt, baseId: fd.currentBaseId, baseRanking,
      votes: roundVotes.map(v=>({playerId:v.playerId, ranking:v.ranking})), gainedById
    });

    // 一律先進 reveal 讓大家看這輪結果；是不是最後一題、要不要看總結，交給房主在 reveal 畫面按按鈕決定。
    await roomRef.update({phase:"reveal", revealLog: log, lastActivityAt: Date.now()});
  }catch(e){}
  resolveBusy = false;
}

// 狼人投票是鎖保護的合併寫入：每隻狼投完都會檢查「活著的狼是不是都投了」，
// 投完才計算最多票的目標（平票時採用「在 playersData 裡加入順序最早的那隻狼投的目標」當決勝）。
async function doWolfVote(targetId){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const lease = await acquireLock(roomRef, identity.playerId, 4000).catch(()=>({acquired:false}));
    if(!lease.acquired){ voteBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="night" || fresh.data().nightStep!=="wolf"){ voteBusy=false; return; }
    const fd = fresh.data();
    const wolfVotes = Object.assign({}, fd.wolfVotes||{}, {[identity.playerId]: targetId});
    const freshPlayersSnap = await playersCol.get().catch(()=>({docs:[]}));
    const freshPlayers = freshPlayersSnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    const roles = fd.roles || {};
    const aliveWolves = freshPlayers.filter(p=>p.alive!==false && roles[p.id]==="wolf");
    const allVoted = aliveWolves.every(w=> wolfVotes[w.id]!=null);
    if(!allVoted){
      await roomRef.update({wolfVotes, lastActivityAt: Date.now()});
      voteBusy = false;
      return;
    }
    const orderedWolves = aliveWolves.slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
    const counts = {};
    orderedWolves.forEach(w=>{ const t = wolfVotes[w.id]; counts[t] = (counts[t]||0)+1; });
    let bestTarget = null, bestCount = -1;
    orderedWolves.forEach(w=>{
      const t = wolfVotes[w.id];
      if(counts[t] > bestCount){ bestCount = counts[t]; bestTarget = t; }
    });
    const settings = fd.settings || {};
    const nStep = nextNightStep("wolf", settings.roles, roles, freshPlayers);
    const patch = {wolfVotes, wolfTarget: bestTarget, lastActivityAt: Date.now()};
    if(nStep){
      patch.nightStep = nStep;
      await roomRef.update(patch);
    } else {
      await roomRef.update(patch);
      await resolveNightDeaths();
    }
  }catch(e){}
  voteBusy = false;
}

// 夜晚行動全部做完後結算死亡名單：醫生守到的人不會死、女巫救的人不會死，剩下才是真的死掉的人。
async function resolveNightDeaths(){
  if(resolveBusy) return;
  resolveBusy = true;
  try{
    const lease = await acquireLock(roomRef, identity.playerId, 4000).catch(()=>({acquired:false}));
    if(!lease.acquired){ resolveBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="night"){ resolveBusy=false; return; }
    const fd = fresh.data();
    const guardTarget = fd.guardTarget, wolfTarget = fd.wolfTarget;
    const survivedByGuard = guardTarget!=null && guardTarget===wolfTarget;
    const survivedByWitch = fd.witchAction==="save";
    const wolfKilled = (wolfTarget && !survivedByGuard && !survivedByWitch) ? wolfTarget : null;
    const poisonKilled = fd.witchAction==="poison" ? fd.witchPoisonTarget : null;
    const deathsSet = new Set();
    if(wolfKilled) deathsSet.add(wolfKilled);
    if(poisonKilled) deathsSet.add(poisonKilled);
    const nightDeaths = Array.from(deathsSet);
    await Promise.all(nightDeaths.map(id=> playersCol.doc(id).update({alive:false})));
    await finalizeDeaths(nightDeaths, "daydeaths");
  }catch(e){}
  resolveBusy = false;
}

// 淘汰名單裡如果有還沒開過槍的獵人，先讓獵人補一槍再繼續；沒有獵人就直接檢查有沒有人獲勝。
async function finalizeDeaths(newDeathIds, nextPhaseIfNoWinner){
  try{
    const fresh = await roomRef.get().catch(()=>null);
    const fd = fresh && fresh.exists ? fresh.data() : {};
    const roles = fd.roles || {};
    const hunterQueue = newDeathIds.filter(id=> roles[id]==="hunter");
    if(hunterQueue.length>0){
      await roomRef.update({
        nightDeaths: [...(fd.nightDeaths||[]), ...newDeathIds],
        hunterQueue, hunterNextPhase: nextPhaseIfNoWinner, phase:"hunter", lastActivityAt: Date.now()
      });
    } else {
      await checkWinAndAdvance(nextPhaseIfNoWinner, newDeathIds);
    }
  }catch(e){}
}

// 每次死人之後都重新用資料庫現場的玩家名單算一次雙方存活人數，判斷有沒有人贏了；
// 沒人贏就照原本排定的下一個 phase 繼續。
async function checkWinAndAdvance(nextPhase, newDeathIdsToAppend){
  try{
    const fresh = await roomRef.get().catch(()=>null);
    const fd = fresh && fresh.exists ? fresh.data() : {};
    const roles = fd.roles || {};
    const freshPlayersSnap = await playersCol.get().catch(()=>({docs:[]}));
    const freshPlayers = freshPlayersSnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    const aliveWolves = freshPlayers.filter(p=>p.alive!==false && roles[p.id]==="wolf");
    const aliveGood = freshPlayers.filter(p=>p.alive!==false && roles[p.id]!=="wolf");
    const patch = {lastActivityAt: Date.now()};
    if(newDeathIdsToAppend && newDeathIdsToAppend.length){
      patch.nightDeaths = [...(fd.nightDeaths||[]), ...newDeathIdsToAppend];
    }
    if(aliveWolves.length===0){
      patch.winner = "villager"; patch.phase = "ended";
    } else if(aliveWolves.length >= aliveGood.length){
      patch.winner = "wolf"; patch.phase = "ended";
    } else {
      patch.phase = nextPhase;
    }
    await roomRef.update(patch);
  }catch(e){}
}

// 統計非棄票的票數，票數最高且唯一的目標才會被淘汰；平票（或大家都棄票）就沒有人被淘汰。
async function resolveVoteWith(voteTally, alivePlayers){
  const counts = {};
  alivePlayers.forEach(p=>{
    const t = voteTally[p.id];
    if(t && t!=="abstain") counts[t] = (counts[t]||0)+1;
  });
  let maxCount = 0;
  Object.keys(counts).forEach(id=>{ if(counts[id]>maxCount) maxCount = counts[id]; });
  const topTargets = Object.keys(counts).filter(id=>counts[id]===maxCount);
  const eliminatedId = (maxCount>0 && topTargets.length===1) ? topTargets[0] : null;
  await roomRef.update({voteTally, voteResult: {eliminatedId, tally: counts}, phase:"voteresult", lastActivityAt: Date.now()});
  let deaths = [];
  if(eliminatedId){
    await playersCol.doc(eliminatedId).update({alive:false});
    deaths = [eliminatedId];
  }
  await finalizeDeaths(deaths, "voteresult");
}

async function doVoteCast(targetIdOrNull){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const lease = await acquireLock(roomRef, identity.playerId, 4000).catch(()=>({acquired:false}));
    if(!lease.acquired){ voteBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="vote"){ voteBusy=false; return; }
    const fd = fresh.data();
    const voteTally = Object.assign({}, fd.voteTally||{}, {[identity.playerId]: targetIdOrNull==null ? "abstain" : targetIdOrNull});
    const freshPlayersSnap = await playersCol.get().catch(()=>({docs:[]}));
    const freshPlayers = freshPlayersSnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    const alive = freshPlayers.filter(p=>p.alive!==false);
    const allVoted = alive.every(p=> voteTally[p.id]!=null);
    if(!allVoted){
      await roomRef.update({voteTally, lastActivityAt: Date.now()});
      voteBusy = false;
      return;
    }
    await resolveVoteWith(voteTally, alive);

}

// 房主的「強制結束投票」：沒投的人當棄票處理，直接進結算，不用等所有人都投完。
async function doForceEndVote(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const lease = await acquireLock(roomRef, identity.playerId, 4000).catch(()=>({acquired:false}));
    if(!lease.acquired){ voteBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="vote"){ voteBusy=false; return; }
    const fd = fresh.data();
    const freshPlayersSnap = await playersCol.get().catch(()=>({docs:[]}));
    const freshPlayers = freshPlayersSnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
    const alive = freshPlayers.filter(p=>p.alive!==false);
    const voteTally = Object.assign({}, fd.voteTally||{});
    alive.forEach(p=>{ if(voteTally[p.id]==null) voteTally[p.id] = "abstain"; });
    await resolveVoteWith(voteTally, alive);
  }catch(e){}
  voteBusy = false;
}

// ---------- 阿瓦隆：資料 / 動作 ----------

// 租約沒搶到就稍等再試幾次（租約有效 4 秒、不會主動釋放），多人同時按下時比較不會有人的選擇被吃掉。
async function avalonLease(){
  for(let i=0;i<5;i++){
    const lease = await acquireLock(roomRef, identity.playerId, 4000).catch(()=>({acquired:false}));
    if(lease && lease.acquired) return {acquired:true};
    await new Promise(r=>setTimeout(r, 1000));
  }
  return {acquired:false};
}
// 只算這局有被分配角色的玩家（遊戲開始後才加入的人不算，不然會卡住等他投票）。
async function avalonFreshPlayers(roles){
  const snap = await playersCol.get().catch(()=>({docs:[]}));
  return snap.docs.map(dd=>({id:dd.id, ...dd.data()})).filter(p=>!roles || roles[p.id]).sort((a,b)=>a.joinedAt-b.joinedAt);
}

async function doStartAvalon(){
  const players = playersData;
  if(players.length<5){ startError = "至少需要 5 位玩家才能開始阿瓦隆"; render(); return; }
  if(players.length>10){ startError = "阿瓦隆最多 10 位玩家"; render(); return; }
  if(!players.every(p=>p.ready)){ startError = "還有人沒按「我準備好了」，等他們準備好才能開始"; render(); return; }
  const settings = roomData.settings || {roles:{percival:true, morgana:true, mordred:false}};
  const roles = assignAvalonRoles(players, settings.roles);
  const leaderId = players[Math.floor(Math.random()*players.length)].id;
  startError = "";
  avalonPickDraft = []; avalonPickKey = ""; avalonPeek = false;
  try{
    await roomRef.update({
      phase:"reveal", round:1, roles, acks:{}, leaderId, missionNo:1, missionResults:[], rejectCount:0,
      teamSelection:[], teamVotes:{}, missionVotes:{}, lastMissionFails:0, assassinTarget:null,
      winner:null, winReason:null, lastActivityAt: Date.now()
    });
  }catch(e){}
}

// 隊長離開後沒人能組隊，房主可以把隊長換給下一位。
async function doAvalonSkipLeader(){
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="team") return;
    const players = await avalonFreshPlayers(fresh.data().roles||{});
    const ids = players.map(p=>p.id);
    const cur = fresh.data().leaderId;
    if(ids.includes(cur)) return;
    await roomRef.update({leaderId: avalonNextLeader(ids, cur), lastActivityAt: Date.now()});
  }catch(e){}

async function doProposeTeam(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="team"){ voteBusy=false; return; }
    const fd = fresh.data();
    if(fd.leaderId !== identity.playerId){ voteBusy=false; return; }
    const n = avalonClampN(Object.keys(fd.roles||{}).length);
    const size = avalonTeamSize(n, fd.missionNo||1);
    const sel = Array.from(new Set(avalonPickDraft));
    const players = await avalonFreshPlayers(fd.roles||{});
    if(sel.length!==size || !sel.every(id=>players.some(p=>p.id===id))){ voteBusy=false; return; }
    await roomRef.update({phase:"vote", teamSelection: sel, teamVotes:{}, missionVotes:{}, lastActivityAt: Date.now()});
    avalonPickDraft = []; avalonPickKey = "";
  }catch(e){}
  voteBusy = false;
}

async function doTeamVote(choice){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const lease = await avalonLease();
    if(!lease.acquired){ voteBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="vote"){ voteBusy=false; return; }
    const fd = fresh.data();
    if((fd.teamVotes||{})[identity.playerId]!=null){ voteBusy=false; return; }
    const teamVotes = Object.assign({}, fd.teamVotes||{}, {[identity.playerId]: choice==="approve" ? "approve" : "reject"});
    const players = await avalonFreshPlayers(fd.roles||{});
    const allVoted = players.every(p=> teamVotes[p.id]!=null);
    await roomRef.update({teamVotes, lastActivityAt: Date.now()});
    if(allVoted) await resolveTeamVote();
  }catch(e){}
  voteBusy = false;
}

// 全員投完後結算：同意票嚴格多於反對票才通過（平票否決）。被否決時連續否決數 +1，真正的下一步等房主按「繼續」。
async function resolveTeamVote(){
  if(resolveBusy) return;
  resolveBusy = true;
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="vote"){ resolveBusy=false; return; }
    const fd = fresh.data();
    const players = await avalonFreshPlayers(fd.roles||{});
    const votes = fd.teamVotes || {};
    if(!players.every(p=> votes[p.id]!=null)){ resolveBusy=false; return; }
    const t = avalonTally(votes);
    const patch = {phase:"voteresult", lastActivityAt: Date.now()};
    if(!t.approved) patch.rejectCount = (fd.rejectCount||0)+1;
    await roomRef.update(patch);
  }catch(e){}
  resolveBusy = false;
}

async function doAvalonContinueVote(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="voteresult"){ voteBusy=false; return; }
    const fd = fresh.data();
    const t = avalonTally(fd.teamVotes);
    if(t.approved){
      await roomRef.update({phase:"mission", missionVotes:{}, rejectCount:0, lastActivityAt: Date.now()});
    } else if((fd.rejectCount||0)>=5){
      await roomRef.update({phase:"ended", winner:"evil", winReason:"reject5", lastActivityAt: Date.now()});
    } else {
      const players = await avalonFreshPlayers(fd.roles||{});
      const leaderId = avalonNextLeader(players.map(p=>p.id), fd.leaderId);
      await roomRef.update({phase:"team", leaderId, teamSelection:[], teamVotes:{}, missionVotes:{}, lastActivityAt: Date.now()});
    }
  }catch(e){}
  voteBusy = false;
}

async function doMissionCard(card){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const lease = await avalonLease();
    if(!lease.acquired){ voteBusy=false; return; }
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="mission"){ voteBusy=false; return; }
    const fd = fresh.data();
    const team = fd.teamSelection || [];
    if(!team.includes(identity.playerId)){ voteBusy=false; return; }
    if((fd.missionVotes||{})[identity.playerId]!=null){ voteBusy=false; return; }
    // 好人只能出成功，就算畫面被改過也一樣。
    const myCard = (card==="fail" && isEvilRole((fd.roles||{})[identity.playerId])) ? "fail" : "success";
    const missionVotes = Object.assign({}, fd.missionVotes||{}, {[identity.playerId]: myCard});
    const players = await avalonFreshPlayers(fd.roles||{});
    const members = team.filter(id=>players.some(p=>p.id===id));
    const allVoted = members.every(id=> missionVotes[id]!=null);
    await roomRef.update({missionVotes, lastActivityAt: Date.now()});
    if(allVoted) await resolveMission();
  }catch(e){}
  voteBusy = false;
}

// 所有隊員出完牌後結算：失敗票數達標（第 4 輪 7 人以上要 2 張）任務才失敗。
async function resolveMission(){
  if(resolveBusy) return;
  resolveBusy = true;
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="mission"){ resolveBusy=false; return; }
    const fd = fresh.data();
    const players = await avalonFreshPlayers(fd.roles||{});
    const team = fd.teamSelection || [];
    const mv = fd.missionVotes || {};
    const members = team.filter(id=>players.some(p=>p.id===id));
    if(!members.every(id=> mv[id]!=null)){ resolveBusy=false; return; }
    const missionNo = fd.missionNo || 1;
    const prev = fd.missionResults || [];
    if(prev.length>=missionNo){ resolveBusy=false; return; }
    const fails = team.filter(id=> mv[id]==="fail").length;
    const n = avalonClampN(Object.keys(fd.roles||{}).length);
    const ok = fails < avalonFailsNeeded(n, missionNo);
    await roomRef.update({
      phase:"missionresult", missionResults:[...prev, {ok, fails}], lastMissionFails: fails, lastActivityAt: Date.now()
    });
  }catch(e){}
  resolveBusy = false;
}

async function doAvalonContinueMission(){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const fresh = await roomRef.get().catch(()=>null);
    if(!fresh || !fresh.exists || fresh.data().phase!=="missionresult"){ voteBusy=false; return; }
    const fd = fresh.data();
    const results = fd.missionResults || [];
    const wins = results.filter(r=>r.ok).length;
    const losses = results.length - wins;
    if(losses>=3){
      await roomRef.update({phase:"ended", winner:"evil", winReason:"fail3", lastActivityAt: Date.now()});
    } else if(wins>=3){
      avalonPickDraft = []; avalonPickKey = "";
      await roomRef.update({phase:"assassin", assassinTarget:null, lastActivityAt: Date.now()});
    } else {
      const players = await avalonFreshPlayers(fd.roles||{});
      const leaderId = avalonNextLeader(players.map(p=>p.id), fd.leaderId);
      await roomRef.update({
        phase:"team", leaderId, missionNo:(fd.missionNo||1)+1, rejectCount:0,
        teamSelection:[], teamVotes:{}, missionVotes:{}, lastActivityAt: Date.now()
      });
    }
  }catch(e){}
  voteBusy = false;
}

async function doAssassinPick(targetId){
  if(voteBusy) return;
  voteBusy = true;
  try{
    const fresh = await roomRef.get().catch(()=>null);

}

// 把種子/修正流程中遇到的第一個錯誤顯示在題庫畫面上（例如 Firestore 規則沒開放寫入權限），方便排查。
function reportSeedError(prefix, e){
  if(bankLoadError) return; // 只留第一個錯誤，避免畫面被洗掉
  bankLoadError = prefix + "：" + ((e && (e.message||e.code)) || String(e));
  render();
}

async function ensureSeeded(d){
  try{
    const marker = d.doc("meta/questionsSeeded");
    const snap = await marker.get();
    if(snap.exists) return;
    await Promise.all(QUESTIONS.map((item,i)=>
      d.collection("customQuestions").doc("seed_"+i).set({
        q: item[0], options: item[1], category: item[2]||"other", builtin: true, createdAt: Date.now()
      })
    ));
    await marker.set({done:true, at: Date.now()});
  }catch(e){ reportSeedError("題庫初始化失敗（ensureSeeded）", e); }
}
// 第二批種子題（「關於你」題型），跟第一批分開用獨立標記，這樣已經玩過的房間也會補到新題目，不會重複。
async function ensureSeededV2(d){
  try{
    const marker = d.doc("meta/questionsSeededV2");
    const snap = await marker.get();
    if(snap.exists) return;
    await Promise.all(TARGETED_QUESTIONS.map((item,i)=>
      d.collection("customQuestions").doc("seedv2_"+i).set({
        q: item[0], options: item[1], category: item[2]||"aboutyou", builtin: true, targeted: true, createdAt: Date.now()
      })
    ));
    await marker.set({done:true, at: Date.now()});
  }catch(e){ reportSeedError("題庫初始化失敗（ensureSeededV2）", e); }
}

// 修正題庫的寫入邏輯：改成一筆一筆依序寫入「完整」內容（含 createdAt），把所有 seed_/seedv2_ 題目資料修好，
// 同時把題目文字裡的 {player}/{P} 改成更短的 PP。
async function ensureContentPatchV5(d){
  try{
    const marker = d.doc("meta/questionsContentPatchV5");
    const snap = await marker.get();
    if(snap.exists) return;
    const col = d.collection("customQuestions");
    for(let i=0;i<QUESTIONS.length;i++){
      const item = QUESTIONS[i];
      try{
        await col.doc("seed_"+i).set({
          q: item[0], options: item[1], category: item[2]||"other",
          builtin: true, targeted: true, createdAt: 1788857016000 + i
        });
      }catch(e){ reportSeedError("題庫寫入失敗（seed_"+i+"）", e); }
    }
    for(let i=0;i<TARGETED_QUESTIONS.length;i++){
      const item = TARGETED_QUESTIONS[i];
      try{
        await col.doc("seedv2_"+i).set({
          q: item[0], options: item[1], category: item[2]||"aboutyou",
          builtin: true, targeted: true, createdAt: 1788857017000 + i
        });
      }catch(e){ reportSeedError("題庫寫入失敗（seedv2_"+i+"）", e); }
    }
    await marker.set({done:true, at: Date.now()});
  }catch(e){ reportSeedError("題庫修正失敗（ensureContentPatchV5）", e); }
}

// ---------- boot ----------
(async ()=>{
  const vLine = document.getElementById("versionLine");
  if(vLine) vLine.textContent = `${APP_VERSION} · 更新於 ${APP_UPDATED}`;
  render();
  const d = await ensureDb();
  if(d){
    customQuestionsCol = d.collection("customQuestions");
    unsubCustomQuestions = customQuestionsCol.orderBy("createdAt","asc").onSnapshot(qsnap=>{
      bankLoadError = "";
      customQuestionsData = qsnap.docs.map(dd=>({id:dd.id, ...dd.data()}));
      render();
    }, err=>{
      // 常見原因：Firestore 安全規則沒開放 customQuestions 這個 collection 的讀取權限。
      bankLoadError = (err && (err.message||err.code)) || String(err);
      render();
    });
    ensureSeeded(d);
    ensureSeededV2(d);
    ensureContentPatchV5(d);
  }
  if(identity){
    if(!db){
      app.innerHTML = `<div class="card" style="text-align:center;"><p>目前無法連線到房間服務。</p><button class="btn-secondary" id="backBtn">回首頁</button></div>`;
      document.getElementById("backBtn").onclick = leaveToHome;
      return;
    }
    connectRoom();
  }
})();

// 手機切到背景、螢幕鎖定或網路重新連上時，即時連線常常會斷掉但不會自動補上；
// 回到前景 / 恢復網路時主動重新訂閱，不用使用者自己重新整理頁面。
let lastReconnectAt = 0;
function reconnectIfNeeded(){
  if(!identity || !roomRef) return;
  const now = Date.now();
  if(now - lastReconnectAt < 1500) return; // 避免短時間內重複觸發
  lastReconnectAt = now;
  connectRoom();
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible") reconnectIfNeeded();
});
window.addEventListener("focus", reconnectIfNeeded);
window.addEventListener("online", reconnectIfNeeded);
</script>
